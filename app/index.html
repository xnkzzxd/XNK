<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>XNK Catat</title>
<style>
:root{--bg:#fafaf9;--fg:#111;--mut:#6b6b66;--card:#fff;--line:#e5e5e1;--band:#0b0b0b;--on:#fff;--danger:#d92d20;--sa-b:env(safe-area-inset-bottom,0px);--sa-t:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0b0b;--fg:#f4f4f2;--mut:#9a9a94;--card:#171717;--line:#2a2a28;--band:#000}}
*{box-sizing:border-box}html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.4 system-ui,sans-serif;padding-bottom:calc(64px + var(--sa-b))}
header{background:var(--band);color:var(--on);padding:calc(12px + var(--sa-t)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header b{font-size:1.1rem}#st{font-size:.8rem;opacity:.8}
main{padding:16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:1rem;margin:0 0 8px}
input,select,button{font:inherit;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:0 12px}
input{width:100%;font-size:16px}
button{cursor:pointer}button.p{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
button.d{color:var(--danger)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.row>*{min-width:0}
.sets{display:grid;grid-template-columns:2rem 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.mut{color:var(--mut);font-size:.85rem}.big{font-size:1.6rem;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--band);padding-bottom:var(--sa-b)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--on);opacity:.6;min-height:56px}
nav button.on{opacity:1;font-weight:700}
.hit{padding:10px 4px;border-bottom:1px solid var(--line)}
.hide{display:none}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + var(--sa-b));background:var(--fg);color:var(--bg);padding:12px;border-radius:10px;display:none;z-index:9}
</style>
</head>
<body>
<header><b>XNK Catat</b><span id="st"></span><button id="syncb" class="hide" style="min-height:36px">Sinkron</button></header>
<main id="main"></main>
<nav id="nav" class="hide"><button data-t="w">Latihan</button><button data-t="f">Makan</button><button data-t="m">Ukuran</button><button data-t="p">Foto</button></nav>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
