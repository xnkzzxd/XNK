    // Countdown Timer
    function xnkTickCountdown(){
      const card = document.getElementById('pub-next-session-card');
      const out = document.getElementById('pub-next-countdown');
      if (!card || !out) return;
      const startStr = card.dataset.start;
      if (!startStr) { out.textContent = ''; return; }

      const diff = new Date(startStr).getTime() - Date.now();
      if (diff <= 0) { out.textContent = 'Sesi sedang berlangsung'; return; }

      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);

      out.textContent = d > 0
        ? d + 'h ' + h + 'j lagi'
        : String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    }

      const input = document.getElementById('pub-avatar-input');
      if (!input) return;

      input.addEventListener('change', function(e){
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) { window.showToast("Harap pilih file gambar (JPG/PNG)."); return; }

        window.cropContext = 'member';
        window.openCropModal(file);
        e.target.value = ''; 
      });
    })();

    window.openCropModal = function(file) {
      const reader = new FileReader();
      reader.onload = function(ev) {
        const dataUrl = ev.target.result;
        const cropImg = document.getElementById('cropper-image');
        
        cropImg.src = dataUrl;
        cropImg.classList.remove('hidden');

        // 1. Sembunyikan SEMUA modal di overlay
        const overlay = document.getElementById('modal-overlay');
        document.querySelectorAll('#modal-overlay > div').forEach(el => {
          el.classList.add('hide');
          el.classList.add('scale-95');
        });

        // 2. Aktifkan overlay utama & TAMBAHKAN items-center justify-center agar CENTER!
        overlay.classList.remove('hide'); 
        overlay.classList.remove('pointer-events-none');
        overlay.classList.add('flex', 'items-center', 'justify-center', 'opacity-100'); 
        overlay.classList.remove('opacity-0');
        
        // 3. Tampilkan modal crop
        const modCrop = document.getElementById('modal-crop-avatar'); 
        modCrop.classList.remove('hide'); 
        setTimeout(() => modCrop.classList.remove('scale-95'), 10);

        if (cropperInstance) { cropperInstance.destroy(); }
        setTimeout(() => {
          cropperInstance = new Cropper(cropImg, {
            aspectRatio: 1,
            viewMode: 1,
            dragMode: 'move',
            autoCropArea: 0.9,
            restore: false,
            guides: true,
            center: true,
            highlight: false,
            cropBoxMovable: true,
            cropBoxResizable: true,
            toggleDragModeOnDblclick: false,
          });
        }, 200);
      };
      reader.readAsDataURL(file);
    };

    window.cancelCrop = function() {
      document.getElementById('modal-crop-avatar').classList.add('hide');
      
      if (window.cropContext === 'coach') {
        document.getElementById('modal-add-coach').classList.remove('hide');
      } else {
        window.closeModal();
      }
    };

    window.saveCroppedAvatar = function() {
      if (!cropperInstance) return;

      const btn = document.getElementById('btn-save-crop');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin pointer-events-none"></i> Memproses...';
      btn.disabled = true;

      const canvas = cropperInstance.getCroppedCanvas({
        width: 400, height: 400, imageSmoothingEnabled: true, imageSmoothingQuality: 'high',
      });
      const croppedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
      const base64Data = croppedDataUrl.split(',')[1];
      
      if (window.cropContext === 'member') {
        const img = document.getElementById('pub-avatar-img');
        const placeholder = document.getElementById('pub-avatar-placeholder-icon');
        const avatarBtn = document.getElementById('pub-avatar-btn');
        
        // Update foto sementara di layar menggunakan base64
        img.src = croppedDataUrl; 
        img.classList.remove('hidden'); 
        placeholder.classList.add('hidden');
        avatarBtn.classList.remove('border-dashed','border-gray-300'); 
        avatarBtn.classList.add('border-solid','border-black');

        if (window.google && google.script && window.publicLoggedMember) {
          // 1. Upload ke Google Drive dulu
          window.memberApi()
            .withSuccessHandler(function(res){
              window.publicLoggedMember.photo = res.url;
              
              // 2. Pastikan file terupload, BARU simpan link ke database
              window.memberApi()
                .withSuccessHandler(function() {
                  // Jika sukses 100%, kembalikan tombol & TUTUP modal
                  btn.innerHTML = originalText; 
                  btn.disabled = false;
                  
                  // Menutup spesifik modal crop & overlay
                  document.getElementById('modal-crop-avatar').classList.add('hide');
                  const overlay = document.getElementById('modal-overlay');
                  if(overlay) {
                    overlay.classList.remove('flex', 'items-center', 'justify-center', 'opacity-100');
                    overlay.classList.add('hide', 'opacity-0');
                  }
                  if (typeof window.closeModal === 'function') window.closeModal();

                  window.showToast('Foto profil berhasil diperbarui');
                })
                .withFailureHandler(function(err) {
                  btn.innerHTML = originalText; 
                  btn.disabled = false; 
                  window.showToast('Gagal menyimpan foto ke profil: ' + err.message);
                })
                .updateMemberPhoto(res.url); // server memastikan ini foto milik klien yang login
            })
            .withFailureHandler(function(err){
              btn.innerHTML = originalText; 
              btn.disabled = false; 
              window.showToast('Gagal upload foto ke server: ' + err.message);
            })
            .uploadMemberPhoto(base64Data, 'avatar_' + window.publicLoggedMember.id + '.jpg', 'image/jpeg');
        } else {
          btn.innerHTML = originalText; btn.disabled = false;
        }

      } else if (window.cropContext === 'coach') {
        window.pendingCoachBase64 = base64Data;
        
        const preview = document.getElementById('coach-photo-preview');
        const fallback = document.getElementById('coach-photo-preview-fallback');
        
        preview.src = croppedDataUrl;
        preview.classList.remove('hide');
        fallback.classList.add('hide');

        btn.innerHTML = originalText; btn.disabled = false;
        
        document.getElementById('modal-crop-avatar').classList.add('hide');
        document.getElementById('modal-add-coach').classList.remove('hide');
      }
    };
</script>
