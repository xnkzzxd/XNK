<script>
    // =============================================================================
    // --- GLOBAL VARIABLES & STATE ---
    // =============================================================================
    window.isGas = typeof google !== 'undefined' && google.script;
    window.members = [];
    window.memberArchive = [];
    window.schedules = [];
    window.coaches = [];
    window.priceListData = []; 
    
    window.currentView = 'dashboard';
    window.selectedMemberId = null;
    window.selectedScheduleDetailId = null;
    window.isEditScheduleMode = false;
    
    window.isPublicView = false;
    window.publicLoggedMember = null;
    window.currentClientType = 'regular'; 
    
    const COACH_WA_NUMBER = " "; 

    // =============================================================================
    // --- HELPER FUNCTIONS ---
    // =============================================================================
    function formatRp(angka) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka); }
    function sanitizePhone(phone) { let p = phone.toString().replace(/\D/g, ''); if(p.startsWith('0')) p = '62' + p.substring(1); else if(p.startsWith('8')) p = '62' + p; return p; }
    
    window.sendToParentWA = function(phone, text) { 
      const cleanPhone = sanitizePhone(phone); 
      window.open('https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(text), '_blank'); 
    };
    
    window.showToast = function(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      if (!toast || !toastMsg) return;

      toastMsg.innerText = msg;
      clearTimeout(window._toastTimer);

      toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');

      window._toastTimer = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
        toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
      }, 3000);
    };

    // =============================================================================
    // --- AUTH: token admin (panel PT) & token member (portal klien) ---
    // =============================================================================
    // Server menolak semua fungsi admin tanpa token admin, dan fungsi portal klien
    // tanpa token member. adminApi()/memberApi() dipakai persis seperti
    // google.script.run, tapi otomatis menyisipkan token sebagai argumen pertama
    // dan membuka layar login lagi kalau sesinya sudah berakhir.
    const ADMIN_TOKEN_KEY = 'xnk_admin_token';
    const MEMBER_TOKEN_KEY = 'xnk_member_token';
    function _lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function _lsSet(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }

    window.isAuthError = function(err) {
      return !!err && String(err.message || err).indexOf('AUTH_REQUIRED') !== -1;
    };
    window.authMessage = function(err) {
      return String((err && err.message) || err || '').replace(/^.*AUTH_REQUIRED:\s*/, '');
    };

    function _tokenRunner(getToken, onAuthLost) {
      let onOk = null, onFail = null;
      const proxy = new Proxy({}, {
        get: function(_, prop) {
          if (prop === 'withSuccessHandler') return function(fn) { onOk = fn; return proxy; };
          if (prop === 'withFailureHandler') return function(fn) { onFail = fn; return proxy; };
          return function() {
            const args = [getToken()].concat(Array.prototype.slice.call(arguments));
            let runner = google.script.run.withFailureHandler(function(err) {
              if (window.isAuthError(err)) onAuthLost(err);
              if (onFail) onFail(err);
            });
            if (onOk) runner = runner.withSuccessHandler(onOk);
            return runner[prop].apply(runner, args);
          };
        }
      });
      return proxy;
    }
    window.adminApi = function() {
      return _tokenRunner(function() { return _lsGet(ADMIN_TOKEN_KEY); }, function(err) { window.onAdminAuthLost(err); });
    };
    window.memberApi = function() {
      return _tokenRunner(function() { return _lsGet(MEMBER_TOKEN_KEY); }, function(err) { window.onMemberAuthLost(err); });
    };

    // Buka tab WhatsApp SEKARANG (masih dalam klik user, supaya tidak diblokir
    // popup blocker), lalu isi alamatnya setelah data dari server datang.
    window.openPendingWindow = function() {
      let w = null;
      try { w = window.open('', '_blank'); } catch (e) {}
      return {
        go: function(url) { if (w && !w.closed) w.location.href = url; else window.open(url, '_blank'); },
        cancel: function() { try { if (w && !w.closed) w.close(); } catch (e) {} }
      };
    };
    window.waUrl = function(phone, text) {
      return 'https://wa.me/' + sanitizePhone(phone || '') + '?text=' + encodeURIComponent(text || '');
    };

    window._iconTimer = null;
    window.scheduleIconUpdate = function() {
      if (window._iconTimer) clearTimeout(window._iconTimer);
      window._iconTimer = setTimeout(function() {
        try { lucide.createIcons(); } catch(e) {}
        window._iconTimer = null;
      }, 50);
    };

    (function() {
      if (typeof MutationObserver === 'undefined') return;
      var observer = new MutationObserver(function() {
        window.scheduleIconUpdate();
      });
      observer.observe(document.body, { childList: true, subtree: true, attributes: false, characterData: false });
    })();

    window.confirmCallback = null;

    window.showConfirmModal = function(message, onConfirm, options = {}) {
      const { title = 'Konfirmasi', confirmText = 'Ya, Lanjutkan', cancelText = 'Batal', variant = 'default' } = options;

      document.getElementById('confirm-modal-title').textContent = title;
      document.getElementById('confirm-modal-message').innerHTML = message;

      const btnYes = document.getElementById('btn-confirm-modal-yes');
      const btnNo  = document.getElementById('btn-confirm-modal-no');
      btnYes.textContent = confirmText;
      btnNo.textContent = cancelText;

      const iconWrap = document.getElementById('confirm-modal-icon-wrap');
      const icon = document.getElementById('confirm-modal-icon');

      if (variant === 'danger') {
        btnYes.className = 'flex-1 min-h-[48px] bg-red-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-red-700 active:bg-red-800 transition-colors';
        iconWrap.className = 'w-11 h-11 rounded-full flex items-center justify-center shrink-0 bg-red-50';
        icon.setAttribute('data-lucide', 'alert-triangle');
        icon.className = 'w-6 h-6 text-red-600 pointer-events-none';
      } else {
        btnYes.className = 'flex-1 min-h-[48px] bg-black text-white py-3 rounded-xl font-bold text-sm hover:bg-gray-800 active:bg-gray-900 transition-colors';
        iconWrap.className = 'w-11 h-11 rounded-full flex items-center justify-center shrink-0 bg-gray-100';
        icon.setAttribute('data-lucide', 'help-circle');
        icon.className = 'w-6 h-6 text-gray-600 pointer-events-none';
      }

      window.confirmCallback = onConfirm;
      const modal = document.getElementById('modal-confirm');
      const box = modal.querySelector(':scope > div');
      modal.classList.remove('hide');
      if (window.lucide) window.lucide.createIcons();
      requestAnimationFrame(() => box.classList.remove('scale-95'));
    };

    window.closeConfirmModal = function() {
      const modal = document.getElementById('modal-confirm');
      const box = modal.querySelector(':scope > div');
      box.classList.add('scale-95');
      setTimeout(() => modal.classList.add('hide'), 200);
      window.confirmCallback = null;
    };

    window.handleConfirmModalYes = function() {
      const cb = window.confirmCallback;
      window.closeConfirmModal();
      if (typeof cb === 'function') cb();
    };

    // =============================================================================
    // --- NAVIGATION & VIEWS ---
    // =============================================================================
    window.navigate = function(viewId) {
      ['dashboard', 'calendar', 'clients', 'profile', 'coaches', 'coach-profile', 'public-catalog', 'public-login', 'public-dashboard', 'public-coaches']
      .forEach(v => {
        const el = document.getElementById('view-' + v);
        if(el) { el.classList.add('hide'); el.classList.remove('opacity-100'); }
      });
      
      const isPub = viewId.startsWith('public-') || viewId === 'calendar' && window.isPublicView;
      if (viewId !== 'calendar') {
          window.isPublicView = isPub;
      }
      
      document.getElementById('admin-header-actions').classList.toggle('hide', window.isPublicView);
      document.getElementById('public-header-actions').classList.toggle('hide', !window.isPublicView && !window.publicLoggedMember);
      document.getElementById('admin-bottom-nav').classList.toggle('hide', window.isPublicView);
      
      const pubMenu = document.getElementById('public-menu-bar');
      if (pubMenu) pubMenu.classList.toggle('hide', !window.isPublicView);

      const titles = {
        'dashboard': 'Dashboard', 'calendar': window.isPublicView ? 'Jadwal Tersedia' : 'Kalender', 'clients': 'Klien', 
        'profile': 'Profil Klien', 'coaches': 'Tim Coach', 'coach-profile': 'Profil Coach',
        'public-catalog': 'Pilih Paket', 'public-login': 'Member Area', 'public-dashboard': 'Dashboardku',
        'public-coaches': 'Tim Coach'
      };
      document.getElementById('page-title').innerText = titles[viewId] || 'XNK';

      const targetEl = document.getElementById('view-' + viewId);
      if(targetEl) {
        targetEl.classList.remove('hide');
        setTimeout(() => targetEl.classList.add('opacity-100'), 10);
      }
      
      window.currentView = viewId;

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isActive = btn.dataset.view === viewId;
        btn.classList.toggle('text-black', isActive);
        btn.classList.toggle('font-bold', isActive);
        btn.classList.toggle('text-gray-400', !isActive);
        btn.classList.toggle('md:bg-gray-100', isActive);
      });

      if (window.isPublicView) {
        document.querySelectorAll('.pub-nav-btn').forEach(btn => {
          btn.classList.remove('text-black'); btn.classList.add('text-gray-500');
          let btnText = btn.innerText.toLowerCase();
          let viewMatch = viewId.replace('public-', '');
          if(viewMatch === 'catalog') viewMatch = 'paket';
          if(viewMatch === 'login' || viewMatch === 'dashboard') viewMatch = 'member';
          if(viewId === 'calendar') viewMatch = 'jadwal';
          if(viewMatch === 'coaches') viewMatch = 'coach';
          
          if(btnText.includes(viewMatch)) {
            btn.classList.add('text-black'); btn.classList.remove('text-gray-500');
          }
        });
      }
      
      window.scheduleIconUpdate();

      if (viewId === 'calendar') setTimeout(() => window.initCalendar(), 100);
      if (viewId === 'dashboard') window.renderDashboard();
      if (viewId === 'public-catalog') window.renderPriceList();
      if (viewId === 'public-coaches') window.renderPublicCoaches();
      if (viewId === 'public-dashboard') window.renderPublicDashboard();
      
      document.getElementById('main-scroll-area').scrollTo(0,0);
    };

    // =============================================================================
    // --- INIT APP ---
    // =============================================================================
    window.onload = function() {
      // Scripts.html juga di-include di Landing.html, yang punya logikanya sendiri.
      if (!document.getElementById('main-scroll-area')) return;
      lucide.createIcons();

      const start = function(params) {
        if (params.view === 'public') {
          window.isPublicView = true;
          window.navigate('public-catalog');
          window.startPublicPortal(params.k);
        } else {
          window.navigate('dashboard');
          window.startAdminPanel();
        }
      };

      if (window.isGas) {
        google.script.url.getLocation(function(location) { start(location.parameter || {}); });
      } else {
        const params = {};
        new URLSearchParams(window.location.search).forEach(function(v, k) { params[k] = v; });
        start(params);
      }
    };

    window.hideGlobalLoader = function() {
      const loader = document.getElementById('global-loader');
      if (!loader) return;
      loader.classList.add('opacity-0');
      setTimeout(() => loader.classList.add('hide'), 300);
    };
    window.showGlobalLoader = function() {
      const loader = document.getElementById('global-loader');
      if (!loader) return;
      loader.classList.remove('hide', 'opacity-0');
    };

    // =============================================================================
    // --- PANEL PT: LOGIN ADMIN ---
    // =============================================================================
    window.startAdminPanel = function() {
      if (!window.isGas) { window.loadAllData(); return; }
      if (!_lsGet(ADMIN_TOKEN_KEY)) { window.showAdminLogin(); return; }
      window.adminApi()
        .withSuccessHandler(function() { window.loadAllData(); })
        .withFailureHandler(function(err) {
          if (!window.isAuthError(err)) window.showAdminLogin('Gagal terhubung: ' + err.message);
        })
        .checkAdminSession();
    };

    window.showAdminLogin = function(message) {
      window.hideGlobalLoader();
      const box = document.getElementById('admin-login');
      if (!box) return;
      box.classList.remove('hide');
      const errEl = document.getElementById('admin-login-error');
      if (errEl) errEl.textContent = message || '';
      const pin = document.getElementById('admin-pin');
      if (pin) { pin.value = ''; setTimeout(() => pin.focus(), 50); }
    };

    window.onAdminAuthLost = function(err) {
      if (window.isPublicView) return; // portal klien tidak pernah pakai sesi admin
      _lsSet(ADMIN_TOKEN_KEY, null);
      window.members = []; window.memberArchive = []; window.schedules = [];
      window.showAdminLogin(window.authMessage(err));
    };

    window.handleAdminLogin = function(e) {
      e.preventDefault();
      const pinEl = document.getElementById('admin-pin');
      const errEl = document.getElementById('admin-login-error');
      const btn = document.getElementById('admin-login-btn');
      const pin = pinEl ? pinEl.value.trim() : '';
      if (!pin) return;
      btn.disabled = true; btn.textContent = 'Memeriksa...';
      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false; btn.textContent = 'Masuk';
          _lsSet(ADMIN_TOKEN_KEY, res.token);
          pinEl.value = '';
          document.getElementById('admin-login').classList.add('hide');
          window.showGlobalLoader();
          window.loadAllData();
        })
        .withFailureHandler(function(err) {
          btn.disabled = false; btn.textContent = 'Masuk';
          errEl.textContent = err.message;
          pinEl.value = ''; pinEl.focus();
        })
        .adminLogin(pin);
    };

    window.openAdminProfileMenu = function() {
      window.showConfirmModal('Keluar dari panel PT di perangkat ini? Kamu perlu memasukkan PIN lagi untuk masuk.', function() {
        _lsSet(ADMIN_TOKEN_KEY, null);
        window.members = []; window.memberArchive = []; window.schedules = [];
        window.updateMemberUI(); window.navigate('dashboard');
        window.showAdminLogin('Kamu sudah keluar.');
      }, { title: 'Keluar?', confirmText: 'Ya, Keluar' });
    };

    // Panel PT (admin): semua data, hanya dengan token admin yang sah.
    window.loadAllData = function() {
      if (window.isGas) {
        let loaded = 0; const totalReqs = 5;
        const checkDone = () => { loaded++; if(loaded >= totalReqs) { window.hideGlobalLoader(); window.updateUI(); } };

        window.adminApi().withSuccessHandler(res => { window.members = res || []; checkDone(); }).withFailureHandler(checkDone).getMembers();
        window.adminApi().withSuccessHandler(res => { window.memberArchive = res || []; checkDone(); }).withFailureHandler(checkDone).getMemberTransactionLog();
        window.adminApi().withSuccessHandler(res => { window.schedules = res || []; checkDone(); }).withFailureHandler(checkDone).getSchedules();
        google.script.run.withSuccessHandler(res => { window.coaches = res || []; checkDone(); }).withFailureHandler(checkDone).getCoaches();
        google.script.run.withSuccessHandler(res => { window.priceListData = res || []; checkDone(); }).withFailureHandler(checkDone).getPriceList();
      } else {
        window.members = [{id: 'PT-1', name: 'John Doe', phone: '628123', goal: 'Turun BB', totalSessions: 10, usedSessions: 2}];
        window.memberArchive = [];
        window.schedules = [
            {id: 'SCH-1', memberId: 'PT-1', title: 'John Doe', phone: '628123', start: new Date().toISOString(), end: new Date(new Date().getTime()+3600000).toISOString(), notes: 'Leg day', status: 'UNREAD', coachId: 'C-1', coachName: 'Budi'},
            {id: 'SCH-2', memberId: 'PT-2', title: 'Jane Doe', phone: '628124', start: new Date(new Date().getTime()+7200000).toISOString(), end: new Date(new Date().getTime()+10800000).toISOString(), notes: '', status: 'AVAILABLE', coachId: 'C-1', coachName: 'Budi'}
        ];
        window.coaches = [{id: 'C-1', name: 'Budi', phone: '628999', specialty: 'Strength'}];
        window.priceListData = [
          {id: 'P1', namaPaket: 'Regular Basic', kategori: 'regular', harga: 250000, jumlahSesi: 4, durasi: '1 Bulan', deskripsi: 'Latihan mandiri satu lawan satu.', benefit: ['1 on 1', 'Program', 'Fleksibel']},
          {id: 'P2', namaPaket: 'Student Pro', kategori: 'student', harga: 500000, jumlahSesi: 8, durasi: '1 Bulan', deskripsi: 'Latihan intensif & tracking.', benefit: ['1 on 1', 'Diet Tracking', 'Fleksibel']},
          {id: 'P3', namaPaket: 'Flex Premium', kategori: 'premium', harga: 1500000, jumlahSesi: '', durasi: 'Unlmited', deskripsi: 'Bebas kapan saja.', benefit: ['All Access', 'Diet Tracking', 'Fleksibel']}
        ];
        setTimeout(() => { window.hideGlobalLoader(); window.updateUI(); }, 500);
      }
    };

    // Portal klien (?view=public): hanya data publik + data milik klien yang login.
    // Daftar klien lain TIDAK pernah dikirim ke browser.
    window.loadPublicData = function() {
      if (!window.isGas) { window.loadAllData(); return; }
      const token = _lsGet(MEMBER_TOKEN_KEY);
      let loaded = 0; const totalReqs = token ? 4 : 3;
      const checkDone = () => { loaded++; if (loaded >= totalReqs) { window.hideGlobalLoader(); window.updateUI(); } };
      window.members = []; window.memberArchive = [];

      google.script.run.withSuccessHandler(res => { window.schedules = res || []; checkDone(); }).withFailureHandler(checkDone).getPublicSchedules(token);
      google.script.run.withSuccessHandler(res => { window.coaches = res || []; checkDone(); }).withFailureHandler(checkDone).getCoaches();
      google.script.run.withSuccessHandler(res => { window.priceListData = res || []; checkDone(); }).withFailureHandler(checkDone).getPriceList();
      if (token) {
        window.memberApi().withSuccessHandler(m => { window.setPublicMember(m); checkDone(); }).withFailureHandler(checkDone).getMemberProfile();
      }
    };

    window.updateUI = function() {
      window.updateDashboardStats();
      window.updateMemberUI();
      window.updateCoachUI();
      window.renderPriceCategories();
      if (window.isPublicView && window.publicLoggedMember && window._openMemberDashboard) {
        window._openMemberDashboard = false;
        window.navigate('public-dashboard');
      }
      if(window.currentView === 'dashboard') window.renderDashboard();
      if(window.currentView === 'public-dashboard' && window.publicLoggedMember) window.renderPublicDashboard();
      if(window.currentView === 'public-catalog') window.renderPriceList();
      if(window.currentView === 'public-coaches') window.renderPublicCoaches();
      window.checkUnreadBookings();
    };

    let closeTimeout;

    window.closeModal = function() {
      const overlay = document.getElementById('modal-overlay');
      if (!overlay) return;

      window.isRescheduleMode = false;
      window.rescheduleScheduleId = null;

      if (window.closeTimeout) clearTimeout(window.closeTimeout);

      overlay.classList.add('pointer-events-none');
      overlay.classList.remove('opacity-100');
      overlay.classList.add('opacity-0');

      const modals = document.querySelectorAll('#modal-overlay > div');
      modals.forEach(el => {
          el.classList.remove('scale-100');
          el.classList.add('scale-95');
      });

      window.closeTimeout = setTimeout(() => {
          overlay.classList.add('hide');
          overlay.classList.remove('flex');
          overlay.classList.remove('pointer-events-none');
          modals.forEach(el => el.classList.add('hide'));
      }, 300);
    };

    // =============================================================================
    // --- FEATURE: ADMIN NOTIFICATIONS ---
    // =============================================================================
    window.checkUnreadBookings = function() {
      if(window.isPublicView) return;
      const unreadCount = window.schedules.filter(s => s.status === 'unread').length;
      const badge = document.getElementById('unread-badge');
      const notifBtn = document.getElementById('notification-btn');
      if (!badge || !notifBtn) return;
      
      const newBtn = notifBtn.cloneNode(true);
      notifBtn.parentNode.replaceChild(newBtn, notifBtn);
      
      if (unreadCount > 0) {
        badge.classList.remove('hide');
      } else {
        badge.classList.add('hide');
      }

      newBtn.addEventListener('click', function() {
         window.openNotificationModal();
      });
    };

    window.openNotificationModal = function() {
        const unreadSchedules = window.schedules.filter(s => s.status === 'unread');
        const listEl = document.getElementById('notification-list');
        const actionEl = document.getElementById('notification-action');
        
        if (!listEl) return;
        
        if (unreadSchedules.length === 0) {
            listEl.innerHTML = `
              <div class="text-center py-8 text-gray-500">
                <i data-lucide="bell-off" class="w-12 h-12 mx-auto mb-3 text-gray-300"></i>
                <p class="text-sm font-medium">Tidak ada notifikasi baru saat ini.</p>
              </div>`;
            if(actionEl) actionEl.classList.add('hide');
        } else {
            let html = '<div class="space-y-3">';
            unreadSchedules.forEach(s => {
                const d = new Date(s.start);
                const timeStr = d.toLocaleDateString('id-ID', {weekday:'short', day:'numeric', month:'short'}) + ' • ' + d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
                html += `
                    <div class="p-4 rounded-2xl border border-amber-100 bg-amber-50/50 flex items-start gap-3">
                        <div class="w-10 h-10 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center shrink-0">
                            <i data-lucide="calendar-clock" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <p class="text-sm font-bold text-gray-900">Booking Baru: ${escapeHtml(s.title)}</p>
                            <p class="text-xs text-gray-500 mt-1">${timeStr}</p>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            listEl.innerHTML = html;
            if(actionEl) actionEl.classList.remove('hide');
        }
        
        try { window.lucide.createIcons(); } catch(e) {}
        
        const overlay = document.getElementById('modal-overlay');
        document.querySelectorAll('#modal-overlay > div').forEach(el => el.classList.add('hide'));
        overlay.classList.remove('hide'); 
        overlay.classList.add('flex'); 
        setTimeout(() => overlay.classList.remove('opacity-0'), 10);
        
        const mod = document.getElementById('modal-notifications');
        if (mod) {
            mod.classList.remove('hide'); 
            setTimeout(() => mod.classList.remove('scale-95'), 10);
        }
    };

    window.markNotificationsRead = function() {
        const unreadIds = window.schedules.filter(s => s.status === 'unread').map(s => s.id);
        if(window.isGas) window.adminApi().markSchedulesAsRead(unreadIds);
        
        window.schedules.forEach(s => { if(s.status === 'unread') s.status = 'read'; });
        window.checkUnreadBookings(); 
        
        window.closeModal();
        window.navigate('calendar');
        window.showToast('Membuka kalender...');
    };

    // 1. Tambahkan fungsi khusus penutup ini
    window.closeNotificationModal = function() {
      const mod = document.getElementById('modal-notifications');
      if (mod) {
        mod.classList.add('hide', 'scale-95');
      }
      
      const overlay = document.getElementById('modal-overlay');
      if (overlay) {
        overlay.classList.add('hide', 'opacity-0');
        overlay.classList.remove('flex');
      }
      
      // Panggil closeModal bawaan untuk berjaga-jaga mereset state lain
      if (typeof window.closeModal === 'function') {
        window.closeModal();
      }
    };

    // 2. Perbarui fungsi markNotificationsRead Anda menjadi seperti ini:
    window.markNotificationsRead = function() {
      const unreadIds = window.schedules.filter(s => s.status === 'unread').map(s => s.id);
      if(window.isGas) window.adminApi().markSchedulesAsRead(unreadIds);
      
      window.schedules.forEach(s => { if(s.status === 'unread') s.status = 'read'; });
      window.checkUnreadBookings(); 
      
      // Gunakan fungsi penutup yang baru saja dibuat
      window.closeNotificationModal(); 
      
      window.navigate('calendar');
      window.showToast('Membuka kalender...');
    };

    // =============================================================================
    // --- STATS & CHARTS ---
    // =============================================================================
    window.animateCountUp = function(el, target, suffix) {
      suffix = suffix || '';
      const start = performance.now();
      const dur = 900;
      function frame(t) {
        const p = Math.min(1, (t - start) / dur);
        const eased = 1 - Math.pow(1 - p, 3);
        el.innerHTML = Math.round(target * eased) + (suffix ? '<span class="text-sm text-gray-400">' + suffix + '</span>' : '');
        if (p < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    };

    // =============================================================================
    // --- PEAK HOUR HEATMAP ---
    // Dihitung client-side dari window.schedules (data sudah ter-load di memori,
    // sama seperti stat lain di dashboard), semua status booking ikut dihitung.
    // Jam operasional: Senin-Sabtu 06:00-21:00, Minggu 06:00-12:00.
    // =============================================================================
    window.PEAK_HOUR_DAY_CONFIG = [
      { key: 'mon', label: 'Sen', jsDay: 1, startHour: 6, endHour: 21 },
      { key: 'tue', label: 'Sel', jsDay: 2, startHour: 6, endHour: 21 },
      { key: 'wed', label: 'Rab', jsDay: 3, startHour: 6, endHour: 21 },
      { key: 'thu', label: 'Kam', jsDay: 4, startHour: 6, endHour: 21 },
      { key: 'fri', label: 'Jum', jsDay: 5, startHour: 6, endHour: 21 },
      { key: 'sat', label: 'Sab', jsDay: 6, startHour: 6, endHour: 21 },
      { key: 'sun', label: 'Min', jsDay: 0, startHour: 6, endHour: 12 }
    ];

    window.computePeakHourData = function() {
      const dayMap = {};
      window.PEAK_HOUR_DAY_CONFIG.forEach(cfg => {
        const counts = {};
        for (let h = cfg.startHour; h < cfg.endHour; h++) counts[h] = 0;
        dayMap[cfg.jsDay] = { config: cfg, counts };
      });

      (window.schedules || []).forEach(s => {
        if (!s.start) return;
        const d = new Date(s.start);
        if (isNaN(d.getTime())) return;
        const bucket = dayMap[d.getDay()];
        if (!bucket) return;
        const hour = d.getHours();
        if (hour >= bucket.config.startHour && hour < bucket.config.endHour) {
          bucket.counts[hour] = (bucket.counts[hour] || 0) + 1;
        }
      });

      return window.PEAK_HOUR_DAY_CONFIG.map(cfg => {
        const bucket = dayMap[cfg.jsDay];
        const hours = [];
        for (let h = cfg.startHour; h < cfg.endHour; h++) hours.push({ hour: h, count: bucket.counts[h] || 0 });
        return { key: cfg.key, label: cfg.label, hours };
      });
    };

    window.renderPeakHourHeatmap = function() {
      const el = document.getElementById('peak-hour-heatmap');
      if (!el) return;

      const days = window.computePeakHourData();
      let maxCount = 1;
      days.forEach(d => d.hours.forEach(h => { if (h.count > maxCount) maxCount = h.count; }));

      const fullHours = [];
      for (let h = 6; h < 21; h++) fullHours.push(h);
      const nCols = fullHours.length;

      function cellColor(count) {
        if (count === 0) return '#f0efec';
        const t = Math.min(1, count / maxCount);
        const from = [199, 197, 191], to = [10, 10, 10];
        const rgb = from.map((c, i) => Math.round(c + (to[i] - c) * t));
        return 'rgb(' + rgb.join(',') + ')';
      }

      const gridCols = 'minmax(28px,auto) repeat(' + nCols + ', 1fr)';

      let html = '<div class="xnk-heat-grid" style="display:grid;grid-template-columns:' + gridCols + ';gap:2px;width:100%;">';

      // Header jam (kolom pertama kosong utk sejajar dgn label hari)
      html += '<div></div>';
      fullHours.forEach(h => {
        html += '<div class="text-center font-bold text-gray-400" style="font-size:9px;">' + h + '</div>';
      });

      // Baris per hari
      days.forEach(day => {
        html += '<div class="font-bold text-gray-500 flex items-center" style="font-size:10px;">' + day.label + '</div>';
        fullHours.forEach(h => {
          const match = day.hours.find(x => x.hour === h);
          if (!match) {
            html += '<div style="aspect-ratio:1/1;background:transparent;border-radius:3px;"></div>';
          } else {
            const title = day.label + ' ' + String(h).padStart(2,'0') + ':00 — ' + match.count + ' booking';
            html += '<div class="cursor-default transition-transform hover:scale-110" style="aspect-ratio:1/1;border-radius:3px;background:' + cellColor(match.count) + '" title="' + title + '"></div>';
          }
        });
      });

      html += '</div>';
      el.innerHTML = html;
    };

    // Parse tanggal format "D/M/YYYY" (format yang disimpan backend) dengan aman.
    // new Date("28/8/2026") tidak reliable di semua browser (bukan format standar),
    // jadi selalu urai manual dulu, baru fallback ke Date() native untuk format lain (ISO, dsb).
    window.parseFlexibleDate = function(str) {
      if (!str) return new Date();
      if (str instanceof Date) return str;
      const parts = String(str).split('/');
      if (parts.length === 3) {
        const day = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10) - 1;
        const year = parseInt(parts[2], 10);
        const d = new Date(year, month, day);
        if (!isNaN(d)) return d;
      }
      const fallback = new Date(str);
      return isNaN(fallback) ? new Date() : fallback;
    };

    window.updateMemberUI = function() {

      const combined = [];

      window.members.forEach(m => {
        const activityDateRaw = m.lastActivityDate || m.joinDate || m.createdAt || new Date().toISOString();
        combined.push({ type: 'live', data: m, sortDate: window.parseFlexibleDate(activityDateRaw) });

      (window.memberArchive || []).forEach(a => {
        combined.push({ type: 'archive', data: a, sortDate: window.parseFlexibleDate(a.date) });
      });

      combined.sort((a, b) => a.sortDate - b.sortDate);

      let html = '';

      Array.from(items).forEach(el => {
        if (el.classList.contains('month-divider')) {

    window.openProfile = function(id) {
      try {
        if(window.isPublicView) return;
        const mem = window.members.find(m => String(m.id) === String(id)); 
        if(!mem) { window.showToast('Error: Data klien tidak ditemukan.'); return; }
        window.selectedMemberId = id; 
        
        const elName = document.getElementById('profile-name');
        const elPhone = document.getElementById('profile-phone');
        const elGoal = document.getElementById('profile-goal');
        const elDate = document.getElementById('profile-date');
        const elRemaining = document.getElementById('profile-remaining');
        const elTotal = document.getElementById('profile-total');
        const elProgress = document.getElementById('profile-progress');
        const elBadge = document.getElementById('profile-status-badge');
        const elWaBtn = document.getElementById('profile-wa-btn');
        const elPhoto = document.getElementById('profile-photo');
        const elPhotoFallback = document.getElementById('profile-photo-fallback');

        if (elPhoto && elPhotoFallback) {
          if (mem.photo && mem.photo.trim() !== '') {
            elPhoto.src = mem.photo;
            elPhoto.classList.remove('hide');
            elPhotoFallback.classList.add('hide');
            elPhoto.onerror = function() {
              elPhoto.classList.add('hide');
              elPhotoFallback.classList.remove('hide');
            };
          } else {
            elPhoto.classList.add('hide');
            elPhotoFallback.classList.remove('hide');
          }
        }

        if(elName) elName.innerText = mem.name || 'Klien'; 
        if(elPhone) elPhone.innerText = mem.phone || '-';
        
        let displayGoal = mem.goal || '-';
        if(typeof displayGoal === 'string' && displayGoal.includes('|')) { 
           const parts = displayGoal.split('|'); 
           if(elGoal) elGoal.innerHTML = escapeHtml(parts[0].trim()) + '<br><span class="text-[10px] bg-gray-200 text-gray-700 px-2 py-1 rounded inline-block mt-1.5 font-bold">' + escapeHtml(parts[1] ? parts[1].trim() : '') + '</span>'; 
        } else { 
           if(elGoal) elGoal.innerText = displayGoal; 
        }
        
        if(elDate) elDate.innerText = mem.joinDate || '-';

        const elPackage = document.getElementById('profile-package');
        if(elPackage) elPackage.innerText = mem.packageName || 'Custom / Tanpa Paket';

        const elCoach = document.getElementById('profile-coach');
        if(elCoach) elCoach.innerText = mem.preferredCoachName || 'Belum Ditentukan';
        
        const total = mem.totalSessions || 10; 
        const used = mem.usedSessions || 0; 
        const isExpired = used >= total;
        const remaining = Math.max(0, total - used);
        
        if(elRemaining) elRemaining.innerText = remaining; 
        if(elTotal) elTotal.innerText = total; 
        if(elProgress) elProgress.style.width = (used / total * 100) + "%";
        
        if(elBadge) {
          elBadge.innerText = isExpired ? 'HABIS' : 'AKTIF'; 
          elBadge.className = 'text-white text-[10px] font-bold px-3 py-1.5 rounded-full uppercase tracking-wider whitespace-nowrap shrink-0 mt-1 ' + (isExpired ? 'bg-red-500' : 'bg-green-500');
        }
        
        if(elWaBtn) elWaBtn.onclick = function() { window.sendToParentWA(mem.phone, ''); };
        
        const histContainer = document.getElementById('profile-history'); 
        if (histContainer) {
            histContainer.innerHTML = '';
            const memSchedules = window.schedules.filter(s => String(s.memberId) === String(id) && String(s.status).toUpperCase() !== 'AVAILABLE').sort((a,b) => new Date(b.start) - new Date(a.start)); 
            
            if(memSchedules.length > 0) {
              memSchedules.forEach(s => {
                const d = new Date(s.start); const dateStr = d.toLocaleDateString('id-ID', {weekday:'short', day:'numeric', month:'short'}); const timeStr = d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
                const isUpcoming = d >= new Date(); const badgeCol = String(s.status).toUpperCase() === 'COMPLETED' ? 'bg-green-100 text-green-800' : (isUpcoming ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-500');
                const badgeText = String(s.status).toUpperCase() === 'COMPLETED' ? 'Selesai' : (isUpcoming ? 'Akan Datang' : 'Terlewat'); const coachName = s.coachName && s.coachName !== "Belum Ditugaskan" ? s.coachName : "-";

                histContainer.innerHTML += '<div class="border border-gray-100 rounded-xl p-3 flex justify-between items-center bg-gray-50">' +
                   '<div><p class="text-xs font-bold text-gray-900">' + dateStr + ' • ' + timeStr + '</p><p class="text-[10px] text-gray-500 mt-0.5"><i data-lucide="contact-2" class="w-3 h-3 inline"></i> Coach: ' + escapeHtml(coachName) + '</p></div>' +
                   '<div class="text-right"><span class="' + badgeCol + ' text-[9px] font-bold px-2 py-0.5 rounded uppercase">' + badgeText + '</span></div>' +
                '</div>';
              });
            } else { histContainer.innerHTML = '<p class="text-xs text-gray-400 italic">Belum ada riwayat jadwal.</p>'; }
        }

        try { window.lucide.createIcons(); } catch(e) {}
        window.navigate('profile');
      } catch (error) { 
        console.error(error);
        window.showToast('Gagal memuat profil: ' + error.message); 
      }
    };

    window.initCalendar = function() {
      const calendarEl = document.getElementById('calendar');
      if(!calendarEl) return;
      
      const filterEl = document.getElementById('calendar-coach-filter');
      const filterWrapper = document.getElementById('calendar-public-filter');
      let selectedCoach = 'ALL';
      
      if (window.isPublicView) {
         if(filterWrapper) filterWrapper.classList.remove('hide');
         if(filterEl) {
             if (filterEl.options.length <= 1) {
                 window.coaches.forEach(c => {
                     filterEl.innerHTML += '<option value="' + escapeHtml(c.id) + '">Coach ' + escapeHtml(c.name) + '</option>';
                 });
             }
             selectedCoach = filterEl.value;
         }
      } else {
         if(filterWrapper) filterWrapper.classList.add('hide');
      }

      let filteredSchedules = window.schedules;
      if (selectedCoach !== 'ALL') {
          filteredSchedules = filteredSchedules.filter(s => String(s.coachId) === String(selectedCoach));
      }

      const displayEvents = filteredSchedules.map(function(s) {
        const statusStr = String(s.status).toUpperCase();
        const isUnread = statusStr === 'UNREAD'; 
        const isCompleted = statusStr === 'COMPLETED';
        const isHold = statusStr === 'HOLD';
        const isConfirmed = statusStr === 'CONFIRMED';
        const isAvailable = statusStr === 'AVAILABLE';
        
        let color = '#94a3b8';
        if (isUnread && !window.isPublicView) color = '#f59e0b';
        else if (isCompleted && !window.isPublicView) color = '#16a34a';
        else if (isHold) color = '#eab308';
        else if (isConfirmed) color = '#ef4444';
        else if (isAvailable) color = '#22c55e';
        
        let titleStr = '';
        if (window.isPublicView) {
            if (isAvailable) titleStr = 'Tersedia';
            else if (isHold) titleStr = 'Hold';
            else titleStr = 'Terisi';
        } else {
            titleStr = s.title + (isUnread ? ' (Baru)' : '') + (s.coachName && s.coachName!=='Belum Ditugaskan' ? ' [' + s.coachName + ']' : '');
        }

        return Object.assign({}, s, { title: titleStr, backgroundColor: color, borderColor: color, extendedProps: { status: statusStr, notes: s.notes, phone: s.phone, coachId: s.coachId } });
      });

      calendarEl.innerHTML = '';
      const initialViewType = window.innerWidth < 768 ? 'timeGridDay' : 'timeGridWeek';
      
      if(window.calendarInstance) { window.calendarInstance.destroy(); }

      window.calendarInstance = new FullCalendar.Calendar(calendarEl, {
        initialView: initialViewType,
        headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' },
        slotMinTime: '06:00:00', slotMaxTime: '23:00:00', allDaySlot: false, 
        
        selectable: !window.isPublicView || (window.isPublicView && window.publicLoggedMember), 
        editable: !window.isPublicView,
        events: displayEvents,
        
        select: function(info) { window.handleSlotSelection(info); },
        eventDrop: function(info) { window.updateDraggedEvent(info.event, info.revert); },
        eventResize: function(info) { window.updateDraggedEvent(info.event, info.revert); },
        eventClick: function(info) {
          if(window.isPublicView) { 
             const statusStr = String(info.event.extendedProps.status || '').toUpperCase();
             if (statusStr === 'AVAILABLE') {
                 if(!window.publicLoggedMember) {
                    window.showToast("Silakan login untuk mem-booking slot ini.");
                    window.navigate('public-login');
                 } else {
                    window.handleSlotSelection({start: info.event.start});
                 }
             } else {
                 window.showToast('Maaf, Sesi pada jam ini sudah tidak tersedia.'); 
             }
             return; 
          }
          window.openScheduleDetailModal(info.event);
        }
      });
      window.calendarInstance.render();
      
      const fab = document.getElementById('client-booking-fab');
      if (window.isPublicView && window.publicLoggedMember) {
        if(fab) { fab.classList.remove('hidden'); fab.classList.add('flex'); }
      } else {
        if(fab) { fab.classList.add('hidden'); fab.classList.remove('flex'); }
      }
      try { window.lucide.createIcons(); } catch(e) {}
    };

    window.openRescheduleModal = function(scheduleId) {
      if (!window.publicLoggedMember) { window.showToast("Silakan login terlebih dahulu."); return; }
      const sch = window.schedules.find(s => String(s.id) === String(scheduleId));
      if (!sch) { window.showToast("Jadwal tidak ditemukan."); return; }
      if (String(sch.memberId) !== String(window.publicLoggedMember.id)) { window.showToast("Jadwal ini bukan milik Anda."); return; }
      if (String(sch.status).toLowerCase() === 'completed') { window.showToast("Sesi yang sudah selesai tidak bisa direschedule."); return; }

      // Peringatan dini di sisi klien kalau sudah lewat batas waktu, sebelum submit ke server
      const hoursLeft = (new Date(sch.start) - new Date()) / (1000 * 60 * 60);
      if (hoursLeft < 2) {
        window.showToast("Reschedule mandiri sudah lewat batas waktu (min. 2 jam sebelum jadwal). Hubungi Coach via WhatsApp ya.");
        return;
      }

      window.isEditScheduleMode = false;
      window.isRescheduleMode = true;
      window.rescheduleScheduleId = scheduleId;

      const recurWrap = document.getElementById('recurring-toggle-wrap');
      if (recurWrap) recurWrap.classList.add('hide');
      window.resetRecurringUI();

      const overlay = document.getElementById('modal-overlay');
      document.querySelectorAll('#modal-overlay > div').forEach(el => el.classList.add('hide'));
      overlay.classList.remove('hide'); overlay.classList.add('flex');
      setTimeout(() => overlay.classList.remove('opacity-0'), 10);

      const formModal = document.getElementById('modal-edit-schedule');
      formModal.classList.remove('hide');
      setTimeout(() => formModal.classList.remove('scale-95'), 10);

      document.getElementById('modal-sch-title').innerText = "Reschedule Jadwal";
      document.getElementById('edit-sch-client-name').innerText = window.publicLoggedMember.name;

      const d = new Date(sch.start);
      document.getElementById('edit-sch-date').value = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      document.getElementById('edit-sch-time').value = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');

      const diffMins = Math.round((new Date(sch.end) - d) / 60000);
      const durSelect = document.getElementById('edit-sch-duration');
      if (durSelect) {
        if ([...durSelect.options].some(o => o.value == String(diffMins))) { durSelect.value = diffMins; } else { durSelect.value = "60"; }
      }
      document.getElementById('edit-sch-notes').value = sch.notes || "";
      try { window.lucide.createIcons(); } catch(e) {}
    };

    window.submitScheduleForm = function(e) {

      const startDateTime = new Date(dateVal + 'T' + timeVal + ':00'); const endDateTime = new Date(startDateTime.getTime() + durationMins * 60000); 

      let data = {
         start: startDateTime.toISOString(), end: endDateTime.toISOString(), notes: notes, duration: durationMins
      };

      if (window.isRescheduleMode) {
         if (window.isGas) {
           window.memberApi()
             .withSuccessHandler(function() {
               const schIndex = window.schedules.findIndex(s => String(s.id) === String(window.rescheduleScheduleId));
               if (schIndex !== -1) {
                 window.schedules[schIndex].start = data.start; window.schedules[schIndex].end = data.end; window.schedules[schIndex].notes = data.notes;
               }
               window.isRescheduleMode = false; window.rescheduleScheduleId = null;
               window.renderPublicDashboard(); window.initCalendar(); window.closeModal();
               btn.innerHTML = originalText; btn.disabled = false; window.showToast('Jadwal berhasil direschedule!');
             })
             .withFailureHandler(function(err) { btn.innerHTML = originalText; btn.disabled = false; window.showToast('Gagal: ' + err.message); })
             .clientRescheduleSchedule(window.rescheduleScheduleId, data.start, data.end);
         }
      } else if (window.isEditScheduleMode) {
         data.id = window.selectedScheduleDetailId;
         if (window.isGas) {
           window.adminApi()
             .withSuccessHandler(function() {
               const schIndex = window.schedules.findIndex(s => String(s.id) === String(window.selectedScheduleDetailId));
               if(schIndex !== -1) {
                 window.schedules[schIndex].start = data.start; window.schedules[schIndex].end = data.end; window.schedules[schIndex].notes = data.notes;
               }
               window.initCalendar(); window.closeModal(); btn.innerHTML = originalText; btn.disabled = false; window.showToast('Jadwal berhasil diperbarui!');
             })
             .withFailureHandler(function(err){ btn.innerHTML = originalText; btn.disabled = false; window.showToast('Gagal: ' + err.message); })
             .updateScheduleData(data);
         }
      } else {
         let memberData = null;
         if(window.isPublicView && window.publicLoggedMember) { memberData = window.publicLoggedMember; }
         else if(!window.isPublicView && window.selectedMemberId) { memberData = window.members.find(x => String(x.id) === String(window.selectedMemberId)); }
         
         if(!memberData) { window.showToast("Error: Data Klien tidak ditemukan."); btn.innerHTML = originalText; btn.disabled = false; return; }
         
         data.memberId = memberData.id; data.memberName = memberData.name; data.phone = memberData.phone;

         // --- Cabang: Recurring Booking ---
         const recurCheckbox = document.getElementById('edit-sch-recurring-toggle');
         if (recurCheckbox && recurCheckbox.checked) {
           const weekdays = window.getSelectedRecurringWeekdays();
           const occurrences = parseInt(document.getElementById('edit-sch-recurring-occurrences').value, 10);

           if (weekdays.length === 0) {
             window.showToast('Pilih minimal 1 hari untuk jadwal berulang.'); btn.innerHTML = originalText; btn.disabled = false; return;
           }
           if (!occurrences || occurrences < 2) {
             window.showToast('Jumlah sesi minimal 2 untuk booking berulang.'); btn.innerHTML = originalText; btn.disabled = false; return;
           }

           const baseData = {
             memberId: memberData.id, memberName: memberData.name, phone: memberData.phone, notes: notes,
             startDate: dateVal, time: timeVal, duration: durationMins
           };
           const recurrenceRule = { weekdays: weekdays, occurrences: occurrences };

           if (window.isGas) {
             const isClient = window.isPublicView;
             (isClient ? window.memberApi() : window.adminApi())
               .withSuccessHandler(function(res) {
                 // Refresh penuh data schedules dari server, paling aman & sederhana
                 // daripada menyusun ulang N objek jadwal baru secara manual di client.
                 const refresh = isClient ? window.memberApi() : window.adminApi();
                 refresh.withSuccessHandler(function(allSchedules) {
                   window.schedules = allSchedules || [];
                   window.initCalendar(); window.checkUnreadBookings();
                   if (window.isPublicView) window.renderPublicDashboard();
                   else if (window.currentView === 'profile') window.openProfile(memberData.id);
                   window.updateDashboardStats();
                   window.closeModal(); btn.innerHTML = originalText; btn.disabled = false;
                   window.showToast(res.count + ' sesi berulang berhasil dibuat!');
                 })[isClient ? 'getPublicSchedules' : 'getSchedules']();
               })
               .withFailureHandler(function(err) {
                 btn.innerHTML = originalText; btn.disabled = false; window.showToast('Gagal: ' + err.message);
               })
               [isClient ? 'clientBookRecurring' : 'addRecurringSchedule'](baseData, recurrenceRule);
           }
           return;
         }

         if (window.isGas) {
           const isClientBooking = window.isPublicView;
           
           if (isClientBooking) {
             window.memberApi()
               .withSuccessHandler(function(res) {
                 data.id = res.id; data.title = data.memberName; data.status = 'unread';
                 data.coachId = res.coachId || ''; data.coachName = res.coachName || '';
                 window.schedules.push(data); 
                 window.initCalendar(); window.checkUnreadBookings();
                 window.renderPublicDashboard(); 
                 window.closeModal(); btn.innerHTML = originalText; btn.disabled = false;
                 window.showToast('Booking berhasil dikirim ke Coach!');
               })
               .withFailureHandler(function(err) {
                 btn.innerHTML = originalText; btn.disabled = false; window.showToast('Gagal Booking: ' + err.message);
               })
               .clientBookSchedule(data);
           } else {
             window.adminApi()
               .withSuccessHandler(function(res) {
                 data.id = res.id; data.title = data.memberName; data.status = 'read';
                 window.schedules.push(data); 
                 window.initCalendar(); window.checkUnreadBookings();
                 window.openProfile(memberData.id); 
                 window.closeModal(); btn.innerHTML = originalText; btn.disabled = false;
                 window.showToast('Jadwal berhasil ditambahkan!');
               })
               .withFailureHandler(function(err) {
                 btn.innerHTML = originalText; btn.disabled = false; window.showToast('Gagal Booking: ' + err.message);
               })
               .addSchedule(data);
           }
         }
      }
    };

    window.markSessionCompleted = function() {
      const sch = window.schedules.find(s => String(s.id) === String(window.selectedScheduleDetailId)); if(!sch) return;
      const mem = window.members.find(m => String(m.id) === String(sch.memberId)); if(!mem) return;
      if(mem.usedSessions >= mem.totalSessions) { window.showToast('Gagal: Kuota sesi klien ini sudah habis!'); return; }

      window.showConfirmModal(
        'Ini akan memotong 1 kuota sesi dari klien <b>' + escapeHtml(sch.title) + '</b>.',
        function() {
          const btn = document.getElementById('btn-complete-session'); const originalText = btn.innerHTML; btn.innerHTML = 'Memproses...'; btn.disabled = true;

          if (window.isGas) {
            window.adminApi()
              .withSuccessHandler(function(result) {
                sch.status = 'completed'; mem.usedSessions = (mem.usedSessions || 0) + 1;
                window.updateMemberUI(); window.initCalendar(); window.closeModal(); window.showToast('Sesi selesai! Kuota dipotong.');
                if(window.currentView === 'profile' && window.selectedMemberId === sch.memberId) window.openProfile(sch.memberId);

                // Tawarkan kirim reminder WA sisa sesi (manual, 1 klik, tanpa CTA jualan)
                const reminderMsg = (result && result.reminderMessage)
                  ? result.reminderMessage
                  : 'Halo ' + sch.title + ', sesi kamu tersisa ' + Math.max(0, (mem.totalSessions||0) - (mem.usedSessions||0)) + ' dari ' + (mem.totalSessions||0) + ' ya.';

                setTimeout(function() {
                  window.showConfirmModal(
                    'Kirim info sisa sesi ke <b>' + escapeHtml(sch.title) + '</b> via WhatsApp?<br><span class="text-gray-400 text-xs">"' + escapeHtml(reminderMsg) + '"</span>',
                    function() { window.sendToParentWA(sch.phone, reminderMsg); },
                    { title: 'Kirim Reminder Sesi?', confirmText: 'Kirim Reminder WA', cancelText: 'Nanti Saja', variant: 'default' }
                  );
                }, 400);
              })
              .withFailureHandler(function(err){ btn.innerHTML = originalText; btn.disabled = false; window.showToast('Gagal: ' + err.message); })
              .completeSession(sch.id, sch.memberId);
          }
        },
        { title: 'Tandai Sesi Selesai?', confirmText: 'Ya, Selesai', variant: 'default' }
      );
    };

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    window.submitAddCoach = function(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      const originalText = btn.innerHTML; btn.innerHTML = 'Menyimpan...'; btn.disabled = true;

      const editId = document.getElementById('coach-edit-id').value;
      const data = {
        name: document.getElementById('coach-name').value,
        phone: sanitizePhone(document.getElementById('coach-phone').value),
        specialty: document.getElementById('coach-specialty').value,
        bio: document.getElementById('coach-bio').value,
        experience: document.getElementById('coach-experience').value,
        photo: editId ? (window.coaches.find(c => String(c.id) === String(editId)) || {}).photo || '' : ''
      };
      if (editId) data.id = editId;

      function finishSave() {
        if (!window.isGas) return;
        const handler = editId ? 'updateCoach' : 'addCoach';
        window.adminApi()
          .withSuccessHandler(function(res) {
            if (editId) {
              const idx = window.coaches.findIndex(c => String(c.id) === String(editId));
              if (idx > -1) window.coaches[idx] = data;
            } else {
              data.id = res.id;
              window.coaches.push(data);
            }
            window.updateCoachUI();
            window.closeModal();
            btn.innerHTML = originalText; btn.disabled = false;
            window.showToast(editId ? 'Coach berhasil diupdate!' : 'Coach berhasil ditambahkan!');
          })
          .withFailureHandler(function(err) {
            btn.innerHTML = originalText; btn.disabled = false;
            window.showToast('Gagal Simpan: ' + err.message);
          })
          [handler](data);
      }

      if (window.pendingCoachBase64) {
        window.adminApi()
          .withSuccessHandler(function(res) {
            data.photo = res.url;
            window.pendingCoachBase64 = null;
            finishSave();
          })
          .withFailureHandler(function(err) {
            btn.innerHTML = originalText; btn.disabled = false;
            window.showToast('Gagal Upload Foto: ' + err.message);
          })
          .uploadCoachPhoto(window.pendingCoachBase64, 'coach_' + new Date().getTime() + '.jpg', 'image/jpeg');
      } else {
        finishSave();
      }
    };

    window.renderPriceCategories = function() {
      const container = document.getElementById('category-button-container');
      if (!container) return;

      const uniqueCategories = [...new Set(window.priceListData.map(p => p.kategori))].filter(Boolean);
      
      if (uniqueCategories.length === 0) {
        container.innerHTML = '';
        return;
      }

      if (!uniqueCategories.includes(window.currentClientType)) {
        window.currentClientType = uniqueCategories[0];
      }

      const pct = 100 / uniqueCategories.length;
      
      let html = `<div id="price-indicator" class="absolute h-[calc(100%-12px)] bg-black rounded-xl transition-transform duration-300 ease-out shadow-md z-0" style="width: calc(${pct}% - 3px); left: 6px; top: 6px; transform: translateX(0%);"></div>`;

      uniqueCategories.forEach((cat, index) => {
        const label = cat.charAt(0).toUpperCase() + cat.slice(1);
        const isActive = cat === window.currentClientType;
        const textClass = isActive ? 'text-white' : 'text-gray-500 hover:text-gray-800';
        
        html += `<button onclick="window.setPriceCategory('${cat}', ${index})" data-category="${cat}" class="cat-btn relative z-10 flex-1 py-2.5 text-xs md:text-sm font-bold ${textClass} transition-colors duration-300">${label}</button>`;
      });

      container.innerHTML = html;
      
      const activeIndex = uniqueCategories.indexOf(window.currentClientType);
      window.setPriceCategory(window.currentClientType, activeIndex !== -1 ? activeIndex : 0);
    };

    window.setPriceCategory = function(category, index) {
      window.currentClientType = category;
      
      const indicator = document.getElementById('price-indicator');
      if (indicator) {
         indicator.style.transform = 'translateX(' + (index * 100) + '%)';
      }
      
      const btns = document.querySelectorAll('.cat-btn');
      btns.forEach(function(btn) {
          if (btn.dataset.category === category) {
              btn.classList.add('text-white');
              btn.classList.remove('text-gray-500', 'hover:text-gray-800');
          } else {
              btn.classList.remove('text-white');
              btn.classList.add('text-gray-500', 'hover:text-gray-800');
          }
      });
      
      window.renderPriceList();
    };

    // =============================================================================
    // --- PUBLIC MEMBER AREA ---
    // =============================================================================
    // Klien masuk dengan nomor WhatsApp yang terdaftar (dicek di server). Token member
    // disimpan di perangkat ini (90 hari), jadi kunjungan berikutnya langsung masuk.
    // Link lama (…?view=public&k=KUNCI) masih diterima lewat startPublicPortal(key).
    window.handlePublicLogin = function(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('login-phone');
      const btn = document.getElementById('login-submit-btn');
      const phone = sanitizePhone(input ? input.value : '');
      if (!phone) return;
      window.showMemberLinkMessage('');
      if (!window.isGas) { window.showMemberLinkMessage('Mode demo: login tidak tersedia.'); return; }
      const originalText = btn ? btn.innerHTML : '';
      if (btn) { btn.disabled = true; btn.innerHTML = 'Memeriksa...'; }
      google.script.run
        .withSuccessHandler(function(res) {
          if (btn) { btn.disabled = false; btn.innerHTML = originalText; }
          _lsSet(MEMBER_TOKEN_KEY, res.token);
          if (input) input.value = '';
          window.setPublicMember(res.member);
          window.loadPublicData();
          window.showToast('Selamat datang, ' + (res.member.name || 'Klien') + '!');
        })
        .withFailureHandler(function(err) {
          if (btn) { btn.disabled = false; btn.innerHTML = originalText; }
          window.showMemberLinkMessage(window.authMessage(err));
        })
        .memberLoginByPhone(phone);
    };

    window.startPublicPortal = function(key) {
      if (!window.isGas) { window.loadAllData(); return; }
      if (!key) { window.loadPublicData(); return; }
      google.script.run
        .withSuccessHandler(function(res) {
          _lsSet(MEMBER_TOKEN_KEY, res.token);
          window.setPublicMember(res.member);
          window.loadPublicData();
        })
        .withFailureHandler(function(err) {
          _lsSet(MEMBER_TOKEN_KEY, null);
          window.showMemberLinkMessage(window.authMessage(err));
          window.loadPublicData();
          window.navigate('public-login');
        })
        .memberLoginByKey(key);
    };

      if (dashboardBtn) dashboardBtn.classList.remove('hidden');

      if (!el) return;
      el.textContent = message || '';
      el.classList.toggle('hide', !message);

      const dashboardBtn = document.getElementById('nav-dashboard-btn');
      const loginBtn = document.getElementById('nav-login-btn');

    window.renderPublicDashboard = function() {
  if (!window.publicLoggedMember) return;
  const m = window.publicLoggedMember;
  
  if (window.members && Array.isArray(window.members)) {
    const updatedMember = window.members.find(x => String(x.id) === String(m.id));
    if (updatedMember) {
      window.publicLoggedMember = updatedMember;
    }
  }
  
  const currMember = window.publicLoggedMember;

  const firstName = currMember && currMember.name ? currMember.name.split(' ')[0] : 'Member';
  const nameEl = document.getElementById('pub-dash-name');
  if (nameEl) nameEl.innerText = firstName;
  
  // =========================================================
  // KODE TAMBAHAN: MENGATUR RENDER FOTO PROFIL SAAT LOAD
  // =========================================================
  const imgEl = document.getElementById('pub-avatar-img');
  const placeholderEl = document.getElementById('pub-avatar-placeholder-icon');
  const avatarBtn = document.getElementById('pub-avatar-btn');

  if (currMember.photo && currMember.photo.trim() !== '') {
    // Jika member punya foto
    imgEl.src = currMember.photo;
    imgEl.classList.remove('hidden');
    placeholderEl.classList.add('hidden');
    avatarBtn.classList.remove('border-dashed', 'border-gray-300');
    avatarBtn.classList.add('border-solid', 'border-black');
  } else {
    // Jika tidak ada foto (kembali ke default icon)
    imgEl.src = '';
    imgEl.classList.add('hidden');
    placeholderEl.classList.remove('hidden');
    avatarBtn.classList.add('border-dashed', 'border-gray-300');
    avatarBtn.classList.remove('border-solid', 'border-black');
  }
  // =========================================================
  
  const totalSessions = currMember && currMember.totalSessions ? Number(currMember.totalSessions) : 0;
  const usedSessions = currMember && currMember.usedSessions ? Number(currMember.usedSessions) : 0;
  const remainingSessions = totalSessions - usedSessions;

  const remainingEl = document.getElementById('pub-dash-remaining');
  const totalEl = document.getElementById('pub-dash-total');
  
  if (remainingEl) remainingEl.innerText = remainingSessions;
  if (totalEl) totalEl.innerText = totalSessions;

  // --- Warning Kuota Hampir Habis ---
  const quotaWarningEl = document.getElementById('pub-quota-warning');
  if (quotaWarningEl) {
    if (totalSessions > 0 && remainingSessions <= 1) {
      quotaWarningEl.classList.remove('hide');
      const warnTextEl = document.getElementById('pub-quota-warning-text');
      if (warnTextEl) {
        warnTextEl.innerText = remainingSessions <= 0
          ? 'Kuota sesimu sudah habis. Yuk hubungi Coach untuk perpanjang paket!'
          : 'Sesimu tinggal 1 lagi! Yuk hubungi Coach untuk perpanjang paket.';
      }
    } else {
      quotaWarningEl.classList.add('hide');
    }
  }

  const histEl = document.getElementById('pub-dash-history'); 
  if (!histEl) return; 
  
  histEl.innerHTML = '';
  const safeSchedules = Array.isArray(window.schedules) ? window.schedules : [];
  
  const memSchedules = safeSchedules
    .filter(s => currMember && String(s.memberId) === String(currMember.id))
    .sort((a, b) => new Date(b.start) - new Date(a.start));
  
  if (memSchedules.length === 0) {
    histEl.innerHTML = '<div class="text-center p-6 bg-gray-50 rounded-2xl border border-gray-100"><p class="text-sm text-gray-500">Belum ada jadwal latihan.</p></div>';
  } else {
    memSchedules.forEach(s => {
      const d = new Date(s.start);
      const isDone = s.status === 'completed';
      const isUpcoming = !isDone && d >= new Date();
      
      histEl.innerHTML += `
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm font-black ${isDone ? 'text-green-600' : 'text-black'}">
                ${d.toLocaleDateString('id-ID', {weekday:'short', day:'numeric', month:'short'})}
              </p>
              <p class="text-xs font-bold text-gray-500">
                ${d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})} WIB
              </p>
              <p class="text-[10px] text-gray-400 mt-1">
                <i data-lucide="contact-2" class="w-3 h-3 inline"></i> ${escapeHtml(s.coachName || 'Menunggu Coach')}
              </p>
            </div>
            <div>

    // =============================================================================
    // --- FEATURE: CONSISTENCY / ATTENDANCE ANALYSIS (Member Dashboard) ---
    // =============================================================================
    window.renderConsistencyAnalysis = function(currMember, memSchedules) {
      const scoreEl = document.getElementById('pub-consistency-score');
      const labelEl = document.getElementById('pub-consistency-label');
      const streakEl = document.getElementById('pub-consistency-streak');
      const avgEl = document.getElementById('pub-consistency-avg');
      const chartEl = document.getElementById('pub-consistency-chart');
      const emptyEl = document.getElementById('pub-consistency-empty');
      const contentEl = document.getElementById('pub-consistency-content');
      if (!scoreEl || !chartEl) return;

      const completedSchedules = (memSchedules || [])
        .filter(s => String(s.status).toLowerCase() === 'completed')
        .sort((a, b) => new Date(a.start) - new Date(b.start));

      if (completedSchedules.length === 0) {
        if (emptyEl) emptyEl.classList.remove('hide');
        if (contentEl) contentEl.classList.add('hide');
        return;
      }
      if (emptyEl) emptyEl.classList.add('hide');
      if (contentEl) contentEl.classList.remove('hide');

      // --- Helper: dapatkan awal minggu (Senin) dari sebuah tanggal ---
      function startOfWeek(d) {
        const date = new Date(d);
        const day = date.getDay(); // 0=Minggu, 1=Senin, ...
        const diff = (day === 0 ? -6 : 1) - day; // geser ke Senin
        date.setDate(date.getDate() + diff);
        date.setHours(0, 0, 0, 0);
        return date;
      }

      // --- Helper: parse joinDate format "D/M/YYYY" (disimpan backend) dengan aman ---
      function parseJoinDate(str) {
        if (!str) return null;
        const parts = String(str).split('/');
        if (parts.length !== 3) {
          const fallback = new Date(str);
          return isNaN(fallback) ? null : fallback;
        }
        const day = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10) - 1;
        const year = parseInt(parts[2], 10);
        const d = new Date(year, month, day);
        return isNaN(d) ? null : d;
      }

      const now = new Date();
      const currentWeekStart = startOfWeek(now);

      // --- Tentukan titik awal periode analisis: maksimal 12 minggu terakhir, ---
      // --- dipersempit (bukan diperlebar) kalau member baru gabung / sesi pertama lebih baru ---
      const twelveWeeksAgo = new Date(currentWeekStart);
      twelveWeeksAgo.setDate(twelveWeeksAgo.getDate() - 7 * 11); // 12 minggu termasuk minggu ini

      const joinDateObj = currMember ? parseJoinDate(currMember.joinDate) : null;
      const firstSessionDate = new Date(completedSchedules[0].start);

      let periodStart = twelveWeeksAgo;
      if (firstSessionDate > periodStart) periodStart = startOfWeek(firstSessionDate);
      if (joinDateObj && joinDateObj > periodStart) periodStart = startOfWeek(joinDateObj);

      const periodStartWeek = startOfWeek(periodStart);
      const totalWeeks = Math.max(1, Math.round((currentWeekStart - periodStartWeek) / (7 * 24 * 60 * 60 * 1000)) + 1);

      // --- Hitung jumlah sesi completed per minggu (key: ISO string awal minggu) ---
      const weekCounts = {};
      completedSchedules.forEach(s => {
        const wk = startOfWeek(new Date(s.start)).getTime();
        weekCounts[wk] = (weekCounts[wk] || 0) + 1;
      });

      // --- Bangun array minggu dari periodStartWeek s.d. currentWeekStart ---
      const weeks = [];
      let cursor = new Date(periodStartWeek);
      while (cursor <= currentWeekStart) {
        weeks.push({ start: new Date(cursor), count: weekCounts[cursor.getTime()] || 0 });
        cursor.setDate(cursor.getDate() + 7);
      }

      const activeWeeks = weeks.filter(w => w.count > 0).length;
      const consistencyScore = Math.round((activeWeeks / weeks.length) * 100);

      // --- Streak mingguan berturut-turut (mundur dari minggu ini) ---
      let streak = 0;
      for (let i = weeks.length - 1; i >= 0; i--) {
        if (weeks[i].count > 0) {
          streak++;
        } else {
          // Kalau minggu ini (paling akhir) masih 0 dan belum berakhir, jangan putus streak, cek minggu sebelumnya
          if (i === weeks.length - 1) continue;
          break;
        }
      }

      const totalCompleted = completedSchedules.length;
      const avgPerActiveWeek = activeWeeks > 0 ? (totalCompleted / activeWeeks).toFixed(1) : '0.0';

      // --- Label kualitatif ---
      let label = 'Perlu Ditingkatkan 💪';
      let colorClass = 'text-red-600 bg-red-50 border-red-200';
      if (consistencyScore >= 80) {
        label = 'Sangat Konsisten 🔥';
        colorClass = 'text-green-600 bg-green-50 border-green-200';
      } else if (consistencyScore >= 50) {
        label = 'Cukup Stabil 👍';
        colorClass = 'text-amber-600 bg-amber-50 border-amber-200';
      }

      if (scoreEl) scoreEl.innerText = consistencyScore + '%';
      if (labelEl) {
        labelEl.innerText = label;
        labelEl.className = 'text-[11px] font-bold px-2.5 py-1 rounded-full border inline-block ' + colorClass;
      }
      if (streakEl) streakEl.innerText = streak + ' minggu beruntun';
      if (avgEl) avgEl.innerText = avgPerActiveWeek + ' sesi/minggu';

      // --- Mini bar chart: ambil maksimal 8 minggu terakhir ---
      const chartWeeks = weeks.slice(-8);
      const maxCount = Math.max(1, ...chartWeeks.map(w => w.count));
      chartEl.innerHTML = chartWeeks.map(w => {
        const heightPct = Math.max(8, Math.round((w.count / maxCount) * 100));
        const barColor = w.count > 0 ? 'bg-black' : 'bg-gray-200';
        const lbl = w.start.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
        return '<div class="flex flex-col items-center gap-1 flex-1">' +
                 '<div class="w-full flex items-end justify-center" style="height:48px;">' +
                   '<div class="w-full max-w-[14px] rounded-t-md ' + barColor + '" style="height:' + heightPct + '%;" title="' + w.count + ' sesi"></div>' +
                 '</div>' +
                 '<span class="text-[8px] text-gray-400 font-medium">' + lbl + '</span>' +
               '</div>';
      }).join('');
    };

    // =============================================================================
    window.renderFavoriteTime = function(memSchedules) {
      const wrapEl = document.getElementById('pub-favtime-content');
      const emptyEl = document.getElementById('pub-favtime-empty');
      const textEl = document.getElementById('pub-favtime-text');
      if (!wrapEl || !textEl) return;

      const completed = (memSchedules || []).filter(s => String(s.status).toLowerCase() === 'completed');

      if (completed.length < 3) {
        wrapEl.classList.add('hide');
        if (emptyEl) emptyEl.classList.remove('hide');
        return;
      }
      wrapEl.classList.remove('hide');
      if (emptyEl) emptyEl.classList.add('hide');

      const dayNames = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', "Jumat", 'Sabtu'];
      const dayCounts = [0, 0, 0, 0, 0, 0, 0];
      const slotCounts = { 'Pagi': 0, 'Siang': 0, 'Sore': 0, 'Malam': 0 };

      completed.forEach(s => {
        const d = new Date(s.start);
        dayCounts[d.getDay()]++;
        const hour = d.getHours();
        let slot;
        if (hour >= 5 && hour < 11) slot = 'Pagi';
        else if (hour >= 11 && hour < 15) slot = 'Siang';
        else if (hour >= 15 && hour < 18) slot = 'Sore';
        else slot = 'Malam';
        slotCounts[slot]++;
      });

      let favDayIdx = 0;
      for (let i = 1; i < 7; i++) if (dayCounts[i] > dayCounts[favDayIdx]) favDayIdx = i;
      const favDay = dayNames[favDayIdx];

      let favSlot = 'Pagi';
      Object.keys(slotCounts).forEach(k => { if (slotCounts[k] > slotCounts[favSlot]) favSlot = k; });

      const slotEmoji = { 'Pagi': '🌅', 'Siang': '☀️', 'Sore': '🌇', 'Malam': '🌙' };

      textEl.innerHTML = 'Kamu paling sering latihan di <b>' + favDay + '</b>, sesi <b>' + favSlot + '</b> ' + (slotEmoji[favSlot] || '');

    // =============================================================================
    // --- FEATURE: HEATMAP AKTIVITAS (Member Dashboard) ---
    // =============================================================================
    window.renderActivityHeatmap = function(memSchedules) {
      const gridEl = document.getElementById('pub-heatmap-grid');
      if (!gridEl) return;

      const completed = (memSchedules || []).filter(s => String(s.status).toLowerCase() === 'completed');
      const completedDates = {};
      completed.forEach(s => {
        const d = new Date(s.start);
        const key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
        completedDates[key] = true;
      });

      const totalDays = 84; // 12 minggu
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      // Mulai dari totalDays-1 hari yang lalu, agar hari ini berada di kolom paling kanan
      const startDate = new Date(today);
      startDate.setDate(startDate.getDate() - (totalDays - 1));
      // Geser mundur ke hari Senin supaya grid rapi per minggu (7 baris)
      const startDay = startDate.getDay();
      const backToMonday = startDay === 0 ? 6 : startDay - 1;
      startDate.setDate(startDate.getDate() - backToMonday);

      let cells = '';
      let cursor = new Date(startDate);
      while (cursor <= today) {
        const key = cursor.getFullYear() + '-' + cursor.getMonth() + '-' + cursor.getDate();
        const isDone = !!completedDates[key];
        const isFuture = cursor > today;
        const colorClass = isFuture ? 'bg-transparent' : (isDone ? 'bg-black' : 'bg-gray-100');
        const dateLbl = cursor.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        cells += '<div class="w-2 h-2 rounded-sm ' + colorClass + '" title="' + dateLbl + (isDone ? ' — Latihan' : '') + '"></div>';
        cursor.setDate(cursor.getDate() + 1);
      }

      gridEl.innerHTML = cells;
    };

              const idx = window.members.findIndex(m => String(m.id) === String(res.id));

                // Data lama (sebelum ditimpa paket baru) jadi card ARSIP di bulan lamanya,

    // =============================================================================
    // --- FIX INFINITE COUNT LOOP (OBSERVER CONTROL) ---
    // =============================================================================
    let dashObserver = null;

    function startDashObserver() {
      const target = document.getElementById('pub-dash-remaining');
      if (!target || dashObserver) return;
      
      dashObserver = new MutationObserver(function() {
        window.refreshDashboardVisuals();
      });
      
      dashObserver.observe(target, { childList: true, characterData: true, subtree: true });
    }

    function stopDashObserver() {
      if (dashObserver) {
        dashObserver.disconnect();
        dashObserver = null;
      }
    }

    window.refreshDashboardVisuals = function(){
      const remainEl = document.getElementById('pub-dash-remaining');
      const totalEl = document.getElementById('pub-dash-total');
      const ring = document.getElementById('pub-quota-ring');
      if (!remainEl || !totalEl) return;

      const remaining = parseInt(remainEl.textContent) || 0;
      const total = parseInt(totalEl.textContent) || 0;
      const pct = total > 0 ? remaining / total : 0;
      const circumference = 113; 

      if (ring) {
        requestAnimationFrame(function(){
          ring.style.strokeDashoffset = circumference - (pct * circumference);
        });
      }

      // Hentikan observer sejenak agar perubahan angka saat animasi tidak memicu observer lagi
      stopDashObserver();
      
      xnkAnimateCount(remainEl, remaining, function(){ 
        // Hidupkan observer kembali setelah animasi selesai
        startDashObserver(); 
      });
    };

    function xnkAnimateCount(el, target, onDone){
      const duration = 700;
      const start = performance.now();
      
      function tick(now){
        const progress = Math.min((now - start) / duration, 1);
        el.textContent = Math.round(progress * target);
        
        if (progress < 1) {
          requestAnimationFrame(tick);
        } else {
          el.textContent = target; // Pastikan nilai akhir tepat
          if (onDone) onDone();
        }
      }
      requestAnimationFrame(tick);
    }
