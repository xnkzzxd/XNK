<script>
/* Kartu bagikan (Phase T + T2). Gambar dan video dibuat di browser (Canvas) dan tidak pernah diunggah.
   App.html memanggil window.shareOpen(kind, src, opts); src berisi data yang sudah dihitung server.
   Periode lain (minggu, bulan, …) datang dari src.loadPeriod(period) → getMyShareData / getMemberShareData. */
(function () {
  'use strict';
  const W = 1080, GOLD = '#F5C400', GOLD2 = '#F59E0B';
  const SIZES = { story: 1920, portrait: 1350, kotak: 1080 };
  const PREF_KEY = 'xnk_share_prefs', NUDGE_KEY = 'xnk_share_nudge';
  const AXES = ['back', 'legs', 'chest', 'arms', 'core', 'shoulders'];
  const PART_GROUP = { 'back': 'back', 'upper legs': 'legs', 'lower legs': 'legs', 'chest': 'chest', 'shoulders': 'shoulders', 'neck': 'shoulders', 'waist': 'core', 'upper arms': 'arms', 'lower arms': 'arms' };
  const GROUP_PARTS = { back: ['back'], legs: ['upper legs', 'lower legs'], chest: ['chest'], shoulders: ['shoulders', 'neck'], core: ['waist'], arms: ['upper arms', 'lower arms'] };
  const MEASURES = ['berat', 'pinggang', 'perut', 'dada', 'lenganKanan', 'lenganKiri', 'pahaKanan', 'pahaKiri'];
  const KINDS = ['latihan', 'exercises', 'record', 'progres', 'ukuran', 'konsistensi', 'badges', 'gizi', 'rekap', 'foto', 'badge'];
  const PERIOD_KINDS = { latihan: 1, exercises: 1, gizi: 1, ukuran: 1 };
  const PERIODS = ['hari', 'minggu', 'bulan', '3bulan'];

  // ── Bahasa kartu (EN bawaan, ID pilihan) ─────────────────────────────────────
  const L = {
    en: {
      dow: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], mon: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
      monLong: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
      duration: 'Duration', volume: 'Volume', sets: 'Sets', reps: 'Reps', records: 'Records', exercises: 'Exercises', workouts: 'Workouts', sessions: 'Sessions',
      coachSessions: 'PT sessions', streak: 'Streak', bestStreak: 'Best streak', badges: 'Badges', thisMonth: 'This month', calories: 'Calories', protein: 'Protein', carbs: 'Carbs', fat: 'Fat',
      avgKcal: 'Avg calories', onTarget: 'On target', daysLogged: 'Days logged', mealDays: 'Meals logged', bestSet: 'Best set', e1rm: 'Est. 1RM', vsPrev: 'vs previous', improvement: 'Improvement',
      workout: 'Workout', myProgress: 'My progress', nutrition: 'Nutrition', newBadge: 'New badge', badgeWall: 'Badges', consistency: 'Consistency', body: 'Body', progressPics: 'Progress',
      monthlyRecap: 'Monthly recap', weeklyVolume: 'Weekly volume', week: 'week', weeks: 'weeks', wk: 'wk', days: 'days', more: 'more', of: 'of', coachedBy: 'Coached by', before: 'Before', after: 'After',
      today: 'Today', thisWeek: 'This week', thisMonthP: 'This month', last3: 'Last 3 months', perDay: '/day', sessionsPerWeek: 'Sessions per week', dailyKcal: 'Calories per day',
      vs: { session: 'vs last session', minggu: 'vs last week', bulan: 'vs last month', '3bulan': 'vs previous 3 months', day: 'vs day before', month: 'vs last month' }, sinceStart: 'since start', ofTarget: 'of target', pickPhoto: 'Pick a photo', noData: 'No data yet',
      parts: { back: 'Back', legs: 'Legs', chest: 'Chest', arms: 'Arms', core: 'Core', shoulders: 'Shoulders' },
      m: { berat: 'Weight', pinggang: 'Waist', perut: 'Belly', dada: 'Chest', lenganKanan: 'Right arm', lenganKiri: 'Left arm', pahaKanan: 'Right thigh', pahaKiri: 'Left thigh' },
      badge: { sesi: n => n + ' sessions', streak: n => n + '-week streak', catat: n => n + ' days logged', pr: n => n === 1 ? 'First PR' : n + ' PRs' }
    },
    id: {
      dow: ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'], mon: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'],
      monLong: ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'],
      duration: 'Durasi', volume: 'Volume', sets: 'Set', reps: 'Rep', records: 'Rekor', exercises: 'Gerakan', workouts: 'Latihan', sessions: 'Sesi',
      coachSessions: 'Sesi PT', streak: 'Streak', bestStreak: 'Streak terbaik', badges: 'Badge', thisMonth: 'Bulan ini', calories: 'Kalori', protein: 'Protein', carbs: 'Karbo', fat: 'Lemak',
      avgKcal: 'Rata-rata kalori', onTarget: 'Sesuai target', daysLogged: 'Hari dicatat', mealDays: 'Makan dicatat', bestSet: 'Set terbaik', e1rm: 'Estimasi 1RM', vsPrev: 'vs sebelumnya', improvement: 'Peningkatan',
      workout: 'Latihan', myProgress: 'Progresku', nutrition: 'Gizi', newBadge: 'Badge baru', badgeWall: 'Badge', consistency: 'Konsistensi', body: 'Tubuh', progressPics: 'Progres',
      monthlyRecap: 'Rekap bulanan', weeklyVolume: 'Volume per minggu', week: 'minggu', weeks: 'minggu', wk: 'mgg', days: 'hari', more: 'lagi', of: 'dari', coachedBy: 'Dilatih oleh', before: 'Sebelum', after: 'Sesudah',
      today: 'Hari ini', thisWeek: 'Minggu ini', thisMonthP: 'Bulan ini', last3: '3 bulan terakhir', perDay: '/hari', sessionsPerWeek: 'Sesi per minggu', dailyKcal: 'Kalori per hari',
      vs: { session: 'vs sesi lalu', minggu: 'vs minggu lalu', bulan: 'vs bulan lalu', '3bulan': 'vs 3 bulan sebelumnya', day: 'vs hari sebelumnya', month: 'vs bulan lalu' }, sinceStart: 'sejak awal', ofTarget: 'dari target', pickPhoto: 'Pilih foto', noData: 'Belum ada data',
      parts: { back: 'Punggung', legs: 'Kaki', chest: 'Dada', arms: 'Lengan', core: 'Perut', shoulders: 'Bahu' },
      m: { berat: 'Berat', pinggang: 'Pinggang', perut: 'Perut', dada: 'Dada', lenganKanan: 'Lengan kanan', lenganKiri: 'Lengan kiri', pahaKanan: 'Paha kanan', pahaKiri: 'Paha kiri' },
      badge: { sesi: n => n + ' sesi', streak: n => 'Streak ' + n + ' minggu', catat: n => n + ' hari dicatat', pr: n => n === 1 ? 'Rekor pertama' : n + ' rekor' }
    }
  };
  let T = L.en;

  // ── Pilihan tampilan (perangkat ini saja) ────────────────────────────────────
  const PRESETS = {
    minimal: { style: 'teks', align: 'tengah', scale: 'm', corner: 'bulat', frame: false, graphNone: true },
    bold: { style: 'teks', align: 'kiri', scale: 'l', corner: 'bulat', frame: false, graphNone: true },
    strava: { style: 'grafik', align: 'kiri', scale: 'm', corner: 'bulat', frame: false },
    hevy: { style: 'gelap', align: 'kiri', scale: 'm', corner: 'bulat', frame: false },
    polos: { style: 'terang', align: 'kiri', scale: 'm', corner: 'kotak', frame: true }
  };
  const DEF = { v: 2, preset: 'strava', style: 'grafik', size: 'story', ink: 'putih', align: 'kiri', pos: 'bawah', scale: 'm', corner: 'bulat', frame: false, lang: 'en', name: null, fmt: 'png',
    foot: { date: true, logo: true, me: false, coach: true, coachPic: false, qr: false }, k: {} };
  const KDEF = { order: [], off: [], graph: '', period: 'hari', cmp: 'prev', body: false, measures: [], bodyVal: false, hideKg: false, title: '', blur: 'none', blurH: 24 };
  let P = null;
  function loadPrefs() {
    let p = {};
    try { p = JSON.parse(localStorage.getItem(PREF_KEY) || '{}') || {}; } catch (e) {}
    const out = JSON.parse(JSON.stringify(DEF));
    if (p.v !== 2) {   // pilihan lama (Phase T): gaya, ukuran, warna, posisi, nama
      ['style', 'size', 'ink', 'pos'].forEach(function (k) { if (p[k]) out[k] = p[k]; });
      if (p.name != null) out.name = p.name;
      if (out.style === 'foto') out.style = 'grafik';
      return out;
    }
    Object.keys(DEF).forEach(function (k) { if (p[k] != null) out[k] = k === 'foot' ? Object.assign(out.foot, p.foot) : p[k]; });
    if (out.style === 'foto') out.style = 'grafik';
    return out;
  }
  function savePrefs() {
    try {
      const p = JSON.parse(JSON.stringify(P));
      if (st.src && st.src.admin) p.name = st.prevName;   // nama coach tidak menimpa nama klien di perangkat yang sama
      localStorage.setItem(PREF_KEY, JSON.stringify(p));
    } catch (e) {}
  }
  function kp(kind) { kind = kind || st.kind; P.k[kind] = Object.assign({}, KDEF, P.k[kind] || {}); return P.k[kind]; }

  // ── format ───────────────────────────────────────────────────────────────────
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (v, d) => Number(v || 0).toLocaleString(P && P.lang === 'id' ? 'id-ID' : 'en-US', { maximumFractionDigits: d || 0 });
  const kg = v => num(Math.round(Number(v) * 10) / 10, 1);
  const iso = d => String(d || '').slice(0, 10);
  const sign = v => (v > 0 ? '+' : v < 0 ? '−' : '±');
  function fmtDate(s) {
    const p = iso(s).split('-').map(Number); if (p.length !== 3 || !p[0]) return '';
    const d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    return T.dow[d.getUTCDay()] + ', ' + p[2] + ' ' + T.mon[p[1] - 1] + ' ' + p[0];
  }
  function fmtShort(s) { const p = iso(s).split('-').map(Number); return p[0] ? p[2] + ' ' + T.mon[p[1] - 1] : ''; }
  function fmtRange(a, b) { if (!a) return ''; if (a === b) return fmtDate(a); return fmtShort(a) + ' – ' + fmtShort(b) + ' ' + iso(b).slice(0, 4); }
  function fmtDur(sec) {
    const m = Math.round(Number(sec) / 60); if (!(m > 0)) return '';
    return m >= 60 ? Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '') : m + 'min';
  }
  function periodLabel(k) { return { hari: T.today, minggu: T.thisWeek, bulan: T.thisMonthP, '3bulan': T.last3 }[k] || ''; }

  // ── data kartu (hanya memilih dan memformat; angka sudah dihitung server) ─────
  function groupParts(day) {
    const o = {};
    ((day && day.items) || []).forEach(function (it) {
      const g = PART_GROUP[it.bodyPart]; if (!g) return;
      it.sets.forEach(function (s) { if (s.jenis !== 'w') o[g] = (o[g] || 0) + (Number(s.berat) || 0) * (Number(s.rep) || 0); });
    });
    return o;
  }
  function dayTotals(day) {
    let vol = 0, sets = 0, reps = 0, dur = 0;
    ((day && day.items) || []).forEach(function (it) { it.sets.forEach(function (s) { dur += Number(s.durasi) || 0; if (s.jenis === 'w') return; sets++; reps += Number(s.rep) || 0; vol += (Number(s.berat) || 0) * (Number(s.rep) || 0); }); });
    return { vol: Math.round(vol), sets: sets, reps: reps, dur: dur };
  }
  function bestSet(sets) {
    let best = null, be = -1;
    (sets || []).forEach(function (s) {
      if (s.jenis === 'w') return;
      const w = Number(s.berat) || 0, r = Number(s.rep) || 0;
      const e = w > 0 ? w * (1 + Math.min(r, 12) / 30) : r || (Number(s.durasi) || 0) / 60;
      if (e > be) { be = e; best = s; }
    });
    return best;
  }
  function setText(s, hideKg) {
    if (!s) return '';
    const w = Number(s.berat) || 0, r = Number(s.rep) || 0;
    if (w > 0 && r > 0) return hideKg ? '× ' + r : kg(w) + ' kg × ' + r;
    if (r > 0) return r + ' ' + T.reps.toLowerCase();
    if (Number(s.durasi) > 0) return fmtDur(s.durasi) || s.durasi + 's';
    return '';
  }
  function workoutDay(src) {
    const w = src.workout || {}, date = iso(src.date);
    const day = (w.days || []).find(d => d.tanggal === date) || (w.days || [])[0];
    const sess = (w.stats && w.stats.sessions) || [];
    const ses = sess.find(x => day && x.tanggal === day.tanggal) || {};
    const prev = day ? (sess.find(x => x.tanggal < day.tanggal && ses.hari && x.hari === ses.hari) || sess.find(x => x.tanggal < day.tanggal)) : null;
    return { w: w, day: day, ses: ses, prev: prev };
  }
  const stat = (id, l, v, x) => Object.assign({ id: id, l: l, v: v }, x || {});
  // Perbandingan: {prev:[sekarang, sebelumnya], pct:true} | start: teks | target: angka
  const cmpPrev = (cur, prev, pct, unit) => (prev == null || prev === '' || !isFinite(prev) ? null : { cur: Number(cur) || 0, prev: Number(prev) || 0, pct: !!pct, unit: unit || '' });
  function bodyText(m, ch, val, unit) {
    if (val != null && ch == null) return kg(val) + ' ' + unit;
    return sign(ch) + kg(Math.abs(ch)) + ' ' + unit;
  }
  function measureUnit(k) { return k === 'berat' ? 'kg' : 'cm'; }
  function bodyStats(src, k, per) {
    // per = data periode (server) atau null → perubahan sejak catatan pertama dari progress.summary
    const out = [], prog = src.progress || {};
    (k.measures.length ? k.measures : ['berat', 'pinggang']).forEach(function (m) {
      const unit = measureUnit(m);
      if (per && per.body && per.body[m]) {
        const b = per.body[m];
        if (k.bodyVal && b.last != null) out.push(stat('m:' + m, T.m[m], kg(b.last) + ' ' + unit, { cmp: { start: b.start && b.start.change != null ? bodyText(m, b.start.change, null, unit) : '' } }));
        else if (b.change != null) out.push(stat('m:' + m, T.m[m], bodyText(m, b.change, null, unit), { cmp: { start: b.start && b.start.change != null ? bodyText(m, b.start.change, null, unit) : '' } }));
        return;
      }
      const s = (prog.summary || {})[m];
      if (!s) return;
      if (k.bodyVal) out.push(stat('m:' + m, T.m[m], kg(s.last.nilai) + ' ' + unit, { cmp: { start: s.count >= 2 ? bodyText(m, s.change, null, unit) : '' } }));
      else if (s.count >= 2) out.push(stat('m:' + m, T.m[m], bodyText(m, s.change, null, unit)));
    });
    return out;
  }
  function measureSeries(src, m, per) {
    if (per && per.body && per.body[m]) return per.body[m].pts.map(p => p.v);
    return ((src.progress || {}).entries || []).map(e => Number(e[m])).filter(v => v > 0);
  }
  function measuresWithData(src) {
    const s = (src.progress || {}).summary || {};
    return MEASURES.filter(m => s[m]);
  }
  function badgeLabel(b) { const f = T.badge[b.kind]; return f ? f(b.need) : String(b.label || ''); }

  function buildLatihan(src, k, per, ex) {
    const hideKg = k.hideKg;
    if (per) {
      const w = per.workout || {};
      if (!w.workoutDays) return null;
      const pv = (per.compare && per.compare.prev && per.compare.prev.workout) || {};
      const stats = [
        stat('workouts', T.workouts, String(w.workoutDays), { cmp: { prev: cmpPrev(w.workoutDays, pv.workoutDays) } }),
        stat('duration', T.duration, fmtDur(w.durasi) || '–', { cmp: { prev: w.durasi ? cmpPrev(Math.round(w.durasi / 60), Math.round((pv.durasi || 0) / 60), true) : null } }),
        stat('volume', T.volume, num(w.volume) + ' kg', { kg: true, cmp: { prev: cmpPrev(w.volume, pv.volume, true) } }),
        stat('sets', T.sets, String(w.sets), { cmp: { prev: cmpPrev(w.sets, pv.sets) } }),
        stat('reps', T.reps, num(w.reps), { cmp: { prev: cmpPrev(w.reps, pv.reps, true) } }),
        stat('records', T.records, String(w.prs || 0), { medal: true, cmp: { prev: cmpPrev(w.prs, pv.prs) } }),
        stat('sessions', T.coachSessions, String(per.sessionsDone || 0), { cmp: { prev: cmpPrev(per.sessionsDone, per.compare && per.compare.prev.sessionsDone), target: per.period.key === 'bulan' ? per.compare.target.sessions : 0 } })
      ];
      const card = { kind: ex ? 'exercises' : 'latihan', title: periodLabel(per.period.key) || T.workout, date: fmtRange(per.period.from, per.period.to), stats: stats, vsKey: per.period.key, fname: 'workout-' + per.period.key + '-' + per.period.to, graphs: {} };
      if (ex) {
        const rows = (w.exercises || []).map(e => ({ n: e.gerakan, v: setText(e.best, hideKg) + (e.sets > 1 ? '  · ' + e.sets + ' ' + T.sets.toLowerCase() : ''), pr: e.pr }));
        card.graphs.list = { type: 'list', rows: rows.slice(0, 8), more: Math.max(0, rows.length - 8) };
      } else {
        card.graphs.radar = { type: 'radar', vals: AXES.map(a => Number((w.parts || {})[a]) || 0) };
        card.graphs.bodymap = { type: 'bodymap', parts: w.parts || {} };
        card.graphs.partbars = { type: 'hbars', rows: AXES.map(a => [T.parts[a], Number((w.parts || {})[a]) || 0]).filter(r => r[1] > 0).sort((a, b) => b[1] - a[1]) };
      }
      return card;
    }
    const o = workoutDay(src), day = o.day;
    if (!day) return null;
    const t = dayTotals(day), ses = o.ses, prev = o.prev || null;
    const parts = ses.parts && Object.keys(ses.parts).length ? ses.parts : groupParts(day);
    const dur = Number(ses.durasi) || t.dur;
    const stats = [
      stat('duration', T.duration, fmtDur(dur) || '–', { cmp: { prev: prev && prev.durasi && dur ? cmpPrev(Math.round(dur / 60), Math.round(prev.durasi / 60), true) : null } }),
      stat('volume', T.volume, num(ses.volume || t.vol) + ' kg', { kg: true, cmp: { prev: prev ? cmpPrev(ses.volume || t.vol, prev.volume, true) : null } }),
      stat('sets', T.sets, String(ses.sets || t.sets), { cmp: { prev: prev ? cmpPrev(ses.sets || t.sets, prev.sets) : null } }),
      stat('records', T.records, String(ses.prs || 0), { medal: true }),
      stat('exercises', T.exercises, String(day.items.length), { cmp: { prev: prev ? cmpPrev(day.items.length, prev.exercises) : null } }),
      stat('reps', T.reps, num(t.reps))
    ];
    const card = { kind: ex ? 'exercises' : 'latihan', title: ses.hari || T.workout, date: fmtDate(day.tanggal), stats: stats, vsKey: 'session', fname: 'workout-' + day.tanggal, graphs: {}, defOff: ['reps', 'exercises'] };
    if (ex) {
      const pts = {}; (((o.w.stats || {}).exercises) || []).forEach(function (e) { pts[e.key] = e.points || []; });
      const rows = day.items.filter(it => bestSet(it.sets)).map(function (it) {
        const p = pts[it.key] || [], i = p.findIndex(x => x.tanggal === day.tanggal);
        let pr = false;
        if (i > 0) { const before = Math.max.apply(null, p.slice(0, i).map(x => x.e1rm || 0)); pr = (p[i].e1rm || 0) > before && before > 0; }
        const work = it.sets.filter(s => s.jenis !== 'w').length;
        return { n: it.gerakan, v: setText(bestSet(it.sets), hideKg) + (work > 1 ? '  · ' + work + ' ' + T.sets.toLowerCase() : ''), pr: pr };
      });
      card.graphs.list = { type: 'list', rows: rows.slice(0, 8), more: Math.max(0, rows.length - 8) };
    } else {
      card.graphs.radar = { type: 'radar', vals: AXES.map(a => Number(parts[a]) || 0) };
      card.graphs.bodymap = { type: 'bodymap', parts: parts };
      card.graphs.partbars = { type: 'hbars', rows: AXES.map(a => [T.parts[a], Number(parts[a]) || 0]).filter(r => r[1] > 0).sort((a, b) => b[1] - a[1]) };
    }
    return card;
  }
  function buildRecord(src, k) {
    const exs = ((src.workout || {}).stats || {}).exercises || [];
    const ex = exs.find(e => e.key === src.exKey) || exs.find(e => e.pr && e.pr.tanggal === iso(src.date)) || exs.find(e => e.pr) || exs[0];
    if (!ex || !ex.points || !ex.points.length) return null;
    const pr = ex.pr || ex.points[ex.points.length - 1], pts = ex.points.filter(p => p.e1rm > 0);
    if (!pts.length) return null;
    const prev = pts.length > 1 ? pts[pts.length - 2].e1rm : 0, last = pts[pts.length - 1], first = pts[0];
    const s = [];
    if (k.hideKg) {
      s.push(stat('best', T.bestSet, '× ' + pr.rep, { medal: true }));
      if (first.e1rm > 0 && pts.length > 1) s.push(stat('impr', T.improvement, sign(last.e1rm - first.e1rm) + Math.round(Math.abs(last.e1rm - first.e1rm) / first.e1rm * 100) + '%'));
    } else {
      s.push(stat('best', T.bestSet, kg(pr.berat) + ' kg × ' + pr.rep, { medal: true }), stat('e1rm', T.e1rm, kg(pr.e1rm) + ' kg', { kg: true }));
      if (prev && last) s.push(stat('vsprev', T.vsPrev, sign(last.e1rm - prev) + kg(Math.abs(last.e1rm - prev)) + ' kg', { kg: true }));
      if (pts.length > 2) s.push(stat('impr', T.improvement, sign(last.e1rm - first.e1rm) + Math.round(Math.abs(last.e1rm - first.e1rm) / first.e1rm * 100) + '%'));
    }
    const lifts = exs.filter(e => (e.points || []).filter(p => p.e1rm > 0).length >= 2).sort((a, b) => b.points.length - a.points.length).slice(0, 3)
      .map(e => ({ n: e.gerakan, pts: e.points.filter(p => p.e1rm > 0).map(p => p.e1rm), last: k.hideKg ? '' : kg(e.points[e.points.length - 1].e1rm) + ' kg' }));
    const g = { line: { type: 'line', pts: pts.map(p => p.e1rm) } };
    if (lifts.length) g.lifts = { type: 'lines', series: lifts };
    return { kind: 'record', title: ex.gerakan, date: fmtDate(pr.tanggal), stats: s, graphs: g, fname: 'record-' + pr.tanggal };
  }
  function buildProgres(src, k) {
    const p = src.progress || {}, sh = src.share || {}, mo = sh.month || {}, pm = sh.prevMonth || {};
    const earned = (p.badges || []).filter(b => b.earned);
    const stats = [

  // ── simpan / bagikan / set / video ───────────────────────────────────────────
  function fname(ext) { return 'xnk-' + (st.card.fname || 'share') + '.' + (ext || 'png'); }
  async function renderOut() {
    const o = opts();
    if (P.fmt === 'hq') { o.scale = 2; const c = await draw(st.card, o); const b = await new Promise(r => c.toBlob(r, 'image/png')); return { blob: b, name: fname('png') }; }
    if (P.fmt === 'video') return recordVideo();
    return { blob: st.blob, name: fname('png') };
  }
  function videoType() {
    const c = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    for (let i = 0; i < c.length; i++) if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c[i])) return c[i];
    return '';
  }
  /** Video 6 detik tanpa suara: angka naik dan grafik tergambar, lalu diam. */
  async function recordVideo(durMs) {
    if (st.recording) return null;
    st.recording = true; busy(true);
    const go = $('share-go'); if (go) go.disabled = true;
    try {
      const o = opts(); o.video = true; o.noFonts = true;
      const cnv = document.createElement('canvas'); cnv.width = W; cnv.height = o.H;
      await draw(st.card, Object.assign({}, o, { t: 0, noFonts: false }), cnv);
      const img = await logo(), ctx = cnv.getContext('2d');
      const type = videoType(), stream = cnv.captureStream(30), rec = new MediaRecorder(stream, type ? { mimeType: type, videoBitsPerSecond: 6000000 } : undefined), chunks = [];
      rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      const done = new Promise(r => { rec.onstop = r; });
      const total = durMs || 6000, anim = 3600, t0 = performance.now();
      rec.start(250);
      await new Promise(function (res) {
        (function frame() {
          const el = performance.now() - t0;
          ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, o.H);
          paint(ctx, st.card, Object.assign({}, o, { t: Math.min(1, el / anim) }), img);
          const bar = $('share-busy'); if (bar) bar.style.setProperty('--p', Math.min(100, Math.round(el / total * 100)) + '%');
          if (el < total) requestAnimationFrame(frame); else res();
        })();
      });
      rec.stop(); await done;
      stream.getTracks().forEach(t => t.stop());
      const mt = (type || 'video/webm').split(';')[0];
      return { blob: new Blob(chunks, { type: mt }), name: fname(mt === 'video/mp4' ? 'mp4' : 'webm') };
    } catch (e) { window.showToast('Video tidak bisa dibuat di perangkat ini. Pakai Gambar.'); return null; }
    finally { st.recording = false; busy(false); const g = $('share-go'); if (g) g.disabled = false; const bar = $('share-busy'); if (bar) bar.style.removeProperty('--p'); }
  }
  function download(blob, name) {
    const u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
  }
  window.shareSave = async function () {
    if (st.tray.length) { st.tray.forEach(t => download(t.blob, t.name)); window.showToast(st.tray.length + ' gambar disimpan.'); return; }
    const out = await renderOut(); if (!out || !out.blob) return;
    download(out.blob, out.name);
    window.showToast(/video/.test(out.blob.type) ? 'Video disimpan.' : 'Gambar disimpan. Di iPhone: tekan lama gambar → Simpan ke Foto.');
  };
  window.shareGo = async function () {
    // Gambar biasa: blob sudah siap sebelum tombol ditekan (aktivasi pengguna tetap utuh untuk navigator.share).
    let files;
    if (st.tray.length) files = st.tray.map(t => ({ blob: t.blob, name: t.name }));
    else if (P.fmt === 'png') { if (!st.blob) return; files = [{ blob: st.blob, name: fname('png') }]; }
    else { const out = await renderOut(); if (!out || !out.blob) return; files = [out]; }
    if (st.host) {
      st.pending = setTimeout(function () { st.pending = null; shareInFrame(files); }, 1500);
      try { window.top.postMessage(files.length === 1 ? { xnk: 'share', blob: files[0].blob, name: files[0].name } : { xnk: 'share', files: files }, '*'); return; } catch (e) { clearTimeout(st.pending); }
    }
    shareInFrame(files);
  };
  function shareInFrame(files) {
    const fl = files.map(f => new File([f.blob], f.name, { type: f.blob.type }));
    if (navigator.canShare && navigator.canShare({ files: fl })) navigator.share({ files: fl }).catch(function () {});
    else files.forEach(f => download(f.blob, f.name));
  }
  window.shareCopy = function () {
    if (!st.blob) return;
    if (st.host) { try { window.top.postMessage({ xnk: 'copy', blob: st.blob }, '*'); return; } catch (e) {} }
    try { navigator.clipboard.write([new ClipboardItem({ 'image/png': st.blob })]).then(function () { window.showToast('Disalin. Tempel di Story Instagram.'); }, function () { window.showToast('Salin tidak didukung. Pakai Simpan.'); }); } catch (e) { window.showToast('Salin tidak didukung. Pakai Simpan.'); }
  };
  window.shareTrayAdd = async function () {
    if (st.tray.length >= 5) return;
    const out = await renderOut(); if (!out || !out.blob) return;
    st.tray.push({ blob: out.blob, name: out.name.replace(/\.png$/, '-' + (st.tray.length + 1) + '.png'), url: URL.createObjectURL(out.blob), kind: st.kind });
    renderFoot(); window.showToast('Ditambahkan ke set (' + st.tray.length + '/5). Geser untuk kartu lain.');
  };
  window.shareTrayDel = function (i) { const t = st.tray.splice(i, 1)[0]; if (t) URL.revokeObjectURL(t.url); renderFoot(); };
  window.shareTrayClear = function () { st.tray.forEach(t => URL.revokeObjectURL(t.url)); st.tray = []; renderFoot(); };
  window.addEventListener('message', function (e) {
    if (window.top === window || e.source !== window.top) return;
    const d = e.data; if (!d || typeof d !== 'object') return;
    if (d.xnk === 'host') st.host = d.share === true;
    else if (d.xnk === 'share-done') { clearTimeout(st.pending); st.pending = null; if (!d.ok) window.shareSave(); }
    else if (d.xnk === 'copy-done') window.showToast(d.ok ? 'Disalin. Tempel di Story Instagram.' : 'Salin tidak didukung. Pakai Simpan.');
  });
  document.addEventListener('keydown', function (e) {
    const sh = $('sheet-share');
    if (!sh || sh.classList.contains('hide') || !isDesk()) return;
    if (/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) return;
    if (e.key === 'ArrowLeft') window.shareStep(-1); else if (e.key === 'ArrowRight') window.shareStep(1);
  });

  // ── galeri "Kartu saya": gambar kecil semua kartu yang tersedia ──────────────
  window.shareGallery = function (el, src, onPick) {
    if (!el) return;
    P = P || loadPrefs(); T = L[P.lang] || L.en;
    const saved = st.src; st.src = src;
    const kinds = availableKinds(src).filter(k => k !== 'foto');
    st.src = saved;
    el.innerHTML = kinds.length ? kinds.map(k => '<button type="button" class="sh-gal-item" data-kind="' + k + '" onclick="window.shareGalleryPick(\'' + k + '\')"><span class="sh-gal-img skel"><img alt=""></span><span class="sh-gal-name">' + ic(KIND_ICON[k]) + KIND_NAME[k] + '</span></button>').join('') +
      (src.admin ? '' : '<button type="button" class="sh-gal-item" onclick="window.shareGalleryPick(\'foto\')"><span class="sh-gal-img sh-gal-ph">' + ic('image') + '</span><span class="sh-gal-name">' + ic('image') + 'Foto progres</span></button>')
      : '<p class="li-sub">Belum ada data untuk dibagikan. Catat latihan atau ukuran dulu.</p>';
    window.shareGalleryPick = function (k) { if (onPick) onPick(k); };
    if (window.scheduleIconUpdate) window.scheduleIconUpdate();
    const items = Array.from(el.querySelectorAll('.sh-gal-item[data-kind]'));
    const drawOne = async function (btn) {
      const k = btn.getAttribute('data-kind'), prev = { src: st.src, kind: st.kind, card: st.card };
      st.src = src; st.kind = k;
      try {
        const card = makeCard(k, src, null); if (!card) return;
        st.card = card;
        const o = opts(); o.scale = .25; o.style = o.style === 'foto' ? 'gelap' : o.style;
        if (o.style === 'teks' || o.style === 'grafik') o.style = 'gelap';
        const c = await draw(card, o);
        const im = btn.querySelector('img'); im.src = c.toDataURL('image/png'); btn.querySelector('.sh-gal-img').classList.remove('skel');
      } catch (e) {} finally { st.src = prev.src; st.kind = prev.kind; st.card = prev.card; }
    };
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(function (es) { es.forEach(function (en) { if (en.isIntersecting) { io.unobserve(en.target); drawOne(en.target); } }); }, { rootMargin: '200px' });
      items.forEach(b => io.observe(b));
    } else items.forEach(drawOne);
  };

  // ── ajakan bagikan setelah momen (toast kecil, maks 1× per hari) ─────────────
  window.shareNudge = function (kind, msg, src, extra) {
    if (window.shareOn === false || !src) return false;
    let pf = {}; try { pf = JSON.parse(localStorage.getItem('xnk_wl_prefs') || '{}') || {}; } catch (e) {}
    if (pf.shareNudge === false) return false;
    const today = iso(src.today);
    try { if (localStorage.getItem(NUDGE_KEY) === today) return false; localStorage.setItem(NUDGE_KEY, today); } catch (e) { return false; }
    const el = $('share-nudge'), txt = $('share-nudge-msg');
    if (!el || !txt) return false;
    txt.textContent = msg;
    el.classList.remove('hide');
    requestAnimationFrame(function () { el.classList.add('show'); });
    window._shareNudgeGo = function () { el.classList.remove('show'); setTimeout(() => el.classList.add('hide'), 300); window.shareOpen(kind, src, extra || {}); };
    clearTimeout(window._shareNudgeT);
    window._shareNudgeT = setTimeout(function () { el.classList.remove('show'); setTimeout(() => el.classList.add('hide'), 300); }, 7000);
    return true;
  };
  window.shareNudgeClose = function () { const el = $('share-nudge'); if (el) { el.classList.remove('show'); setTimeout(() => el.classList.add('hide'), 300); } };

  // Untuk tools/share-check.js: gambar kartu tanpa lembar, ambil kotak tata letak dan QR.
  window.shareDraw = function (card, o) { return draw(card, o); };
  window.shareCheck = {
    card: function () { return st.card; },
    layout: function () { return layout(st.card, opts()); },
    opts: function () { return opts(); },
    qr: function (t) { return QR.make(t); },
    render: async function (fmt) { const f = P.fmt; P.fmt = fmt; try { return await renderOut(); } finally { P.fmt = f; } },
    video: function (ms) { return recordVideo(ms); },
    kinds: function () { return st.kinds.slice(); },
    setPhotos: function (a, b) { st.photoA = a; st.photoB = b; st.photoAInfo = '2026-08-01'; st.photoBInfo = '2026-10-28'; refresh(); }
  };
})();
</script>
