<!--
  Components.html — XNK Premium Workspace
  Phase 1A: Shared HTML components extracted from Index.html
  Includes: Toast, Modal Overlay, Loader
-->
  <!-- Toast Notification -->
  <div id="toast" class="hide fixed bottom-6 right-6 z-[100] bg-gray-900 text-white px-5 py-3 rounded-2xl shadow-xl text-sm font-bold flex items-center gap-3 max-w-sm toast-enter">
    <i data-lucide="circle-check" class="w-5 h-5 text-green-400 shrink-0"></i>
    <p id="toast-message" class="flex-1"></p>
  </div>

  <!-- Modal Overlay (Shared) -->
  <div id="modal-overlay" class="hide fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6 modal-content" id="modal-content-area">
      <!-- Modal content injected here by open functions -->
    </div>
  </div>

  <!-- Global Loader (Optional, not present in original Index.html but useful) -->
  <div id="global-loader" class="hide fixed inset-0 z-[200] flex items-center justify-center bg-black/20 modal-overlay">
    <div class="bg-white rounded-3xl shadow-2xl p-8 flex flex-col items-center gap-4">
      <div class="loading-spinner" style="width:40px;height:40px;border-width:4px;"></div>
      <p class="text-sm font-bold text-gray-500">Memproses...</p>
    </div>
  </div>

  <!-- ============================================================
       PHASE 1 — REDESIGN BLUEPRINT v2 COMPONENT TEMPLATES
       Inert <template> blocks. Clone via cloneTemplate('tpl-id').
       Nothing renders until explicitly used → fully non-breaking.
       ============================================================ -->

  <!-- Member Check: "Sudah jadi member?" choice -->
  <template id="tpl-member-check">
    <div class="xnk-membercheck xnk-scale-in text-center">
      <h2 class="text-2xl font-extrabold text-gray-900 mb-2">Sudah Menjadi Member?</h2>
      <p class="text-sm text-gray-500 mb-6">Pilih salah satu untuk melanjutkan booking sesi PT kamu.</p>
      <div class="grid gap-3">
        <button type="button" class="xnk-btn xnk-btn-primary xnk-btn-lg xnk-btn-block xnk-tap" data-action="existing-member">
          <i data-lucide="user-check" class="w-5 h-5"></i> Saya Member Lama
        </button>
        <button type="button" class="xnk-btn xnk-btn-secondary xnk-btn-lg xnk-btn-block xnk-tap" data-action="new-member">
          <i data-lucide="user-plus" class="w-5 h-5"></i> Saya Member Baru
        </button>
      </div>
    </div>
  </template>

  <!-- Phone field with +62 prefix -->
  <template id="tpl-phone-field">
    <div class="xnk-field" data-field="phone">
      <label class="xnk-label">Nomor WhatsApp <span class="req">*</span></label>
      <div class="xnk-phone">
        <span class="xnk-phone-prefix">+62</span>
        <input type="tel" inputmode="numeric" autocomplete="tel" placeholder="81234567890" class="xnk-phone-input" />
      </div>
      <p class="xnk-error-text hide">Nomor WhatsApp tidak valid.</p>
    </div>
  </template>

  <!-- Member verification panel -->
  <template id="tpl-member-verify">
    <div class="xnk-membercheck xnk-fade-in">
      <h2 class="text-2xl font-extrabold text-gray-900 mb-1">Verifikasi Member</h2>
      <p class="text-sm text-gray-500 mb-5">Masukkan nomor WhatsApp atau Member ID kamu.</p>
      <div class="xnk-field">
        <label class="xnk-label">Nomor WhatsApp / Member ID <span class="req">*</span></label>
        <input type="text" class="xnk-input" data-field="identifier" placeholder="08123… atau PT-001" autocomplete="off" />
        <p class="xnk-error-text hide" data-error="identifier">Member tidak ditemukan.</p>
      </div>
      <button type="button" class="xnk-btn xnk-btn-primary xnk-btn-lg xnk-btn-block xnk-tap" data-action="verify">
        <i data-lucide="search" class="w-5 h-5"></i> Cari Data Saya
      </button>
    </div>
  </template>

  <!-- Member found / session status card -->
  <template id="tpl-session-card">
    <div class="xnk-session-card found xnk-scale-in">
      <div class="flex items-center gap-2 mb-1">
        <i data-lucide="badge-check" class="w-5 h-5 text-green-600"></i>
        <h3 class="font-extrabold text-gray-900" data-bind="name">—</h3>
      </div>
      <p class="text-xs text-gray-500" data-bind="memberId">—</p>
      <div class="xnk-session-meta">
        <div class="xnk-session-meta-item">Sisa Sesi <strong data-bind="remaining">0</strong></div>
        <div class="xnk-session-meta-item">Total Sesi <strong data-bind="total">0</strong></div>
        <div class="xnk-session-meta-item">Bergabung <strong data-bind="joinDate">—</strong></div>
      </div>
      <button type="button" class="xnk-btn xnk-btn-primary xnk-btn-block xnk-tap mt-2" data-action="continue-booking">
        Lanjut Booking <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </div>
  </template>

  <!-- FAQ accordion item -->
  <template id="tpl-faq-item">
    <div class="xnk-faq-item">
      <button type="button" class="xnk-faq-q xnk-tap" onclick="toggleFaq(this.closest('.xnk-faq-item'))">
        <span data-bind="question">Pertanyaan</span>
        <i data-lucide="chevron-down" class="xnk-faq-icon w-5 h-5 text-gray-400"></i>
      </button>
      <div class="xnk-faq-a">
        <div class="xnk-faq-a-inner" data-bind="answer">Jawaban</div>
      </div>
    </div>
  </template>

  <!-- Floating "Book Session" action button -->
  <template id="tpl-fab-book">
    <div class="xnk-fab-wrap">
      <button type="button" class="xnk-fab" data-action="open-booking" aria-label="Book Session">
        <i data-lucide="calendar-plus"></i>
      </button>
      <span class="xnk-fab-label">Book Sesi PT</span>
    </div>
  </template>

  <script>
    /**
     * Clone konten sebuah <template> dan kembalikan elemen pertamanya.
     * @param {string} id - id template
     * @returns {HTMLElement|null}
     */
    function cloneTemplate(id) {
      var tpl = document.getElementById(id);
      if (!tpl || !tpl.content) return null;
      var frag = tpl.content.cloneNode(true);
      return frag.firstElementChild;
    }

    /**
     * Isi elemen hasil clone berdasarkan atribut data-bind.
     * @param {HTMLElement} el
     * @param {Object} data - key cocok dengan nilai data-bind
     * @returns {HTMLElement}
     */
    function bindTemplate(el, data) {
      if (!el || !data) return el;
      el.querySelectorAll('[data-bind]').forEach(function(node){
        var key = node.getAttribute('data-bind');
        if (data[key] !== undefined && data[key] !== null) node.textContent = data[key];
      });
      return el;
    }
  </script>
