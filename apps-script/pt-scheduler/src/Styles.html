<!--
  Styles.html — XNK Premium Workspace
  Phase 1A: All CSS extracted from Index.html
  Includes: Base styles, FullCalendar, Scrollbar, Animations, Design System
-->
<style>
  /* ========== BASE ========== */
  body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
  .hide { display: none !important; }
  
  /* ========== FULLCALENDAR ========== */
  .fc { font-family: 'Inter', sans-serif; }
  .fc-toolbar-title { font-size: 1.125rem !important; font-weight: 800 !important; text-transform: uppercase; letter-spacing: -0.025em; }
  .fc-button-primary { background-color: #0f172a !important; border-color: #0f172a !important; text-transform: capitalize !important; font-weight: 600 !important; border-radius: 0.5rem !important; padding: 0.4rem 0.8rem !important; }
  .fc-button-primary:hover { background-color: #334155 !important; border-color: #334155 !important; }
  .fc-button-active { background-color: #000000 !important; border-color: #000000 !important; }
  .fc-daygrid-day-number, .fc-col-header-cell-cushion { color: #475569 !important; font-weight: 600; text-decoration: none !important; }
  .fc-event { border-radius: 0.375rem; border: none; padding: 0.125rem 0.25rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: transform 0.1s; color: white !important; }
  .fc-event:hover { transform: scale(1.02); }
  .fc-timegrid-slot-label-cushion { font-size: 0.75rem; color: #64748b; }
  
  /* ========== SCROLLBAR ========== */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  
  /* ========== LOADING SPINNER ========== */
  .loading-spinner { border: 3px solid rgba(0, 0, 0, 0.1); border-left-color: #000; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  
  /* ========== DESIGN SYSTEM VARIABLES ========== */
  :root {
    /* Colors */
    --color-black: #0f172a;
    --color-white: #ffffff;
    --color-gray-50: #f8fafc;
    --color-gray-100: #f1f5f9;
    --color-gray-200: #e2e8f0;
    --color-gray-300: #cbd5e1;
    --color-gray-400: #94a3b8;
    --color-gray-500: #64748b;
    --color-gray-600: #475569;
    --color-gray-700: #334155;
    --color-gray-800: #1e293b;
    --color-gray-900: #0f172a;
    --color-accent: #0f172a;
    --color-success: #22c55e;
    --color-warning: #f59e0b;
    --color-error: #ef4444;
    --color-whatsapp: #25D366;
    
    /* Typography */
    --font-sans: 'Inter', sans-serif;
    --font-size-xs: 0.75rem;
    --font-size-sm: 0.875rem;
    --font-size-base: 1rem;
    --font-size-lg: 1.125rem;
    --font-size-xl: 1.25rem;
    --font-size-2xl: 1.5rem;
    --font-size-3xl: 1.875rem;
    
    /* Spacing */
    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-5: 1.25rem;
    --space-6: 1.5rem;
    --space-8: 2rem;
    --space-10: 2.5rem;
    --space-12: 3rem;
    
    /* Border Radius */
    --radius-sm: 0.375rem;
    --radius-md: 0.5rem;
    --radius-lg: 0.75rem;
    --radius-xl: 1rem;
    --radius-2xl: 1.5rem;
    --radius-3xl: 2rem;
    --radius-full: 9999px;
    
    /* Shadows */
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    
    /* Transitions */
    --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
    --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
    --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  /* ========== NEW UI COMPONENT STYLES ========== */
  
  
  /* Modal Animation */
  .modal-overlay { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-content { animation: modalIn 0.2s ease-out; }
  
  /* ========== LANDING PAGE STYLES (Phase 3+) ========== */
  
  /* Hero Section */
  .hero-gradient {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
  }
  
  /* Glass Card */
  .glass-card {
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .dark-glass-card {
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  
  /* Gradient Text */
  .gradient-text {
    background: linear-gradient(135deg, #f8fafc 0%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  /* CTA Button Pulse */
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(15, 23, 42, 0.4); }
    50% { box-shadow: 0 0 0 12px rgba(15, 23, 42, 0); }
  }
  .cta-pulse { animation: pulse-glow 2s infinite; }
  
  /* Booking Wizard Steps */
  .step-indicator { display: flex; align-items: center; gap: 0.5rem; }
  .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-gray-300); transition: all var(--transition-base); }
  .step-dot.active { background: var(--color-black); width: 24px; border-radius: 4px; }
  .step-dot.completed { background: var(--color-success); }
  
  /* Smooth Page Transitions */
  .page-enter { opacity: 0; }
  .page-enter-active { opacity: 1; transition: opacity 0.3s ease; }
  .page-exit { opacity: 1; }
  .page-exit-active { opacity: 0; transition: opacity 0.2s ease; }
  
  /* Pill Tags */
  .pill { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
  .pill-success { background: #dcfce7; color: #166534; }
  .pill-warning { background: #fef3c7; color: #92400e; }
  .pill-error { background: #fce4ec; color: #c62828; }
  .pill-neutral { background: #f1f5f9; color: #475569; }
  
  /* Pricing Cards */
  .pricing-card {
    transition: all var(--transition-slow);
    position: relative;
  }
  .pricing-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-xl); }
  .pricing-card.featured {
    border: 2px solid var(--color-black);
    transform: scale(1.02);
  }
  .pricing-card.featured:hover { transform: scale(1.02) translateY(-4px); }
  .pricing-badge {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--color-black);
    color: white;
    font-size: 0.625rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.25rem 1rem;
    border-radius: 9999px;
  }
  
  /* Skeleton Loading */
  .skeleton {
    background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: var(--radius-md);
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  
  /* Mobile Bottom Sheet Modal */
  @media (max-width: 640px) {
    .modal-sheet {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      top: auto !important;
      transform: translateY(0) !important;
      border-radius: 1.5rem 1.5rem 0 0 !important;
      max-height: 90vh !important;
      overflow-y: auto !important;
      animation: sheetUp 0.3s ease-out !important;
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
  }
  
  /* Safe Area for Notch Phones */
  @supports (padding-bottom: env(safe-area-inset-bottom)) {
  .pb-safe {
    /* Menambahkan padding ekstra sebesar ukuran home indicator OS */
    padding-bottom: env(safe-area-inset-bottom);
  }
}
  .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
  
  /* Date/Time Picker for Booking Wizard */
  .time-slot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 1rem;
    border-radius: var(--radius-lg);
    font-size: var(--font-size-sm);
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition-fast);
    border: 1.5px solid var(--color-gray-200);
    background: var(--color-white);
    color: var(--color-gray-700);
    min-width: 80px;
  }
  .time-slot:hover { border-color: var(--color-black); background: var(--color-gray-50); }
  .time-slot.selected { border-color: var(--color-black); background: var(--color-black); color: white; }
  .time-slot.unavailable { opacity: 0.4; cursor: not-allowed; text-decoration: line-through; }
  
  /* Coach Select Cards */
  .coach-card {
    cursor: pointer;
    border: 2px solid transparent;
    transition: all var(--transition-base);
  }
  .coach-card:hover { border-color: var(--color-gray-300); }
  .coach-card.selected { border-color: var(--color-black); background: var(--color-gray-50); }
  
  /* Empty State */
  .empty-state { text-align: center; padding: 3rem 1rem; }
  .empty-state-icon { width: 64px; height: 64px; margin: 0 auto 1rem; background: var(--color-gray-100); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  
  /* Success State */
  .success-checkmark { width: 80px; height: 80px; margin: 0 auto 1.5rem; border-radius: 50%; background: #dcfce7; display: flex; align-items: center; justify-content: center; position: relative; }
  .success-checkmark::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 3px solid #22c55e;
    animation: checkmarkPulse 1.5s infinite;
  }
  @keyframes checkmarkPulse {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.3); opacity: 0; }
  }
  
  /* Error State */
  .error-shake { animation: shake 0.4s ease-in-out; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    50% { transform: translateX(8px); }
    75% { transform: translateX(-4px); }
  }
  
  /* Responsive Breakpoint Helpers */
  @media (max-width: 640px) {
    .hidden-mobile { display: none !important; }
    .fc-toolbar { flex-direction: column !important; gap: 0.5rem !important; }
    .fc-header-toolbar .fc-toolbar-chunk { display: flex; justify-content: center; }
  }
  @media (min-width: 641px) {
    .hidden-desktop { display: none !important; }
  }

  /* ===== TOAST ANIMATIONS ===== */
  .toast-enter {
    animation: toastSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .toast-leave {
    animation: toastSlideOut 0.25s ease-in forwards;
  }
  @keyframes toastSlideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes toastSlideOut {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(100%); opacity: 0; }
  }

  /* ============================================================
     PHASE 1 — REDESIGN BLUEPRINT v2 ADDITIONS (additive only)
     ============================================================ */

  /* ----- Layout Containers ----- */
  .xnk-container { max-width: 1200px; margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }
  .xnk-container-narrow { max-width: 640px; margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }
  .xnk-container-content { max-width: 720px; margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }

  /* ----- Animation Keyframes ----- */
  @keyframes xnkFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes xnkSlideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes xnkScaleIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  @keyframes xnkCheckDraw { from { stroke-dashoffset: 48; } to { stroke-dashoffset: 0; } }
  .xnk-fade-in { animation: xnkFadeIn 0.3s ease-out both; }
  .xnk-slide-up { animation: xnkSlideUp 0.4s cubic-bezier(0.16,1,0.3,1) both; }
  .xnk-scale-in { animation: xnkScaleIn 0.25s cubic-bezier(0.16,1,0.3,1) both; }

  /* Scroll-reveal (Intersection Observer toggles .is-visible) */
  .xnk-reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16,1,0.3,1); }
  .xnk-reveal.is-visible { opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .xnk-fade-in, .xnk-slide-up, .xnk-scale-in,
    .xnk-reveal { animation: none !important; opacity: 1 !important; transform: none !important; transition: none !important; }
  }

  /* ----- Button Variants ----- */
  .xnk-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; font-family: var(--font-sans); font-weight: 600; font-size: var(--font-size-sm); line-height: 1; padding: 0.75rem 1.25rem; border-radius: var(--radius-lg); border: 1.5px solid transparent; cursor: pointer; transition: all var(--transition-base); text-decoration: none; white-space: nowrap; }
  .xnk-btn:disabled, .xnk-btn.is-disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
  .xnk-btn-lg { padding: 0.9rem 1.6rem; font-size: var(--font-size-base); border-radius: var(--radius-xl); }
  .xnk-btn-block { width: 100%; }
  .xnk-btn-primary { background: var(--color-black); color: #fff; border-color: var(--color-black); }
  .xnk-btn-primary:hover { background: var(--color-gray-700); border-color: var(--color-gray-700); }
  .xnk-btn-primary:active { transform: scale(0.98); }
  .xnk-btn-secondary { background: var(--color-white); color: var(--color-black); border-color: var(--color-gray-200); }
  .xnk-btn-secondary:hover { border-color: var(--color-black); background: var(--color-gray-50); }
  .xnk-btn-ghost { background: transparent; color: var(--color-gray-700); border-color: transparent; }
  .xnk-btn-ghost:hover { background: var(--color-gray-100); }
  .xnk-btn-whatsapp { background: var(--color-whatsapp); color: #fff; border-color: var(--color-whatsapp); }
  .xnk-btn-whatsapp:hover { background: #1da851; border-color: #1da851; }
  .xnk-btn .xnk-btn-spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-left-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
  .xnk-btn.is-loading { pointer-events: none; }

  /* ----- Form Inputs ----- */
  .xnk-field { margin-bottom: 1rem; }
  .xnk-label { display: block; font-size: var(--font-size-sm); font-weight: 600; color: var(--color-gray-700); margin-bottom: 0.4rem; }
  .xnk-label .req { color: var(--color-error); }
  .xnk-input, .xnk-select, .xnk-textarea {
    width: 100%; font-family: var(--font-sans); font-size: 16px; /* prevents iOS zoom */
    color: var(--color-black); background: var(--color-white);
    border: 1.5px solid var(--color-gray-200); border-radius: var(--radius-lg);
    padding: 0.75rem 0.9rem; transition: all var(--transition-fast); outline: none;
  }
  .xnk-input:focus, .xnk-select:focus, .xnk-textarea:focus { border-color: var(--color-black); box-shadow: 0 0 0 3px rgba(15,23,42,0.08); }
  .xnk-input::placeholder, .xnk-textarea::placeholder { color: var(--color-gray-400); }
  .xnk-textarea { min-height: 88px; resize: vertical; }
  .xnk-field.has-error .xnk-input,
  .xnk-field.has-error .xnk-select { border-color: var(--color-error); }
  .xnk-hint { font-size: var(--font-size-xs); color: var(--color-gray-500); margin-top: 0.35rem; }
  .xnk-error-text { font-size: var(--font-size-xs); color: var(--color-error); margin-top: 0.35rem; }

  /* Phone input with +62 prefix */
  .xnk-phone { display: flex; align-items: stretch; border: 1.5px solid var(--color-gray-200); border-radius: var(--radius-lg); overflow: hidden; transition: all var(--transition-fast); background: var(--color-white); }
  .xnk-phone:focus-within { border-color: var(--color-black); box-shadow: 0 0 0 3px rgba(15,23,42,0.08); }
  .xnk-phone-prefix { display: flex; align-items: center; padding: 0 0.85rem; font-size: 16px; font-weight: 600; color: var(--color-gray-600); background: var(--color-gray-100); border-right: 1.5px solid var(--color-gray-200); }
  .xnk-phone input { flex: 1; border: none; outline: none; padding: 0.75rem 0.9rem; font-size: 16px; font-family: var(--font-sans); background: transparent; color: var(--color-black); }
  .xnk-field.has-error .xnk-phone { border-color: var(--color-error); }

  /* Radio pill group */
  .xnk-radio-group { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .xnk-radio-pill { flex: 1 1 auto; text-align: center; padding: 0.7rem 0.9rem; border: 1.5px solid var(--color-gray-200); border-radius: var(--radius-lg); font-size: var(--font-size-sm); font-weight: 600; color: var(--color-gray-700); cursor: pointer; transition: all var(--transition-fast); background: var(--color-white); user-select: none; }
  .xnk-radio-pill:hover { border-color: var(--color-gray-400); }
  .xnk-radio-pill.selected { border-color: var(--color-black); background: var(--color-black); color: #fff; }

  /* Date dropdown combo */
  .xnk-date-combo { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 0.5rem; }

  /* ----- Floating Action Button (FAB) ----- */
  .xnk-fab {
    position: fixed; bottom: 24px; right: 24px; z-index: 25;
    width: 56px; height: 56px; border-radius: 9999px;
    background: var(--color-black); color: #fff; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(15,23,42,0.35);
    transition: transform var(--transition-fast), box-shadow var(--transition-base);
  }
  .xnk-fab:hover { transform: scale(1.06); box-shadow: 0 12px 30px rgba(15,23,42,0.4); }
  .xnk-fab:active { transform: scale(0.95); }
  .xnk-fab svg { width: 24px; height: 24px; }
  .xnk-fab-label { position: fixed; bottom: 34px; right: 90px; z-index: 25; background: var(--color-black); color: #fff; font-size: var(--font-size-xs); font-weight: 600; padding: 0.4rem 0.75rem; border-radius: var(--radius-md); box-shadow: var(--shadow-md); pointer-events: none; opacity: 0; transform: translateX(8px); transition: all var(--transition-base); }
  .xnk-fab:hover + .xnk-fab-label, .xnk-fab-wrap:hover .xnk-fab-label { opacity: 1; transform: translateX(0); }
  @media (max-width: 640px) {
    .xnk-fab { width: 52px; height: 52px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); right: 18px; }
    .xnk-fab-label { display: none; }
  }

  /* ----- Session / Member status card ----- */
  .xnk-session-card { background: var(--color-white); border: 1.5px solid var(--color-gray-200); border-radius: var(--radius-xl); padding: 1.25rem; }
  .xnk-session-card.found { border-color: var(--color-success); background: #f0fdf4; }
  .xnk-session-card.not-found { border-color: var(--color-warning); background: #fffbeb; }
  .xnk-session-meta { display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; margin: 0.75rem 0; }
  .xnk-session-meta-item { font-size: var(--font-size-sm); color: var(--color-gray-600); }
  .xnk-session-meta-item strong { display: block; font-size: var(--font-size-lg); font-weight: 800; color: var(--color-black); }

  /* ----- Member check ----- */
  .xnk-membercheck { max-width: 460px; margin: 0 auto; }

  /* ----- Coach Intro (landing) ----- */
  .xnk-coach-intro { display: grid; grid-template-columns: 320px 1fr; gap: 2.5rem; align-items: center; max-width: 1000px; margin: 0 auto; }
  .xnk-coach-photo { width: 100%; aspect-ratio: 4/5; border-radius: var(--radius-2xl); background: var(--color-gray-200); object-fit: cover; }
  .xnk-coach-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
  @media (max-width: 768px) {
    .xnk-coach-intro { grid-template-columns: 1fr; gap: 1.5rem; }
    .xnk-coach-photo { max-width: 280px; }
  }

  /* ----- FAQ Accordion ----- */
  .xnk-faq-item { border: 1.5px solid var(--color-gray-200); border-radius: var(--radius-lg); margin-bottom: 0.75rem; overflow: hidden; background: var(--color-white); }
  .xnk-faq-q { display: flex; align-items: center; justify-content: space-between; gap: 1rem; width: 100%; text-align: left; padding: 1rem 1.1rem; font-size: var(--font-size-base); font-weight: 600; color: var(--color-black); background: none; border: none; cursor: pointer; }
  .xnk-faq-q .xnk-faq-icon { transition: transform var(--transition-base); flex-shrink: 0; }
  .xnk-faq-item.open .xnk-faq-q .xnk-faq-icon { transform: rotate(180deg); }
  .xnk-faq-a { max-height: 0; overflow: hidden; transition: max-height var(--transition-slow); }
  .xnk-faq-a-inner { padding: 0 1.1rem 1.1rem; font-size: var(--font-size-sm); color: var(--color-gray-600); line-height: 1.6; }

  /* ----- Package summary bar ----- */
  .xnk-package-bar { display: flex; align-items: center; gap: 0.6rem; background: var(--color-gray-50); border: 1.5px solid var(--color-gray-200); border-radius: var(--radius-lg); padding: 0.7rem 1rem; font-size: var(--font-size-sm); font-weight: 600; color: var(--color-gray-700); }

  /* ----- Sticky bottom action bar (booking) ----- */
