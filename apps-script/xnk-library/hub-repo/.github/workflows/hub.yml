name: Hub XNK

# Satu workflow untuk seluruh situs xnk.web.id:
#  - Run workflow → aksi "simpan" (tambah atau ubah coach: slug, nama usaha, link /exec, warna, logo, tempat + kota) atau "hapus" (slug saja).
#    Coach yang sudah ada: nama usaha dan link boleh kosong (tetap), jadi mengganti warna/logo cukup slug + isian itu.
#    Isian diperiksa penuh; bila ada yang salah, workflow berhenti dengan pesan Indonesia dan situs lama tetap tayang.
#  - Run workflow → aksi "ganti-slug": slug = nama sekarang, slug_baru = nama baru (T-2243). Alamat lama tetap mengarah
#    ke yang baru; klien dan coach tetap masuk. Lebih mudah lewat xnk.web.id/adminxnk → Ganti slug (sekalian XNK HQ).
#  - Run workflow → aksi "nonaktif" (coach keluar, T-2252): slug saja. xnk.web.id/<slug>/ (panel, portal, info) jadi halaman
#    "Situs coach ini tidak aktif lagi"; data coach tidak disentuh. "aktifkan" = kembali seperti semula. Lebih mudah lewat
#    xnk.web.id/adminxnk → Coach keluar… / Aktifkan lagi (sekalian XNK HQ: baca saja, backup akhir, pengingat hapus akun).
#  - Run workflow → aksi "bangun": bangun ulang tanpa mengubah daftar.
#  - Mengubah hub.json langsung di GitHub juga membangun ulang.
#  - Setiap hari jam 03:17 WIB: dibangun ulang. Halaman tiap coach mengikuti versi Library di spreadsheet coach itu
#    (tools/hub-versions.js); coach yang sudah diperbarui mendapat halaman terbaru.
# Halaman dibangun dari repo XNK yang publik (tanpa token), dari tag hub-stable (kode yang lulus pemeriksaan). Data klien tidak pernah ada di sini: hanya daftar coach.
on:
  workflow_dispatch:
    inputs:
      aksi:
        description: 'simpan = tambah/ubah coach · hapus = hapus coach · ganti-slug = ganti nama di alamat · nonaktif / aktifkan = coach keluar / kembali · bangun = bangun ulang saja'
        type: choice
        options: [bangun, simpan, hapus, ganti-slug, nonaktif, aktifkan]
        default: bangun
      slug:
        description: 'Nama di alamat (mis. claudia): huruf kecil, angka, tanda hubung, 3-30 karakter'
        required: false
      slug_baru:
        description: 'Nama baru di alamat, hanya untuk "ganti-slug" (alamat lama tetap mengarah ke sini)'
        required: false
      brand:
        description: 'Nama usaha (mis. Claudia Fit), hanya untuk "simpan"'
        required: false
      exec:
        description: 'Link /exec dari spreadsheet coach itu, hanya untuk "simpan" (coach lama: kosong = tetap)'
        required: false
      warna:
        description: 'Warna aksen coach, hanya untuk "simpan" (tetap = tidak diubah, hitam = tanpa warna)'
        type: choice
        options: [tetap, hitam, biru, hijau, toska, ungu, pink, oranye]
        default: tetap
      logo:
        description: 'Logo coach: jalur berkas di repo ini, mis. logo/claudia.png (PNG/JPEG/WebP, maks 200 KB; kosong = tetap, - = hapus)'
        required: false
      tempat:
        description: 'Tempat latihan coach, hanya untuk "simpan", mis. Gold''s Gym Kemang (kosong = tetap, - = hapus tempat)'
        required: false
      kota:
        description: 'Kota tempat latihan, hanya untuk "simpan", mis. Jakarta Selatan (kosong = tetap)'
        required: false
  push:
    branches: [main]
    paths: ['hub.json', 'logo/**', '.github/workflows/hub.yml']
  schedule:
    - cron: '17 20 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hub
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Hanya kode XNK yang sudah lulus pemeriksaan di main (tag hub-stable, dipindah workflow "XNK Library" di repo
      # XNK). Belum ada tag = main, dengan peringatan.
      - name: Pilih versi kode XNK
        id: xnk
        run: |
          if git ls-remote --exit-code --tags https://github.com/xnkzzxd/XNK.git refs/tags/hub-stable >/dev/null; then
            echo "ref=hub-stable" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Tag hub-stable belum ada di repo XNK; memakai main."
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Ambil kode XNK
        uses: actions/checkout@v4
        with:
          repository: xnkzzxd/XNK
          ref: ${{ steps.xnk.outputs.ref }}
          path: _xnk

      - name: Ubah daftar coach
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.aksi != 'bangun' }}
        env:
          IN_AKSI: ${{ inputs.aksi }}
          IN_SLUG: ${{ inputs.slug }}
          IN_BRAND: ${{ inputs.brand }}
          IN_EXEC: ${{ inputs.exec }}
          IN_WARNA: ${{ inputs.warna }}
          IN_LOGO: ${{ inputs.logo }}
          IN_SLUG_BARU: ${{ inputs.slug_baru }}
          IN_TEMPAT: ${{ inputs.tempat }}
          IN_KOTA: ${{ inputs.kota }}
        run: |
          if [ "$IN_AKSI" = "ganti-slug" ]; then
            node _xnk/apps-script/xnk-library/tools/hub-edit.js hub.json ganti-slug "$IN_SLUG" "$IN_SLUG_BARU"
          else
            node _xnk/apps-script/xnk-library/tools/hub-edit.js hub.json "$IN_AKSI" "$IN_SLUG" "$IN_BRAND" "$IN_EXEC" --warna "$IN_WARNA" --logo "$IN_LOGO" --tempat "$IN_TEMPAT" --kota "$IN_KOTA"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub.json
          git commit -m "Hub: $IN_AKSI $IN_SLUG${IN_SLUG_BARU:+ → $IN_SLUG_BARU}"
          git push

      # Halaman tiap coach dibangun dari commit XNK yang sama dengan Library di spreadsheet coach itu, supaya halaman
      # tidak memanggil fungsi yang belum ada di servernya. Coach yang tidak menjawab memakai commit build sebelumnya.
      - name: Versi server tiap coach
        run: node _xnk/apps-script/xnk-library/tools/hub-versions.js hub.json _xnk versions.json --previous https://xnk.web.id/_hub/versions.json

      - name: Bangun situs
        run: node _xnk/apps-script/xnk-library/tools/build-hub.js _site --config hub.json --versions versions.json

      # Gagal di sini = tidak ada yang diunggah; situs lama tetap tayang.
      - name: Periksa hasil build
        run: node _xnk/apps-script/xnk-library/tools/hub-verify.js _site --config hub.json

      - name: Siapkan GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Pages belum dinyalakan?
        if: ${{ steps.pages.outcome == 'failure' }}
        run: |
          echo "::error title=GitHub Pages belum dinyalakan::Buka Settings → Pages → Source, pilih 'GitHub Actions', lalu jalankan workflow ini lagi."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
