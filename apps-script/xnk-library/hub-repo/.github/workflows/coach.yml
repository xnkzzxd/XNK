name: Coach XNK

# Mengelola spreadsheet dan Apps Script setiap coach lewat clasp (Gelombang 2, T-2230…T-2232), tanpa membuka laptop:
#  - perbarui  (otomatis setiap hari 02:37 WIB, atau manual): pasang versi Library terbaru di penghubung coach dan
#              terbitkan ulang deployment yang SAMA (link /exec tidak berubah). slug kosong = semua coach, satu job per
#              coach berurutan; coach pertama di daftar adalah kenari: bila ia gagal, coach lain tidak dikerjakan.
#              Coach yang tidak aktif lagi ("inactive": true di hub.json, coach keluar) dilewati.
#  - baru      buat spreadsheet + Apps Script di akun Google coach, pasang penghubung, terbitkan web app, simpan ke
#              hub.json. Setelah itu pemilik membuka spreadsheet → menu XNK → Mulai setup (izin Google + PIN).
#  - hubungkan coach yang dibuat dulu dari XNK Template (mis. claudia): isi Script ID proyeknya (proyek yang menempel di
#              spreadsheet tidak terlihat oleh `clasp list`); dicocokkan dengan deployment link /exec, lalu
#              scriptId/deploymentId disimpan supaya bisa ikut "perbarui".
# Kredensial: secret CLASP_<SLUG> (huruf besar, "-" jadi "_") berisi .clasprc.json dari `clasp login` akun coach.
# Coach yang ganti slug (Hub XNK aksi ganti-slug) tetap memakai secret lamanya: nama secret dicatat di hub.json ("secret").
# Setiap job hanya menerima SATU secret (milik coach yang dikerjakan) lewat env CLASP_RC; tidak pernah semua secret.
# Akun itu harus menyalakan Google Apps Script API (script.google.com/home/usersettings). Lihat README repo ini.
on:
  workflow_dispatch:
    inputs:
      aksi:
        description: 'perbarui = pasang Library terbaru · baru = coach baru · hubungkan = coach lama (dari XNK Template)'
        type: choice
        options: [perbarui, baru, hubungkan]
        default: perbarui
      slug:
        description: 'Nama di alamat (mis. claudia). Untuk "perbarui": kosong = semua coach'
        required: false
      brand:
        description: 'Nama usaha, hanya untuk "baru"'
        required: false
      script_id:
        description: 'hubungkan: Script ID proyek coach (spreadsheet → Extensions → Apps Script → Project Settings)'
        required: false
      paksa:
        description: 'perbarui: kerjakan juga coach yang sudah terbaru'
        type: boolean
        default: false
  schedule:
    - cron: '37 19 * * *'

permissions:
  contents: read

concurrency:
  group: coach
  cancel-in-progress: false

jobs:
  # Daftar pekerjaan dari hub.json: satu baris per coach {slug, secret, kenari}. Tanpa secret apa pun.
  plan:
    runs-on: ubuntu-latest
    outputs:
      aksi: ${{ steps.p.outputs.aksi }}
      matrix: ${{ steps.p.outputs.matrix }}
      tag: ${{ steps.p.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Rencana
        id: p
        env:
          IN_AKSI: ${{ github.event_name == 'schedule' && 'perbarui' || inputs.aksi }}
          IN_SLUG: ${{ inputs.slug }}
        run: |
          tag=$(git ls-remote --tags https://github.com/xnkzzxd/XNK.git 'lib-v*' | grep -oE 'lib-v[0-9]+$' | sort -t v -k 2 -n | tail -1)
          if [ -z "$tag" ]; then echo "::error::Repo XNK belum punya tag lib-v<N> (workflow XNK Library belum menerbitkan versi bertag)."; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "aksi=$IN_AKSI" >> "$GITHUB_OUTPUT"
          node -e '
            const fs = require("fs");
            const aksi = process.env.IN_AKSI, one = (process.env.IN_SLUG || "").trim();
            const cfg = JSON.parse(fs.readFileSync("hub.json", "utf8"));
            const re = /^[a-z0-9](?:[a-z0-9-]{1,28})[a-z0-9]$/;
            if (one && !re.test(one)) { console.log("::error::Slug tidak valid: " + one); process.exit(1); }
            if (aksi !== "perbarui" && !one) { console.log("::error::Aksi " + aksi + " butuh slug."); process.exit(1); }
            // T-2243: slug lama (aliases) = coach yang sekarang; secret dari hub.json (dicatat saat slug diganti) atau CLASP_<SLUG>.
            const list = cfg.coaches || [];
            const hit = one ? list.find(c => c.slug === one || (c.aliases || []).includes(one)) : null;
            // T-2252: perbarui semua = tanpa coach yang tidak aktif (kenari = coach aktif pertama).
            const slugs = one ? [hit ? hit.slug : one] : list.filter(c => !(aksi === "perbarui" && c.inactive === true)).map(c => c.slug);
            const sec = s => { const c = list.find(x => x.slug === s); return c && c.secret ? c.secret : "CLASP_" + s.toUpperCase().replace(/-/g, "_"); };
            const rows = slugs.map((s, i) => ({ slug: s, secret: sec(s), kenari: !one && i === 0 && slugs.length > 1 }));
            const badSecret = rows.find(r => !/^CLASP_[A-Z0-9_]{3,40}$/.test(r.secret));
            if (badSecret) { console.log("::error::Nama secret tidak valid untuk " + badSecret.slug); process.exit(1); }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "matrix=" + JSON.stringify({ include: rows }) + "\n");
            console.log(rows.map(r => r.slug + " (" + r.secret + ")").join(", ") || "tidak ada coach");
          '

  coach:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
      max-parallel: 1        # berurutan: kenari dulu
      fail-fast: true        # kenari gagal = coach lain tidak dikerjakan
    steps:
      - uses: actions/checkout@v4

      # Kode penghubung dibangun dari commit yang sama dengan versi Library itu.
      - uses: actions/checkout@v4
        with:
          repository: xnkzzxd/XNK
          ref: ${{ needs.plan.outputs.tag }}
          path: _xnk

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g @google/clasp@2.4.2

      - name: Jalankan (${{ matrix.slug }})
        env:
          CLASP_RC: ${{ secrets[matrix.secret] }}     # hanya secret coach ini
          AKSI: ${{ needs.plan.outputs.aksi }}
          SLUG: ${{ matrix.slug }}
          IN_BRAND: ${{ inputs.brand }}
          SCRIPT_ID: ${{ inputs.script_id }}
          FLAGS: ${{ inputs.paksa && '--paksa' || '' }} ${{ matrix.kenari && '--kenari' || '' }}
        run: |
          set -e
          T=_xnk/apps-script/xnk-library/tools/coach-ops.js
          case "$AKSI" in
            perbarui)  node "$T" perbarui hub.json "$SLUG" $FLAGS --xnk _xnk ;;
            baru)      node "$T" baru hub.json "$SLUG" "$IN_BRAND" --xnk _xnk ;;
            hubungkan) node "$T" hubungkan hub.json "$SLUG" --xnk _xnk ;;
            *) echo "::error::Aksi tidak dikenal: $AKSI"; exit 1 ;;
          esac

      - name: Simpan hub.json
        run: |
          if git diff --quiet -- hub.json; then echo "hub.json tidak berubah."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub.json
          git commit -m "Coach: ${{ needs.plan.outputs.aksi }} ${{ matrix.slug }}"
          git pull --rebase --quiet origin main
          git push

  # Push dari workflow tidak memicu workflow lain; situs dibangun ulang supaya halaman mengikuti versi baru.
  rebuild:
    needs: [plan, coach]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Bangun ulang situs hub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hub.yml -f aksi=bangun -R "$GITHUB_REPOSITORY"
