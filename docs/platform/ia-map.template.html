<title>XNK Screen Map</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: XNK's monochrome identity. Black band on top, a pannable canvas below, details in a side panel (bottom sheet on phones). */
:root {
  --page: #FAFAF9; --ink: #141413; --ink-2: #5E5D59; --line: #D6D4CE; --card: #FFFFFF;
  --band: #0E0E0D; --on-band: #F5F5F2; --band-2: #26261F; --flag: #C4342B; --sel: #141413;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #121211; --ink: #EDECE8; --ink-2: #A3A19A; --line: #3A3934; --card: #1B1B19;
  --band: #000000; --on-band: #F5F5F2; --band-2: #2A2A26; --flag: #F0645A; --sel: #EDECE8; color-scheme: dark } }
:root[data-theme="dark"] {
  --page: #121211; --ink: #EDECE8; --ink-2: #A3A19A; --line: #3A3934; --card: #1B1B19;
  --band: #000000; --on-band: #F5F5F2; --band-2: #2A2A26; --flag: #F0645A; --sel: #EDECE8; color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font: 14px/1.45 var(--f-body) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band) }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px) }
header { background: var(--band); color: var(--on-band); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center }
h1 { margin: 0; font: 600 1.15rem/1.1 var(--f-display); letter-spacing: .01em; text-wrap: balance }
h1 small { display: block; font: 400 .72rem/1.3 var(--f-mono); color: #B9B8B2; letter-spacing: .04em; text-transform: uppercase; margin-top: 2px }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto }
.search { position: relative; flex: 1 1 180px; min-width: 0; max-width: 260px }
.search input { width: 100%; height: 36px; border-radius: 6px; border: 1px solid var(--band-2); background: var(--band-2); color: var(--on-band); padding: 0 10px; font: 16px var(--f-body) }
.search input::placeholder { color: #9C9B95 }
button { font: 500 .82rem var(--f-body); cursor: pointer }
.tb { height: 36px; min-width: 36px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--band-2); background: transparent; color: var(--on-band) }
.tb[aria-pressed="true"] { background: var(--on-band); color: var(--band) }
.roles { display: flex; gap: 4px; flex-wrap: wrap }
:focus-visible { outline: 2px solid var(--flag); outline-offset: 2px }
main { position: relative; flex: 1; min-height: 0; display: flex }
#stage { flex: 1; min-width: 0; position: relative; overflow: hidden; touch-action: none; cursor: grab; background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 22px 22px }
#stage.drag { cursor: grabbing }
svg { display: block; width: 100%; height: 100% }
.link { fill: none; stroke: var(--line); stroke-width: 1.4 }
.node { cursor: pointer; transition: transform .28s ease, opacity .2s }
.node rect.box { fill: var(--card); stroke: var(--ink-2); stroke-width: 1 }
.node.k-site rect.box, .node.k-view rect.box { fill: var(--band); stroke: var(--band) }
.node.k-site text.lbl, .node.k-view text.lbl { fill: var(--on-band) }
.node.k-section rect.box { fill: transparent; stroke-dasharray: 3 3; stroke: var(--line) }
.node.k-sheet rect.box, .node.k-overlay rect.box { rx: 12 }
.node text.lbl { fill: var(--ink); font: 500 13px var(--f-body); dominant-baseline: central }
.node.k-site text.lbl { font: 600 14px var(--f-display) }
.node text.kind { fill: var(--ink-2); font: 10px var(--f-mono); dominant-baseline: central; text-transform: uppercase; letter-spacing: .06em }
.node.k-site text.kind, .node.k-view text.kind { fill: #A9A8A2 }
.node .flagdot { fill: var(--flag) }
.node .knob circle { fill: var(--page); stroke: var(--ink-2) }
.node .knob text { fill: var(--ink); font: 600 12px var(--f-mono); dominant-baseline: central; text-anchor: middle }
.node.sel rect.box { stroke: var(--flag); stroke-width: 2.5 }
.node.hit rect.box { stroke: var(--flag); stroke-width: 2; stroke-dasharray: none }
.node.dim { opacity: .22 }
.zoom { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px }
.zoom button { width: 44px; height: 44px; font-family: var(--f-mono); border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 1.1rem }
.legend { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: .72rem/1.6 var(--f-mono); color: var(--ink-2); max-width: calc(100% - 90px) }
.legend b { color: var(--ink); font-weight: 500 }
.legend .r { color: var(--flag) }
#panel { width: 380px; max-width: 100%; border-left: 1px solid var(--line); background: var(--card); overflow-y: auto; padding-block: 18px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)) }
#panel[hidden] { display: none }
.crumb { font: .72rem/1.5 var(--f-mono); color: var(--ink-2); word-break: break-word }
#panel h2 { font: 600 1.3rem/1.15 var(--f-display); margin: 6px 0 8px; text-wrap: balance }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px }
.chip { font: .72rem var(--f-mono); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; color: var(--ink-2) }
.chip.flag { border-color: var(--flag); color: var(--flag) }
.note { color: var(--ink); margin: 0 0 14px; max-width: 65ch }
.eyebrow { font: 500 .7rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 16px 0 6px }
.rpc { border-top: 1px solid var(--line); padding: 8px 0 }
.rpc code { font: 500 .85rem var(--f-mono); word-break: break-all }
.rpc .auth { font: .68rem var(--f-mono); text-transform: uppercase; letter-spacing: .06em; margin-left: 6px; padding: 1px 6px; border-radius: 4px; background: var(--ink); color: var(--card) }
.rpc .part { font: .72rem var(--f-mono); color: var(--ink-2) }
.rpc .sh { font-size: .8rem; color: var(--ink-2); margin-top: 3px }
.prow { display: flex; gap: 8px; margin-top: 4px }
.pbtn { height: 40px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink) }
.close { float: right; width: 40px; height: 40px; border: 0; background: transparent; color: var(--ink); font-size: 1.3rem; margin: -8px -8px 0 0 }
@media (max-width: 760px) {
  header { gap: 8px }
  .tools { margin-left: 0; width: 100% }
  .search { max-width: none }
  #panel { position: absolute; left: 0; right: 0; bottom: 0; width: auto; max-height: 58%; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.18); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)) }
  .legend { display: none }
}
@media (prefers-reduced-motion: reduce) { .node { transition: none } }
</style>

<div id="app">
  <header>
    <h1>XNK Screen Map<small id="stats">Phase V · T-1401</small></h1>
    <div class="tools">
      <label class="search"><input id="q" type="search" placeholder="Search screen or RPC" autocomplete="off" aria-label="Search screen or RPC"></label>
      <div class="roles" role="group" aria-label="Show role">
        <button class="tb" type="button" data-role="C" aria-pressed="false" title="Coach">Coach</button>
        <button class="tb" type="button" data-role="K" aria-pressed="false" title="Client (logged in)">Klien</button>
        <button class="tb" type="button" data-role="G" aria-pressed="false" title="Portal guest">Tamu</button>
        <button class="tb" type="button" data-role="V" aria-pressed="false" title="Landing visitor">Landing</button>
      </div>
    </div>
  </header>
  <main>
    <div id="stage" aria-label="Screen map. Drag to pan, scroll or pinch to zoom.">
      <svg id="svg"><g id="vp"><g id="links"></g><g id="nodes"></g></g></svg>
      <div class="legend"><b>■</b> site / view · <b>▢</b> tab, detail · <b>◯</b> sheet · <b>┄</b> section<br><span class="r">●</span> flag: duplicated data, long screen or 4+ taps deep</div>
      <div class="zoom">
        <button type="button" id="zin" aria-label="Zoom in">+</button>
        <button type="button" id="zout" aria-label="Zoom out">−</button>
        <button type="button" id="fit" aria-label="Fit to screen" title="Fit to screen">⤢</button>
        <button type="button" id="expand" aria-label="Expand all" title="Expand all">⊞</button>
        <button type="button" id="collapse" aria-label="Collapse to views" title="Collapse to views">⊟</button>
        <button type="button" id="theme" aria-label="Switch light or dark" title="Light / dark">☾</button>
      </div>
    </div>
    <aside id="panel" hidden aria-live="polite"></aside>
  </main>
</div>

<script>
(function () {
  'use strict';
  var DATA = /*IA_DATA*/null;
  var KIND = { site: 'site', view: 'view', tab: 'tab', sub: 'sub-tab', detail: 'detail', sheet: 'sheet', overlay: 'overlay', menu: 'menu', section: 'section' };
  var DUPTXT = DATA.dup;
  var svg = document.getElementById('svg'), vp = document.getElementById('vp'), gN = document.getElementById('nodes'), gL = document.getElementById('links');
  var stage = document.getElementById('stage'), panel = document.getElementById('panel');
  var NS = 'http://www.w3.org/2000/svg';
  var ROW = 40, BOXH = 30, GAP = 56;
  var view = { x: 20, y: 20, k: 1 };
  var sel = null, roleOn = null, query = '';
  var all = [], byId = {};

  (function index(nd, parent) {
    nd.parent = parent; nd.open = nd.t < 1 || nd.k === 'site' && nd.t === 0; all.push(nd); byId[nd.id] = nd;
    (nd.c || []).forEach(function (c) { index(c, nd); });
  })(DATA.tree, null);
  // Open sites and their direct views at start.
  all.forEach(function (nd) { if (nd.k === 'site') nd.open = true; });

  var ctx = document.createElement('canvas').getContext('2d');
  function textW(s, font) { ctx.font = font; return ctx.measureText(s).width; }
  function boxW(nd) {
    if (nd._w) return nd._w;
    var lw = textW(nd.l, nd.k === 'site' ? '600 14px "IBM Plex Sans Condensed", sans-serif' : '500 13px "IBM Plex Sans", sans-serif');
    var kw = textW(KIND[nd.k], '10px "IBM Plex Mono", monospace') * 1.12;
    nd._w = Math.ceil(lw + kw + 34 + (nd.f ? 10 : 0));
    return nd._w;
  }
  var flagged = function (nd) { return !!(nd.f && nd.f.length); };

  function layout() {
    var vis = [], colW = [], leaf = 0;
    (function walk(nd, d) {
      nd.d = d; vis.push(nd);
      colW[d] = Math.max(colW[d] || 0, boxW(nd));
      var kids = nd.open ? (nd.c || []) : [];
      if (!kids.length) { nd.y = leaf++ * ROW; return; }
      kids.forEach(function (c) { walk(c, d + 1); });
      nd.y = (kids[0].y + kids[kids.length - 1].y) / 2;
    })(DATA.tree, 0);
    var xs = [0];
    for (var i = 1; i < colW.length; i++) xs[i] = xs[i - 1] + colW[i - 1] + GAP;
    vis.forEach(function (nd) { nd.x = xs[nd.d]; });
    return vis;
  }

  function el(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var a in attrs) e.setAttribute(a, attrs[a]); if (parent) parent.appendChild(e); return e; }

  function matches(nd) {
    if (!query) return false;
    var q = query.toLowerCase();
    return nd.l.toLowerCase().indexOf(q) !== -1 || (nd.p || []).some(function (r) { return r.toLowerCase().indexOf(q) !== -1; }) || (nd.n || '').toLowerCase().indexOf(q) !== -1;
  }

  var nodeEls = {};
  function render() {
    var vis = layout(), seen = {};
    gL.textContent = '';
    vis.forEach(function (nd) {
      if (nd.parent && nd.parent.open) {
        var p = nd.parent, x1 = p.x + boxW(p) + (p.c && p.c.length ? 12 : 0), y1 = p.y + BOXH / 2, x2 = nd.x, y2 = nd.y + BOXH / 2, mx = (x1 + x2) / 2;
        el('path', { 'class': 'link', d: 'M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2 }, gL);
      }
      seen[nd.id] = 1;
      var g = nodeEls[nd.id];
      if (!g) g = nodeEls[nd.id] = makeNode(nd);
      g.style.transform = 'translate(' + nd.x + 'px,' + nd.y + 'px)';
      g.classList.toggle('sel', sel === nd);
      g.classList.toggle('hit', matches(nd));
      g.classList.toggle('dim', !!roleOn && nd.r.indexOf(roleOn) === -1);
      var kb = g.querySelector('.knob text'); if (kb) kb.textContent = nd.open ? '−' : '+';
    });
    Object.keys(nodeEls).forEach(function (id) { if (!seen[id]) { nodeEls[id].remove(); delete nodeEls[id]; } });
  }

  function makeNode(nd) {
    var g = el('g', { 'class': 'node k-' + nd.k, tabindex: '0', role: 'button', 'aria-label': nd.l + ' (' + KIND[nd.k] + ')' }, gN);
    var w = boxW(nd);
    el('rect', { 'class': 'box', width: w, height: BOXH, rx: (nd.k === 'sheet' || nd.k === 'overlay') ? 14 : 4 }, g);
    var t = el('text', { 'class': 'lbl', x: 12, y: BOXH / 2 }, g); t.textContent = nd.l;
    var kw = textW(KIND[nd.k], '10px "IBM Plex Mono", monospace') * 1.12;
    var kt = el('text', { 'class': 'kind', x: w - kw - 10 - (flagged(nd) ? 10 : 0), y: BOXH / 2 }, g); kt.textContent = KIND[nd.k];
    if (flagged(nd)) el('circle', { 'class': 'flagdot', cx: w - 9, cy: BOXH / 2, r: 3.5 }, g);
    if (nd.c && nd.c.length) {
      var kn = el('g', { 'class': 'knob', transform: 'translate(' + (w + 12) + ',' + BOXH / 2 + ')' }, g);
      el('circle', { r: 9 }, kn); el('text', {}, kn);
      el('rect', { x: -16, y: -16, width: 32, height: 32, fill: 'transparent' }, kn);
      kn.addEventListener('click', function (e) { e.stopPropagation(); toggle(nd); });
    }
    g.addEventListener('click', function () { select(nd); });
    g.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); select(nd); }
      else if (e.key === ' ') { e.preventDefault(); toggle(nd); }
    });
    return g;
  }

  function toggle(nd) { if (!nd.c || !nd.c.length) return; nd.open = !nd.open; render(); }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pathOf(nd) { var a = []; for (var p = nd.parent; p && p.parent; p = p.parent) a.unshift(p.l); return a; }

  function select(nd) {
    sel = nd; render();
    var roles = nd.r.split('').map(function (r) { return '<span class="chip">' + esc(DATA.role[r]) + '</span>'; }).join('');
    var flags = (nd.f || []).map(function (f) {
      var t = f === 'long' ? 'Long screen' : f === 'deep' ? nd.t + ' taps deep' : f.indexOf('dup:') === 0 ? 'Also shown elsewhere: ' + (DUPTXT[f.slice(4)] || f.slice(4)) : f;
      return '<span class="chip flag">' + esc(t) + '</span>';
    }).join('');
    var rpcs = (nd.p || []).map(function (r) {
      var base = r.split(/[ .]/)[0], part = r.slice(base.length).replace(/^\./, ''), i = DATA.rpc[base] || { auth: '?', sheets: [] };
      return '<div class="rpc"><code>' + esc(base) + '</code><span class="auth">' + esc(i.auth) + '</span>' + (part ? ' <span class="part">part ' + esc(part) + '</span>' : '') +
        '<div class="sh">' + (i.sheets.length ? esc(i.sheets.join(' · ')) : 'No sheet') + '</div></div>';
    }).join('');
    var kids = nd.c && nd.c.length;
    panel.innerHTML = '<button class="close" type="button" id="pclose" aria-label="Close details">×</button>' +
      '<div class="crumb">' + esc(pathOf(nd).join(' › ') || 'Root') + '</div><h2>' + esc(nd.l) + '</h2>' +
      '<div class="chips"><span class="chip">' + esc(KIND[nd.k]) + '</span>' + roles + flags + '</div>' +
      (nd.n ? '<p class="note">' + esc(nd.n) + '</p>' : '') +
      (kids ? '<div class="prow"><button class="pbtn" type="button" id="ptog">' + (nd.open ? 'Hide ' : 'Show ') + nd.c.length + ' inside</button></div>' : '') +
      '<div class="eyebrow">Server calls (' + (nd.p ? nd.p.length : 0) + ')</div>' + (rpcs || '<p class="note">None. This screen renders data it already has.</p>');
    panel.hidden = false;
    document.getElementById('pclose').onclick = function () { panel.hidden = true; sel = null; render(); };
    var pt = document.getElementById('ptog'); if (pt) pt.onclick = function () { toggle(nd); select(nd); };
  }

  // ── Pan & zoom ──
  function apply() { vp.setAttribute('transform', 'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')'); }
  function zoomAt(f, cx, cy) {
    var k = Math.min(2.5, Math.max(0.15, view.k * f)); f = k / view.k;
    view.x = cx - (cx - view.x) * f; view.y = cy - (cy - view.y) * f; view.k = k; apply();
  }
  function fit() {
    var vis = layout(), r = stage.getBoundingClientRect();
    var minY = Infinity, maxY = -Infinity, maxX = 0;
    vis.forEach(function (n) { minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y + BOXH); maxX = Math.max(maxX, n.x + boxW(n) + 30); });
    var k = Math.min(1.1, (r.width - 40) / maxX, (r.height - 40) / (maxY - minY));
    view.k = Math.max(0.15, k); view.x = 20; view.y = (r.height - (maxY - minY) * view.k) / 2 - minY * view.k; apply();
  }
  stage.addEventListener('wheel', function (e) {
    e.preventDefault(); var r = stage.getBoundingClientRect();
    if (e.ctrlKey || Math.abs(e.deltaY) > Math.abs(e.deltaX) && !e.shiftKey) zoomAt(Math.exp(-e.deltaY * 0.0022), e.clientX - r.left, e.clientY - r.top);
    else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
  }, { passive: false });
  var ptrs = {}, last = null, pinch = null, moved = 0;
  stage.addEventListener('pointerdown', function (e) {
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY }; moved = 0;
    if (Object.keys(ptrs).length === 2) { var p = Object.values(ptrs); pinch = { d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) }; }
    last = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('pointermove', function (e) {
    if (!ptrs[e.pointerId]) return;
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var p = Object.values(ptrs), r = stage.getBoundingClientRect();
    if (p.length === 2 && pinch) {
      var d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      zoomAt(d / pinch.d, (p[0].x + p[1].x) / 2 - r.left, (p[0].y + p[1].y) / 2 - r.top); pinch.d = d; moved = 99; return;
    }
    var dx = e.clientX - last.x, dy = e.clientY - last.y; moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 4) { stage.classList.add('drag'); if (!stage.hasPointerCapture(e.pointerId)) try { stage.setPointerCapture(e.pointerId); } catch (_) {} view.x += dx; view.y += dy; apply(); }
    last = { x: e.clientX, y: e.clientY };
  });
  function up(e) { delete ptrs[e.pointerId]; if (Object.keys(ptrs).length < 2) pinch = null; stage.classList.remove('drag'); }
  window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  // A drag must not count as a click on a node.
  stage.addEventListener('click', function (e) { if (moved > 4) { e.stopPropagation(); e.preventDefault(); } }, true);
  document.getElementById('zin').onclick = function () { var r = stage.getBoundingClientRect(); zoomAt(1.25, r.width / 2, r.height / 2); };
  document.getElementById('zout').onclick = function () { var r = stage.getBoundingClientRect(); zoomAt(0.8, r.width / 2, r.height / 2); };
  document.getElementById('fit').onclick = fit;

  // ── Toolbar ──
  document.getElementById('expand').onclick = function () { all.forEach(function (n) { n.open = true; }); render(); fit(); };
  document.getElementById('collapse').onclick = function () { all.forEach(function (n) { n.open = n.k === 'site'; }); render(); fit(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-role]'), function (b) {
    b.onclick = function () {
      roleOn = roleOn === b.dataset.role ? null : b.dataset.role;
      Array.prototype.forEach.call(document.querySelectorAll('[data-role]'), function (x) { x.setAttribute('aria-pressed', String(x.dataset.role === roleOn)); });
      render();
    };
  });
  var qt;
  document.getElementById('q').addEventListener('input', function (e) {
    clearTimeout(qt);
    qt = setTimeout(function () {
      query = e.target.value.trim();
      if (query) all.forEach(function (n) { if (matches(n)) for (var p = n.parent; p; p = p.parent) p.open = true; });
      render();
