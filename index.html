<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XNK Personal Training</title>
    <!-- Internal tool for the PTs: keep it out of search engines -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#111111">

    <!-- Icons and home-screen install -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <!-- Start the connection to Apps Script early -->
    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="XNK">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <script>
        // Always HTTPS: the app sends the PT login PIN.
        if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
            location.replace('https://' + location.host + location.pathname + location.search);
        }
    </script>
    <style>
        :root {
            --brand: #0b0b0b;
        }
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--brand);
        }
        iframe {
            display: block;
            width: 100%;
            height: 100vh;
            height: 100dvh; /* follows the mobile browser toolbar */
            border: 0;
            background: #fff;
        }
        /* Full-screen black panels: loading screen, no-JS note */
        .screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            padding: 24px;
            box-sizing: border-box;
            background: var(--brand);
            color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            transition: opacity .5s ease, visibility .5s ease;
        }
        .screen[hidden] {
            display: none;
        }
        .screen.done {
            opacity: 0;
            visibility: hidden;
        }
        .screen img {
            width: 64px;
            height: 61px;
            animation: breathe 1.8s cubic-bezier(.2, .8, .2, 1) infinite;
        }
        .screen p {
            margin: 0;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #a7a7a4;
        }
        .screen a {
            color: #fff;
            font-size: 15px;
        }
        .screen a[hidden] {
            display: none;
        }

        /* Loading screen: same look as the app's own start screen, so the
           hand-over to it is seamless */
        .bar {
            width: 120px;
            height: 3px;
            border-radius: 3px;
            background: rgba(255, 255, 255, .16);
            overflow: hidden;
        }
        .bar::after {
            content: '';
            display: block;
            width: 40%;
            height: 100%;
            border-radius: 3px;
            background: #fff;
            animation: sweep 1.1s cubic-bezier(.2, .8, .2, 1) infinite;
        }
        @keyframes sweep {
            from { transform: translateX(-100%); }
            to { transform: translateX(260%); }
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(.94); opacity: .85; }
        }
        @media (prefers-reduced-motion: reduce) {
            .screen img, .bar::after { animation-duration: 2.4s; }
        }
    </style>
</head>
<body>

    <iframe id="app" title="XNK – panel PT" src="https://script.google.com/macros/s/AKfycbyVOm1Csc7UmCxPe3buHUkZkIaskguIRgT8dvTJw_aaTAX5UYY_-irjDi1X6vOD1BgJ/exec"></iframe>

    <div class="screen" id="loader" role="status" aria-live="polite">
        <img src="/logo.png" alt="XNK">
        <div class="bar" aria-hidden="true"></div>
        <p>XNK Personal Training</p>
        <a id="fallback" target="_blank" rel="noopener" hidden>Tidak muncul? Buka di tab baru</a>
    </div>

    <noscript>
        <div class="screen">
            <img src="/icon-192.png" alt="XNK">
            <p>Aktifkan JavaScript untuk membuka aplikasi ini.</p>
        </div>
    </noscript>

    <script>
        (function () {
            // Login (PIN admin) happens inside the app, checked by the server.
            // Forget the old page-level PIN (only a hash was stored).
            try { localStorage.removeItem('xnk-pin'); } catch (e) {}
            var app = document.getElementById('app');
            var loader = document.getElementById('loader');
            var fallback = document.getElementById('fallback');
            fallback.href = app.src;
            app.addEventListener('load', function () {
                loader.classList.add('done');
            });
            setTimeout(function () {
                fallback.hidden = false;
            }, 8000);
        })();
    </script>

</body>
</html>
