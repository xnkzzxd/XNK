<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XNK</title>
    <!-- Internal tool for the PTs: keep it out of search engines -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#111111">

    <!-- Icons and home-screen install -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="XNK">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <script>
        // Always HTTPS: the app sends the PT login PIN.
        if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
            location.replace('https://' + location.host + location.pathname + location.search);
        }
    </script>
    <style>
        :root {
            --brand: #111111;
        }
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--brand);
        }
        iframe {
            display: block;
            width: 100%;
            height: 100vh;
            height: 100dvh; /* follows the mobile browser toolbar */
            border: 0;
            background: #fff;
        }
        /* Full-screen black panels: loading screen, no-JS note */
        .screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px;
            box-sizing: border-box;
            background: var(--brand);
            color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            transition: opacity .4s ease, visibility .4s ease;
        }
        .screen[hidden] {
            display: none;
        }
        .screen.done {
            opacity: 0;
            visibility: hidden;
        }
        .screen img {
            width: 96px;
            height: 96px;
        }
        .screen p {
            margin: 0;
            font-size: 15px;
            color: rgba(255, 255, 255, .75);
        }
        .screen a {
            color: #fff;
            font-size: 15px;
        }
        .screen a[hidden] {
            display: none;
        }

        /* Loading screen */
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, .2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .spinner { animation-duration: 2.4s; }
        }
    </style>
</head>
<body>

    <iframe id="app" title="XNK – panel PT" src="https://script.google.com/macros/s/AKfycbyVOm1Csc7UmCxPe3buHUkZkIaskguIRgT8dvTJw_aaTAX5UYY_-irjDi1X6vOD1BgJ/exec"></iframe>

    <div class="screen" id="loader" role="status" aria-live="polite">
        <img src="/icon-192.png" alt="XNK">
        <div class="spinner" aria-hidden="true"></div>
        <p>Memuat…</p>
        <a id="fallback" target="_blank" rel="noopener" hidden>Tidak muncul? Buka di tab baru</a>
    </div>

    <noscript>
        <div class="screen">
            <img src="/icon-192.png" alt="XNK">
            <p>Aktifkan JavaScript untuk membuka aplikasi ini.</p>
        </div>
    </noscript>

    <script>
        (function () {
            // Login (PIN admin) happens inside the app, checked by the server.
            // Forget the old page-level PIN (only a hash was stored).
            try { localStorage.removeItem('xnk-pin'); } catch (e) {}
            var app = document.getElementById('app');
            var loader = document.getElementById('loader');
            var fallback = document.getElementById('fallback');
            fallback.href = app.src;
            app.addEventListener('load', function () {
                loader.classList.add('done');
            });
            setTimeout(function () {
                fallback.hidden = false;
            }, 8000);
        })();
    </script>

</body>
</html>
