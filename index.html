<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XNK</title>
    <!-- Internal tool for the PTs: keep it out of search engines -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#111111">

    <!-- Icons and home-screen install -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="XNK">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <script>
        // The PIN check uses crypto.subtle, which only works over HTTPS.
        if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
            location.replace('https://' + location.host + location.pathname + location.search);
        }
    </script>
    <style>
        :root {
            --brand: #111111;
        }
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--brand);
        }
        iframe {
            display: block;
            width: 100%;
            height: 100vh;
            height: 100dvh; /* follows the mobile browser toolbar */
            border: 0;
            background: #fff;
        }
        iframe:not([src]) {
            visibility: hidden;
        }

        /* Full-screen black panels: PIN gate, loading screen, no-JS note */
        .screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px;
            box-sizing: border-box;
            background: var(--brand);
            color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            transition: opacity .4s ease, visibility .4s ease;
        }
        .screen[hidden] {
            display: none;
        }
        .screen.done {
            opacity: 0;
            visibility: hidden;
        }
        .screen img {
            width: 96px;
            height: 96px;
        }
        .screen p {
            margin: 0;
            font-size: 15px;
            color: rgba(255, 255, 255, .75);
        }
        .screen a {
            color: #fff;
            font-size: 15px;
        }
        .screen a[hidden] {
            display: none;
        }

        /* PIN gate */
        .gate label {
            font-size: 17px;
            font-weight: 600;
        }
        .gate input {
            width: 200px;
            padding: 12px 16px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, .3);
            border-radius: 10px;
            background: rgba(255, 255, 255, .06);
            color: #fff;
            font-size: 24px;
            letter-spacing: .4em;
            text-align: center;
            outline: none;
        }
        .gate input:focus {
            border-color: #fff;
        }
        .gate button {
            width: 200px;
            padding: 12px 16px;
            border: 0;
            border-radius: 10px;
            background: #fff;
            color: var(--brand);
            font: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .gate input:disabled,
        .gate button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }
        .gate .msg {
            min-height: 1.4em;
            color: #ff8a80;
        }

        /* Loading screen */
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, .2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .spinner { animation-duration: 2.4s; }
        }
    </style>
</head>
<body>

    <iframe id="app" title="XNK – formulir pemesanan" data-src="https://script.google.com/macros/s/AKfycbyVOm1Csc7UmCxPe3buHUkZkIaskguIRgT8dvTJw_aaTAX5UYY_-irjDi1X6vOD1BgJ/exec"></iframe>

    <form class="screen gate" id="gate" novalidate hidden>
        <img src="/icon-192.png" alt="XNK">
        <label for="pin">Masukkan PIN</label>
        <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
        <button type="submit" id="enter">Masuk</button>
        <p class="msg" id="msg" role="alert"></p>
    </form>

    <div class="screen" id="loader" role="status" aria-live="polite" hidden>
        <img src="/icon-192.png" alt="XNK">
        <div class="spinner" aria-hidden="true"></div>
        <p>Memuat…</p>
        <a id="fallback" target="_blank" rel="noopener" hidden>Tidak muncul? Buka di tab baru</a>
    </div>

    <noscript>
        <div class="screen">
            <img src="/icon-192.png" alt="XNK">
            <p>Aktifkan JavaScript untuk membuka aplikasi ini.</p>
        </div>
    </noscript>

    <script>
        (function () {
            // SHA-256 of SALT + PIN. README.md explains how to change the PIN.
            var PIN_HASH = '7e6cc7140812b9a6f6eeea606a78f45ef8f09f30f2ccfe8bd2bd7058cebbb88d';
            var SALT = 'xnk-pt:';
            var STORAGE_KEY = 'xnk-pin';
            var MAX_TRIES = 5;
            var LOCK_SECONDS = 30;

            var app = document.getElementById('app');
            var gate = document.getElementById('gate');
            var input = document.getElementById('pin');
            var enter = document.getElementById('enter');
            var msg = document.getElementById('msg');
            var loader = document.getElementById('loader');
            var fallback = document.getElementById('fallback');
            var tries = 0;

            // A phone that entered the current PIN before skips the gate.
            // Changing PIN_HASH makes every phone ask again.
            function remembered() {
                try { return localStorage.getItem(STORAGE_KEY) === PIN_HASH; } catch (e) { return false; }
            }
            function remember() {
                try { localStorage.setItem(STORAGE_KEY, PIN_HASH); } catch (e) {}
            }

            function sha256(text) {
                return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
                    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
                        return ('0' + b.toString(16)).slice(-2);
                    }).join('');
                });
            }

            function start() {
                gate.hidden = true;
                loader.hidden = false;
                fallback.href = app.dataset.src;
                app.addEventListener('load', function () {
                    // Ignore the empty frame's own load; a cross-origin page throws here.
                    try { if (app.contentWindow.location.href === 'about:blank') return; } catch (e) {}
                    loader.classList.add('done');
                });
                app.src = app.dataset.src;
                setTimeout(function () {
                    fallback.hidden = false;
                }, 8000);
            }

            function lock() {
                var left = LOCK_SECONDS;
                input.disabled = enter.disabled = true;
                (function tick() {
                    if (left <= 0) {
                        input.disabled = enter.disabled = false;
                        tries = 0;
                        msg.textContent = '';
                        input.focus();
                        return;
                    }
                    msg.textContent = 'Coba lagi dalam ' + left + ' detik';
                    left--;
                    setTimeout(tick, 1000);
                })();
            }

            gate.addEventListener('submit', function (e) {
                e.preventDefault();
                var pin = input.value.trim();
                if (!pin || input.disabled) return;
                if (!window.crypto || !crypto.subtle) {
                    msg.textContent = 'Buka lewat https://xnk.my.id';
                    return;
                }
                sha256(SALT + pin).then(function (hash) {
                    if (hash === PIN_HASH) {
                        remember();
                        start();
                        return;
                    }
                    tries++;
                    input.value = '';
                    if (tries >= MAX_TRIES) {
                        lock();
                    } else {
                        msg.textContent = 'PIN salah';
                        input.focus();
                    }
                });
            });

            if (remembered()) {
                start();
            } else {
                gate.hidden = false;
                input.focus();
            }
        })();
    </script>

</body>
</html>
