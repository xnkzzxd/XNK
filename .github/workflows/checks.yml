name: Checks

# Every pull request, whatever it touches (docs too): every check from docs/Agent.md §5.
# Three jobs run side by side (the two browser-check runs take ~10 minutes each and used to run one
# after the other, which brought the single job close to its 40-minute limit):
#   fast            syntax, node tests, site build, share/demo/offline checks
#   browser-static  browser-check against the static build (fetch + the real doPost)
#   browser-gas     browser-check against the Apps Script templates (google.script.run fallback)
# The job named `checks` only collects their results, so branch protection can keep requiring the
# single name `checks` (see docs/platform/CI.md).
# Deploying stays in pt-scheduler.yml (push to main, apps-script/** only) and pages.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  fast:
    name: fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check (.gs + HTML <script> + appsscript.json)
        run: node apps-script/pt-scheduler/tools/check-syntax.js
      - name: Tests
        run: node --test apps-script/pt-scheduler/tests/*.test.js

      - uses: ./.github/actions/setup-playwright
        with:
          version: ${{ env.PLAYWRIGHT_VERSION }}

      - name: "Site build (build-site.js: today's files and the static app under /next/)"
        run: node apps-script/pt-scheduler/tools/build-site.js
      - name: Share card check
        run: node apps-script/pt-scheduler/tools/share-check.js
      - name: Demo check (opens signed in, leaves the real app's device state alone)
        run: node apps-script/pt-scheduler/tools/demo-check.js
      - name: Host check (the static page answers its own host messages, service worker, offline open)
        run: node apps-script/pt-scheduler/tools/host-check.js
      - name: Site check (/ is the static panel, /legacy/ the old wrapper, workers do not clash; rollback build)
        run: node apps-script/pt-scheduler/tools/site-check.js

      # The client wrapper lives in xnkzzxd/BookingPT-Client (public). If it can't be fetched,
      # the offline check still runs on the coach wrapper and says the client part was skipped.
      # A change to the shared offline files lands in both repos on the same branch name (see
      # sync-offline.js), so compare against that branch when it exists, otherwise against main.
      - name: Pick BookingPT-Client branch
        id: cref
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ref=main
          if [ -n "$HEAD_REF" ] && git ls-remote --exit-code --heads https://github.com/xnkzzxd/BookingPT-Client "refs/heads/$HEAD_REF" >/dev/null 2>&1; then ref="$HEAD_REF"; fi
          echo "BookingPT-Client ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Check out BookingPT-Client
        id: client
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: xnkzzxd/BookingPT-Client
          ref: ${{ steps.cref.outputs.ref }}
          path: _BookingPT-Client
          persist-credentials: false
      - name: Offline copies match BookingPT-Client
        if: steps.client.outcome == 'success'
        run: node apps-script/pt-scheduler/tools/sync-offline.js _BookingPT-Client --check
      - name: Offline check
        run: |
          if [ "${{ steps.client.outcome }}" = "success" ]; then
            node apps-script/pt-scheduler/tools/offline-check.js _BookingPT-Client
          else
            echo "::warning title=BookingPT-Client tidak terjangkau::Repo xnkzzxd/BookingPT-Client tidak bisa diambil; sync-offline --check dan bagian klien offline-check dilewati. Hanya pembungkus coach yang diperiksa."
            node apps-script/pt-scheduler/tools/offline-check.js
          fi

  browser-static:
    name: browser check (static build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: ./.github/actions/setup-playwright
        with:
          version: ${{ env.PLAYWRIGHT_VERSION }}
      - name: Browser check against the static build (phone pass included; fetch + the real doPost)
        run: PAGES=static node apps-script/pt-scheduler/tools/browser-check.js

  browser-gas:
    name: browser check (Apps Script fallback)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: ./.github/actions/setup-playwright
        with:
          version: ${{ env.PLAYWRIGHT_VERSION }}
      - name: "Browser check, Apps Script fallback (templates from src, google.script.run)"
        run: RPC_MODE=gas node apps-script/pt-scheduler/tools/browser-check.js

  # The one required check: green only when all three jobs above passed (a skipped, failed or
  # cancelled job counts as red).
  checks:
    name: checks
    needs: [fast, browser-static, browser-gas]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job must have passed
        run: |
          echo "fast: ${{ needs.fast.result }}"
          echo "browser-static: ${{ needs.browser-static.result }}"
          echo "browser-gas: ${{ needs.browser-gas.result }}"
          test "${{ needs.fast.result }}" = "success" && test "${{ needs.browser-static.result }}" = "success" && test "${{ needs.browser-gas.result }}" = "success"
