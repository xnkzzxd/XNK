name: PT Scheduler

# check  — every PR and push: syntax check + tests.
# deploy — push to main only: clasp push to the Apps Script project, then
#          point the existing web app deployment at the new version, so the
#          /exec URL (and xnk.my.id) never changes.
on:
  pull_request:
    paths:
      - 'apps-script/pt-scheduler/**'
      - '.github/workflows/pt-scheduler.yml'
  push:
    branches: [main]
    paths:
      - 'apps-script/pt-scheduler/**'
      - '.github/workflows/pt-scheduler.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check (.gs + HTML <script> + appsscript.json)
        run: node apps-script/pt-scheduler/tools/check-syntax.js
      - name: Tests
        run: node --test apps-script/pt-scheduler/tests/*.test.js

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-pt-scheduler
      cancel-in-progress: false
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      # The deployment behind xnk.my.id (public: it is in the /exec URL). A repo
      # variable with the same name overrides it.
      PT_DEPLOYMENT_ID: ${{ vars.PT_DEPLOYMENT_ID || 'AKfycbyVOm1Csc7UmCxPe3buHUkZkIaskguIRgT8dvTJw_aaTAX5UYY_-irjDi1X6vOD1BgJ' }}
    steps:
      - name: Check deploy settings
        id: cfg
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$PT_DEPLOYMENT_ID" ]; then
            echo "::notice title=Deploy dilewati::Secret CLASPRC_JSON belum diatur. Lihat apps-script/README.md bagian 'Setup sekali'."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Install clasp
        if: steps.cfg.outputs.ready == 'true'
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials
        if: steps.cfg.outputs.ready == 'true'
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Push code to Apps Script
        if: steps.cfg.outputs.ready == 'true'
        working-directory: apps-script/pt-scheduler
        run: clasp push --force

      - name: Deploy new version to the existing web app deployment
        if: steps.cfg.outputs.ready == 'true'
        working-directory: apps-script/pt-scheduler
        run: clasp deploy --deploymentId "$PT_DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"

      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json"
