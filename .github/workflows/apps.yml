name: apps

# Aplikasi XNK untuk diunduh dari landing xnk.web.id (bagian "Aplikasi"):
#   XNK-Android.apk  — android/ dengan -PxnkHub (membuka https://xnk.web.id/)
#   XNK-Windows.msi  — Pake (Tauri) di sekitar https://xnk.web.id/
#   XNK-macOS.dmg    — sama, untuk Mac Apple silicon
# Push ke main (bila berkas di bawah berubah) atau Run workflow → dibangun lalu diunggah ke GitHub Release tetap
# "app-latest", jadi link di landing (…/releases/download/app-latest/<berkas>) tidak pernah berubah.
# PR hanya membangun (artefak), tanpa mengunggah.
# Tanda tangan Android: secret ANDROID_KEYSTORE_B64 (PKCS12, alias "xnk", base64) + ANDROID_KEYSTORE_PASSWORD.
# Tanpa secret itu yang diunggah APK debug (bisa dipasang, tetapi pembaruan berikutnya harus copot-pasang).
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apps.yml', 'apps-script/xnk-library/hub-site/desktop.ico', 'apps-script/xnk-library/hub-site/img/icon-512.png']
  pull_request:
    paths: ['android/**', '.github/workflows/apps.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_URL: https://xnk.web.id/

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bangun APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          XNK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          XNK_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/xnk.p12"
            export XNK_KEYSTORE="$RUNNER_TEMP/xnk.p12"
            gradle assembleRelease -PxnkHub --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../XNK-Android.apk
          else
            echo "::warning title=APK debug::Secret ANDROID_KEYSTORE_B64 belum ada; yang dibangun APK debug."
            gradle assembleDebug -PxnkHub --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../XNK-Android.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: XNK-Android.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            out: XNK-Windows.msi
          - os: macos-14
            out: XNK-macOS.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ikon macOS (.icns)
        if: runner.os == 'macOS'
        run: |
          mkdir -p xnk.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s apps-script/xnk-library/hub-site/img/icon-512.png --out xnk.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); [ $d -le 512 ] && sips -z $d $d apps-script/xnk-library/hub-site/img/icon-512.png --out xnk.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns xnk.iconset -o xnk.icns
      - name: Bangun aplikasi desktop (Pake)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ICON=apps-script/xnk-library/hub-site/desktop.ico; else ICON=xnk.icns; fi
          npx -y pake-cli@3.17.2 "$APP_URL" --name XNK --icon "$ICON" --width 1280 --height 840
          f=$(ls XNK*.msi XNK*.dmg 2>/dev/null | head -1)
          [ -n "$f" ] || { echo "::error::Pake tidak menghasilkan berkas"; ls -la; exit 1; }
          mv "$f" "${{ matrix.out }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: ${{ matrix.out }}

  release:
    needs: [android, desktop]
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Unggah ke release app-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --title "Aplikasi XNK" \
            --notes "Aplikasi XNK untuk Android, Windows, dan macOS. Membuka https://xnk.web.id/. Diperbarui otomatis oleh workflow apps."
          gh release upload app-latest out/* --clobber
