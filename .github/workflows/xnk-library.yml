name: XNK Library

# XNK Library + XNK Template (Phase AB, docs/library/). Produksi (pt-scheduler.yml, xnk.my.id) tidak disentuh.
#
# check  — setiap PR dan push: tes Library, kode penghubung, dan seluruh tes produksi pada kode Library.
# create — manual sekali (Run workflow → aksi "buat"): membuat dua spreadsheet di Drive pemilik lewat clasp
#          (akun di secret CLASPRC_JSON yang sudah ada): "XNK Library" (script = kode Library) dan
#          "XNK Template" (script = kode penghubung). Mencetak dua scriptId; simpan sebagai repo variable
#          XNK_LIB_SCRIPT_ID dan XNK_TEMPLATE_SCRIPT_ID.
# pusat  — XNK Pusat (apps-script/xnk-pusat, akun pemilik): "buat-pusat" sekali (manual) membuat proyeknya dan
#          menerbitkan web app; setiap push ke main memperbarui kodenya di deployment yang sama bila repo variable
#          XNK_PUSAT_SCRIPT_ID dan XNK_PUSAT_DEPLOYMENT_ID terisi (T-2233).
# stable — push ke main setelah check hijau: tag bergerak "hub-stable" dipindah ke commit ini. Hub xnk.web.id
#          (repo xnk-template-site) hanya membangun dari tag ini, jadi commit main yang rusak tidak pernah tayang
#          di halaman coach (T-2221).
# deploy — push ke main (atau manual, aksi "perbarui") setelah dua variable ada: bangun Library dari kode produksi
#          terbaru → clasp push → versi baru → kode penghubung XNK Template disematkan ke versi itu → clasp push.
#          Salinan coach yang sudah ada diperbarui oleh workflow "Coach XNK" di repo hub (tag lib-v<N>, T-2232).
on:
  pull_request:
    paths:
      - 'apps-script/pt-scheduler/src/**'
      - 'apps-script/pt-scheduler/tests/api-lists.js'
      - 'apps-script/pt-scheduler/tools/build-static.js'
      - 'apps-script/xnk-library/**'
      - 'apps-script/xnk-pusat/**'
      - '.github/workflows/xnk-library.yml'
  push:
    branches: [main]
    paths:
      - 'apps-script/pt-scheduler/src/**'
      - 'apps-script/pt-scheduler/tests/api-lists.js'
      - 'apps-script/pt-scheduler/tools/build-static.js'
      - 'apps-script/pt-scheduler/tools/sw-app.template.js'
      - 'apps-script/xnk-library/**'
      - 'apps-script/xnk-pusat/**'
      - '.github/workflows/xnk-library.yml'
  workflow_dispatch:
    inputs:
      aksi:
        description: 'buat = buat dua spreadsheet baru (sekali saja); perbarui = terbitkan versi Library baru; buat-pusat = buat proyek XNK Pusat (sekali saja)'
        type: choice
        options: [perbarui, buat, buat-pusat]
        default: perbarui

permissions:
  contents: read

concurrency:
  group: xnk-library
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sintaks kode produksi
        run: node apps-script/pt-scheduler/tools/check-syntax.js
      - name: Tes Library dan kode penghubung
        run: node --test apps-script/xnk-library/tests/*.test.js
      - name: Tes XNK Pusat
        run: node --test apps-script/xnk-pusat/tests/*.test.js
      - name: Tes produksi pada kode Library (perilaku sama)
        run: node apps-script/xnk-library/tools/check-compat.js
      - uses: ./.github/actions/setup-playwright
        with:
          version: '1.63.0'
      - name: Situs coach di browser
        run: node apps-script/xnk-library/tools/tenant-check.js
      - name: Situs hub (dua coach, satu domain) di browser
        run: node apps-script/xnk-library/tools/hub-check.js
      - name: Wizard setup di spreadsheet (browser)
        run: node apps-script/xnk-library/tools/wizard-check.js

  create:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.aksi == 'buat'
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      LIB_ID: ${{ vars.XNK_LIB_SCRIPT_ID }}
      TPL_ID: ${{ vars.XNK_TEMPLATE_SCRIPT_ID }}
    steps:
      - name: Cek
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Secret CLASPRC_JSON belum diatur."; exit 1; fi
          if [ -n "$LIB_ID" ] || [ -n "$TPL_ID" ]; then
            echo "::error::Proyek sudah pernah dibuat (XNK_LIB_SCRIPT_ID / XNK_TEMPLATE_SCRIPT_ID terisi). Hapus variable itu dulu bila memang mau membuat ulang."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @google/clasp@2.4.2
      - name: Kredensial clasp
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Buat spreadsheet XNK Library dan isi kodenya
        id: lib
        run: |
          set -o pipefail
          # clasp create menulis appsscript.json bawaan ke foldernya: buat di folder kosong, lalu pakai scriptId-nya.
          mkdir -p "$RUNNER_TEMP/new-lib" && cd "$RUNNER_TEMP/new-lib"
          clasp create --type sheets --title "XNK Library" 2>&1 | tee "$RUNNER_TEMP/create-lib.log"
          id=$(node -e 'console.log(require("./.clasp.json").scriptId)')
          cd "$GITHUB_WORKSPACE"
          node apps-script/xnk-library/tools/build-lib.js "$RUNNER_TEMP/lib"
          cd "$RUNNER_TEMP/lib"
          printf '{"scriptId":"%s","rootDir":"."}' "$id" > .clasp.json
          printf '**/**\n!*.gs\n!*.html\n!appsscript.json\n' > .claspignore
          clasp push --force 2>&1 | tee push.log
          if grep -qE "GaxiosError|errors: \[|code: [45][0-9][0-9]" push.log; then echo "::error::clasp push Library gagal"; exit 1; fi
          clasp version "XNK Library pertama" 2>&1 | tee version.log
          ver=$(grep -oE 'Created version [0-9]+' version.log | grep -oE '[0-9]+$')
          [ -n "$ver" ] || { echo "::error::Versi Library tidak terbaca"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - name: Buat spreadsheet XNK Template dan isi kode penghubung
        id: tpl
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/new-tpl" && cd "$RUNNER_TEMP/new-tpl"
          clasp create --type sheets --title "XNK Template" 2>&1 | tee create.log
          id=$(node -e 'console.log(require("./.clasp.json").scriptId)')
          cd "$GITHUB_WORKSPACE"
          node apps-script/xnk-library/tools/build-bridge.js "$RUNNER_TEMP/bridge" --lib-id "${{ steps.lib.outputs.id }}" --lib-version "${{ steps.lib.outputs.ver }}"
          cd "$RUNNER_TEMP/bridge"
          printf '{"scriptId":"%s","rootDir":"."}' "$id" > .clasp.json
          printf '**/**\n!*.gs\n!*.html\n!appsscript.json\n' > .claspignore
          cp "$RUNNER_TEMP/new-tpl/create.log" create.log
          clasp push --force 2>&1 | tee push.log
          if grep -qE "GaxiosError|errors: \[|code: [45][0-9][0-9]" push.log; then echo "::error::clasp push Template gagal"; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          grep -oE 'https://drive.google.com/[^ ]+|https://docs.google.com/[^ ]+' create.log | head -1 > url.txt || true
          echo "url=$(cat url.txt)" >> "$GITHUB_OUTPUT"
      - name: Ringkasan
        run: |
          {
            echo "## Dua spreadsheet sudah dibuat"
            echo ""
            echo "Simpan sebagai **repo variable** (Settings → Secrets and variables → Actions → Variables):"
            echo ""
            echo "| Nama | Nilai |"
            echo "| --- | --- |"
            echo "| XNK_LIB_SCRIPT_ID | \`${{ steps.lib.outputs.id }}\` |"
            echo "| XNK_TEMPLATE_SCRIPT_ID | \`${{ steps.tpl.outputs.id }}\` |"
            echo ""
            echo "Library versi ${{ steps.lib.outputs.ver }}. Spreadsheet XNK Template: ${{ steps.tpl.outputs.url }}"
            echo ""
            echo "Langkah berikutnya ada di docs/library/Panduan.md (bagikan Library dan Template, lalu coba setup)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Hapus kredensial
        if: always()
        run: rm -f "$HOME/.clasprc.json"

  deploy:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.aksi == 'perbarui')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # tag lib-v<N> (T-2232)
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      LIB_ID: ${{ vars.XNK_LIB_SCRIPT_ID }}
      TPL_ID: ${{ vars.XNK_TEMPLATE_SCRIPT_ID }}
      XNK_PUSAT_URL: ${{ vars.XNK_PUSAT_URL }}   # langkah "Daftarkan ke XNK Pusat" di wizard XNK Template
    steps:
      - name: Cek pengaturan
        id: cfg
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$LIB_ID" ] || [ -z "$TPL_ID" ]; then
            echo "::notice title=Library belum dibuat::Jalankan workflow ini manual dengan aksi 'buat', lalu simpan dua scriptId sebagai repo variable."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          ref: main
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 20
      - if: steps.cfg.outputs.ready == 'true'
        run: npm install -g @google/clasp@2.4.2
      - name: Kredensial clasp
        if: steps.cfg.outputs.ready == 'true'
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Terbitkan versi Library baru
        id: lib
        if: steps.cfg.outputs.ready == 'true'
        run: |
          set -o pipefail
          node apps-script/xnk-library/tools/build-lib.js "$RUNNER_TEMP/lib"
          cd "$RUNNER_TEMP/lib"
          printf '{"scriptId":"%s","rootDir":"."}' "$LIB_ID" > .clasp.json
          printf '**/**\n!*.gs\n!*.html\n!appsscript.json\n' > .claspignore
          clasp push --force 2>&1 | tee push.log
          if grep -qE "GaxiosError|errors: \[|code: [45][0-9][0-9]|already exists in the current project" push.log; then echo "::error::clasp push Library gagal; versi baru TIDAK dibuat"; exit 1; fi
          clasp version "GitHub $(cd "$GITHUB_WORKSPACE" && git rev-parse --short HEAD)" 2>&1 | tee version.log
          ver=$(grep -oE 'Created version [0-9]+' version.log | grep -oE '[0-9]+$')
          [ -n "$ver" ] || { echo "::error::Versi Library tidak terbaca"; exit 1; }
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      # Workflow "Coach XNK" di repo hub membaca versi Library terbaru dari tag ini: nomor versi di nama tag,
      # scriptId Library di pesan tag, tag menunjuk commit yang membangun versi itu (T-2232).
      - name: Tandai versi Library (tag lib-v<N>)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "lib-v${{ steps.lib.outputs.ver }}" -m "$LIB_ID" HEAD
          git push --force origin "refs/tags/lib-v${{ steps.lib.outputs.ver }}"
      - name: Perbarui kode penghubung XNK Template
        if: steps.cfg.outputs.ready == 'true'
        run: |
          set -o pipefail
          node apps-script/xnk-library/tools/build-bridge.js "$RUNNER_TEMP/bridge" --lib-id "$LIB_ID" --lib-version "${{ steps.lib.outputs.ver }}"
          cd "$RUNNER_TEMP/bridge"
          printf '{"scriptId":"%s","rootDir":"."}' "$TPL_ID" > .clasp.json
          printf '**/**\n!*.gs\n!*.html\n!appsscript.json\n' > .claspignore
          clasp push --force 2>&1 | tee push.log
          if grep -qE "GaxiosError|errors: \[|code: [45][0-9][0-9]" push.log; then echo "::error::clasp push Template gagal"; exit 1; fi
          echo "XNK Template sekarang memakai Library versi ${{ steps.lib.outputs.ver }}." >> "$GITHUB_STEP_SUMMARY"
      - name: Hapus kredensial
        if: always()
        run: rm -f "$HOME/.clasprc.json"

  stable:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pindahkan tag hub-stable ke commit ini
        run: |
          set -e
          git fetch --quiet --force origin 'refs/tags/hub-stable:refs/tags/hub-stable' 2>/dev/null || true
          # Run lama yang selesai belakangan tidak boleh memundurkan tag.
          if git rev-parse -q --verify refs/tags/hub-stable >/dev/null && ! git merge-base --is-ancestor refs/tags/hub-stable "$GITHUB_SHA"; then
            echo "::notice::hub-stable sudah di commit yang lebih baru; dibiarkan."
            exit 0
          fi
          git tag -f hub-stable "$GITHUB_SHA"
          git push --force origin refs/tags/hub-stable
          echo "hub-stable → $(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_STEP_SUMMARY"

  pusat:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.aksi == 'buat-pusat')
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      PUSAT_ID: ${{ vars.XNK_PUSAT_SCRIPT_ID }}
      PUSAT_DEP: ${{ vars.XNK_PUSAT_DEPLOYMENT_ID }}
      AKSI: ${{ github.event_name == 'workflow_dispatch' && inputs.aksi || 'push' }}
    steps:
      - name: Cek pengaturan
        id: cfg
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::notice::Secret CLASPRC_JSON belum diatur."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$AKSI" = "buat-pusat" ]; then
            if [ -n "$PUSAT_ID" ]; then echo "::error::XNK Pusat sudah dibuat (XNK_PUSAT_SCRIPT_ID terisi)."; exit 1; fi
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$PUSAT_ID" ] && [ -n "$PUSAT_DEP" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::XNK Pusat belum dibuat (Run workflow → buat-pusat)."; echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.go == 'true'
        with:
          node-version: 20
      - if: steps.cfg.outputs.go == 'true'
        run: npm install -g @google/clasp@2.4.2
      - name: Kredensial clasp
        if: steps.cfg.outputs.go == 'true'
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Buat atau perbarui XNK Pusat
        if: steps.cfg.outputs.go == 'true'
        run: |
          set -o pipefail
          cp -r apps-script/xnk-pusat/src "$RUNNER_TEMP/pusat" && cd "$RUNNER_TEMP/pusat"
          if [ "$AKSI" = "buat-pusat" ]; then
            mkdir -p "$RUNNER_TEMP/new-pusat" && (cd "$RUNNER_TEMP/new-pusat" && clasp create --type standalone --title "XNK Pusat")
            PUSAT_ID=$(node -e 'console.log(require(process.argv[1]).scriptId)' "$RUNNER_TEMP/new-pusat/.clasp.json")
          fi
          printf '{"scriptId":"%s","rootDir":"."}' "$PUSAT_ID" > .clasp.json
          printf '**/**\n!*.gs\n!appsscript.json\n' > .claspignore
          clasp push --force 2>&1 | tee push.log
          if grep -qE "GaxiosError|errors: \[|code: [45][0-9][0-9]" push.log; then echo "::error::clasp push XNK Pusat gagal"; exit 1; fi
          ver=$(clasp version "GitHub $(cd "$GITHUB_WORKSPACE" && git rev-parse --short HEAD)" | grep -oE 'Created version [0-9]+' | grep -oE '[0-9]+$')
          [ -n "$ver" ] || { echo "::error::Versi XNK Pusat tidak terbaca"; exit 1; }
          if [ "$AKSI" = "buat-pusat" ]; then
            dep=$(clasp deploy -V "$ver" -d "XNK Pusat" | grep -oE 'AKfyc[A-Za-z0-9_-]+' | head -1)
            {
              echo "## XNK Pusat dibuat"
              echo ""
              echo "Simpan sebagai repo variable (Settings → Secrets and variables → Actions → Variables):"
              echo ""
              echo "| Nama | Nilai |"
              echo "| --- | --- |"
              echo "| XNK_PUSAT_SCRIPT_ID | \`$PUSAT_ID\` |"
              echo "| XNK_PUSAT_DEPLOYMENT_ID | \`$dep\` |"
              echo "| XNK_PUSAT_URL | \`https://script.google.com/macros/s/$dep/exec\` |"
              echo ""
              echo "Lalu: buka https://script.google.com/d/$PUSAT_ID/edit → Project Settings → Script Properties: PUSAT_PIN dan PUSAT_ENROLL_CODE (min 8), GITHUB_TOKEN (opsional) → jalankan setupPusat sekali. Isi pusatUrl di hub.json repo hub. Lihat docs/library/Pusat.md."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            clasp deploy -i "$PUSAT_DEP" -V "$ver" -d "GitHub" | tee deploy.log
            echo "XNK Pusat diperbarui ke versi $ver." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Hapus kredensial
        if: always()
        run: rm -f "$HOME/.clasprc.json"
