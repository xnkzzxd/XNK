name: Push

# Fase X (docs/push): mengirim Web Push. Apps Script merencanakan notifikasi (sheet PushOutbox), workflow ini mengambilnya
# lewat doPost (pushRelayPull), mengirimnya dengan web-push (VAPID), lalu melapor hasilnya (pushRelayAck).
# Satu-satunya rahasia di GitHub: PUSH_RELAY_SECRET (kunci VAPID diambil dari Apps Script lewat pushRelayPull). Tanpa secret itu
# langkah kirim langsung selesai tanpa melakukan apa-apa.
# Jadwal GitHub paling cepat 5 menit dan kadang telat; permintaan perpanjang paket dibangunkan seketika oleh Apps Script
# lewat repository_dispatch bila Script Property PUSH_GH_TOKEN terpasang.
on:
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [push-now]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web-push
        run: npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$RUNNER_TEMP/wp" web-push@3.6.7
      - name: Send
        env:
          NODE_PATH: ${{ runner.temp }}/wp/node_modules
          PT_DEPLOYMENT_ID: ${{ vars.PT_DEPLOYMENT_ID }}
          PUSH_RELAY_SECRET: ${{ secrets.PUSH_RELAY_SECRET }}
        run: node apps-script/pt-scheduler/tools/push-send.js
